<!doctype html><html lang="en"><head><script src="/lang.js?v=3"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The abyss · Igor time</title><meta name="description" content="Igor dives into the abyss: eat the pale creatures, jump the red ones, duck the jellyfish, and beat the leviathans."><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#04070c;color:#dbe7ea;min-height:100vh}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<header id="top"><a id="back" href="/">← Igor’s island</a><h1><em>The</em> abyss</h1><span id="acct"></span></header>
<div id="ab">
  <canvas id="ab-c" width="600" height="300"></canvas>
  <div id="ab-hud">
    <div id="ab-sc"><b id="ab-s">0</b><i id="ab-sl">depth</i></div>
    <div id="ab-l"></div>
  </div>
  <div id="ab-am"><span id="ab-amn">0</span> prey</div>
  <div id="ab-pw"><i id="ab-pwb"></i></div>
  <div id="ab-m"><div id="ab-mc"></div></div>
  <div id="ab-btns">
    <button id="ab-a" type="button"><span>A</span>tongue</button>
    <button id="ab-j" type="button"><span>S</span>jump</button>
    <button id="ab-d" type="button"><span>D</span>duck</button>
    <button id="ab-f" type="button"><span>␣</span>shoot</button>
  </div>
</div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap');
#ab{--abyss:#04070c;--ink:#dbe7ea;--dim:#7f949b;--glow:#7fe3ef;--bone:#efe4cf;--danger:#ff4f6d;--gold:#ffcf5c;
  --display:'Instrument Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  position:relative;width:min(100vw - 24px,960px,(100vh - 190px)*2);min-width:280px;margin:0 auto;color:var(--ink);font-family:var(--mono);user-select:none;-webkit-user-select:none}
#ab-c{display:block;width:100%;height:auto;border-radius:16px;background:#04070c;touch-action:manipulation;
  box-shadow:0 0 0 1px rgba(127,227,239,.14),0 10px 50px rgba(0,0,0,.5),inset 0 0 90px rgba(4,7,12,.9)}
#ab-hud{position:absolute;top:13px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#ab-sc{display:flex;flex-direction:column;line-height:1}
#ab-sc b{font-family:var(--display);font-size:30px;color:var(--glow);text-shadow:0 0 14px rgba(127,227,239,.55);letter-spacing:.01em}
#ab-sc i{font-style:normal;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:3px}
#ab-l{display:flex;gap:5px}
#ab-l span{width:11px;height:11px;border-radius:50%;background:var(--danger);box-shadow:0 0 9px var(--danger);display:block}
#ab-l span.off{background:transparent;box-shadow:none;border:1px solid rgba(127,148,155,.5)}
#ab-am{position:absolute;top:50px;right:16px;font-size:10px;letter-spacing:.12em;color:var(--bone);pointer-events:none;text-shadow:0 0 8px rgba(239,228,207,.3)}
#ab-am span{color:var(--glow);font-weight:500}
#ab-pw{position:absolute;top:52px;left:16px;width:118px;height:5px;background:rgba(127,227,239,.12);border-radius:4px;overflow:hidden;opacity:0;transition:opacity .25s}
#ab-pwb{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--glow),var(--bone));box-shadow:0 0 12px var(--glow)}
#ab-m{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:18px;border-radius:16px;
  background:radial-gradient(ellipse at 50% 42%,rgba(4,7,12,.55),rgba(4,7,12,.93) 78%);backdrop-filter:blur(3px);overflow:auto}
#ab-mc{max-width:430px;margin:auto 0;padding:6px 0}
#ab-mc .eye{font-family:var(--display);font-style:italic;font-size:clamp(30px,7vw,46px);line-height:1;color:var(--ink);margin:0 0 4px}
#ab-mc .eye em{color:var(--glow);font-style:italic}
#ab-mc .sub{font-size:11px;line-height:1.75;color:var(--dim);margin:0 0 16px}
#ab-mc .sub b{color:var(--ink);font-weight:500}
#ab-mc .sub .g{color:var(--glow)}
#ab-mc .sub .r{color:var(--danger)}
#ab-mc .sub .y{color:var(--gold)}
#ab-mc .lb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
#ab-mc ol{list-style:none;margin:0 auto 16px;padding:0;max-width:260px;text-align:left;display:grid;gap:3px}
#ab-mc li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink);border-bottom:1px solid rgba(127,148,155,.14);padding:3px 2px}
#ab-mc li .rk{color:var(--dim);margin-right:8px}
#ab-mc li.me{color:var(--glow)}
#ab-mc input{font:inherit;font-size:15px;padding:8px 12px;border:1px solid rgba(127,227,239,.4);border-radius:10px;width:160px;text-align:center;
  background:rgba(127,227,239,.06);color:var(--ink);outline:none}
#ab-mc input:focus{border-color:var(--glow);box-shadow:0 0 14px rgba(127,227,239,.25)}
#ab-mc .btn{font:500 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:11px 26px;margin:5px 4px 0;cursor:pointer;border-radius:999px;
  background:var(--glow);color:var(--abyss);border:1px solid var(--glow);box-shadow:0 0 22px rgba(127,227,239,.3)}
#ab-mc .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:rgba(219,231,234,.35)}
#ab-mc .btn:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
#ab-mc .saved{font-size:12px;color:var(--glow);margin:4px 0}
#ab-btns{display:flex;gap:7px;margin-top:11px}
#top{display:flex;align-items:center;gap:14px;max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;font-family:'IBM Plex Mono',monospace}
#top h1{margin:0;flex:1;font:400 28px/1 'Instrument Serif',Georgia,serif;color:#dbe7ea}#top h1 em{color:#7fe3ef}
#back{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#dbe7ea;text-decoration:none;border:1px solid rgba(219,231,234,.3);border-radius:999px;padding:9px 13px;white-space:nowrap}
#back:hover{border-color:#7fe3ef;color:#7fe3ef}#acct{font-size:11px;color:#7f949b}
#ab-mc .avrow{display:flex;gap:8px;justify-content:center;margin:0 0 6px}#ab-mc .avb{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--ink);background:rgba(127,227,239,.04);border:1px solid rgba(219,231,234,.25);border-radius:14px;padding:6px 10px 8px;cursor:pointer}#ab-mc .avb canvas{width:66px;height:46px}#ab-mc .avb.on{border-color:var(--glow);color:var(--glow)}
#ab-mc .seeds{font-size:13px;color:#9be38a;margin:2px 0 10px}
@media (hover:hover) and (pointer:fine){#ab-btns{opacity:.75}}
@media (max-width:520px){#top h1{font-size:22px}#acct{display:none}}
#ab-m{position:fixed!important;inset:0;border-radius:0;z-index:10;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 24px}
#ab-btns button{flex:1;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:12px 4px 10px;cursor:pointer;border-radius:12px;
  background:rgba(127,227,239,.05);color:var(--ink);border:1px solid rgba(127,227,239,.22);line-height:1.2;transition:background .15s}
#ab-btns button span{display:block;font-family:var(--display);font-style:italic;font-size:17px;color:var(--glow);margin-bottom:2px}
#ab-btns button:active{background:rgba(127,227,239,.18)}
</style>

function lashesAt(g,e,n){g.save();g.strokeStyle='#111';g.lineCap='round';g.lineWidth=3.2;for(let i=0;i<n;i++){const a=(-120+i*(60/(Math.max(n,2)-1)))*Math.PI/180;g.beginPath();g.moveTo(e.x+e.rx*Math.cos(a),e.y+e.ry*Math.sin(a));g.lineTo(e.x+(e.rx+10)*Math.cos(a-.12),e.y+(e.ry+10)*Math.sin(a-.12));g.stroke()}g.restore()}
function bowAt(g,x,y,s,col){g.save();g.fillStyle=col;g.strokeStyle='#141414';g.lineWidth=1.8;g.lineJoin='round';for(const d of[-1,1]){g.beginPath();g.moveTo(x,y);g.lineTo(x+d*s,y-s*.7);g.lineTo(x+d*s,y+s*.7);g.closePath();g.fill();g.stroke()}g.beginPath();g.arc(x,y,s*.3,0,7);g.fill();g.stroke();g.restore()}

  plankton=[];
  for(let layer=0;layer<3;layer++){const n=[26,20,14][layer];
    for(let i=0;i<n;i++)plankton.push({x:Math.random()*W,y:Math.random()*(GY-6),z:layer,r:[.6,1.1,1.8][layer]+Math.random()*.6,ph:Math.random()*7,sp:[.12,.26,.5][layer]})}
  shafts=[];for(let i=0;i<4;i++)shafts.push({x:Math.random()*W,w:40+Math.random()*60,ph:Math.random()*7,sp:4+Math.random()*5});

function score(){return Math.floor(dist/12)+bonus}
function reset(){mode='run';playing=true;dist=0;speed=2.0;bonus=0;lives=3;menuDraw();ammo=0;power=0;jy=0;vy=0;tongue=0;flash=0;shake=0;dHold=false;duckTimer=0;hueT=0;
  ants=[];fx=[];bubbles=[];boss=null;nextBoss=700;bossIdx=0;spawn=50;savedThis=false;dispScore=0;camZoom=1.045;camY=0;zoomKick=0;squash=1;hitStop=0;

// inputs
function jump(){if(!playing)return;if(grounded){vy=-10.2;squash=1.14;zoomKick+=.018;beep(300,'sine',.18,.16,620);puff(AX,GY-6,COL.glow,7)}}
function eat(){if(!playing)return;if(jy>4)return;tongue=17;beep(240,'sine',.12,.12,520)}
function duckOn(){if(!playing)return;if(!dHold){dHold=true;duckTimer=0;beep(360,'sine',.1,.1,180)}}
function duckOff(){dHold=false}
function shoot(){if(!playing||mode!='boss')return;if(ammo>0){ammo--;AM.textContent=ammo;fx.push({x:AX+30,y:MOY,vx:9,vy:0,r:4,a:1,c:COL.glow,shot:true});beep(760,'triangle',.1,.16,980)}else beep(150,'sine',.1,.08)}

function die(){playing=false;mode='dead';showOver()}
function rnd(s){return (Math.random()*2-1)*s}
function puff(px,py,col,n){for(let k=0;k<n;k++)fx.push({x:px,y:py,vx:rnd(2.2),vy:-Math.random()*2.6,r:1+Math.random()*2.4,a:1,c:col,bub:true})}
function ring(px,py,col){fx.push({ring:1,x:px,y:py,r:5,rr:2.8,a:.85,c:col})}

function phys(dt){
  const wasGround=grounded;
  vy+=.44*dt;jy-=vy*dt;if(jy<0){jy=0;vy=0}
  grounded=jy<4;
  if(!wasGround&&grounded){squash=0.66;zoomKick+=.016;shake=Math.max(shake,4);ring(AX,GY-2,COL.glow);puff(AX,GY-4,COL.glow,5)}
  squash+=(1-squash)*.18;
  ducking=dHold&&grounded&&duckTimer<DUCKMAX;if(ducking)duckTimer+=dt;
  if(tongue>0)tongue-=dt;
  if(power>0){power-=dt;PWB.style.width=(power/POWERT*100)+'%';if(power<=0)PW.style.opacity=0}
  if(flash>0)flash-=dt;if(shake>0)shake-=dt;
  // hero bubble trail
  if(Math.random()<.4)bubbles.push({x:AX+rnd(10),y:GY-IH*.55-jy+rnd(14),r:.8+Math.random()*1.8,vy:.5+Math.random()*.8,a:.5});
}

// ---------- RUN ----------
function addAnt(){const r=Math.random(),t=r<.03?'gold':r<.07?'heart':r<.23?'fly':r<.55?'red':'black';ants.push({x:W+30,t,ph:Math.random()*7,done:false})}
function runUpdate(dt){
  dist+=speed*dt;speed=Math.min(2.0+dist*.00032,6.3);hueT+=dt;
  phys(dt);
  if(score()>=nextBoss){enterBoss();return}
  spawn-=dt;if(spawn<=0){addAnt();const ph=(dist*.0016)%1,burst=ph<0.3,base=Math.max(300-dist*.03,175),mul=burst?0.5:1.35;spawn=base*mul/speed*(0.85+Math.random()*.3)}
  const air=jy>8,tActive=tongue>2,reach=AX+185,mouthX=AX+8;
  for(let i=ants.length-1;i>=0;i--){const a=ants[i];a.x-=speed*dt;let rm=false;
    if(!a.done){
      const inT=tActive&&!air&&a.x>mouthX&&a.x<reach,atBody=a.x<AX+18&&a.x>AX-16;
      if(a.t=='fly'){
        if(atBody){if(ducking)a.done=true;else{a.done=true;rm=true;hurt()}}
      } else if(a.t=='heart'){
        if(inT||(atBody&&!air)){a.done=true;rm=true;burst3(a.x,GY-14,COL.danger);if(lives<5){lives++;drawLives()}beep(540,'sine',.3,.18,760)}
      } else if(inT&&(a.t=='black'||a.t=='gold'||(a.t=='red'&&power>0))){
        a.done=true;rm=true;burst3(a.x,GY-10,a.t=='gold'?COL.gold:COL.glow);ammo++;AM.textContent=ammo;
        if(a.t=='gold'){power=POWERT;PW.style.opacity=1;PWB.style.width='100%';bonus+=10;hitStop=3;zoomKick+=.03;ring(a.x,GY-10,COL.gold);beep(660,'triangle',.3,.2,1320)}
        else{bonus+=a.t=='red'?15:5;beep(a.t=='red'?520:380,'sine',.14,.14,a.t=='red'?300:560)}
      } else if(atBody&&jy<4){
        if(a.t=='black'||(a.t=='red'&&power<=0)){a.done=true;rm=true;hurt()}
        else a.done=true;
      }
    }
    if(rm||a.x<-40)ants.splice(i,1)}
  drawScene(()=>{for(const a of ants)drawCreature(a)});
  dispScore+=(score()-dispScore)*.2;S.textContent=Math.round(dispScore);
}

  phys(dt);boss.ph+=dt;
  const bsp=3.1+bossIdx*.3,list=boss.list=boss.list||[];
  boss.fireT-=dt;if(boss.fireT<=0){fireBossAnt();boss.fireT=Math.max(92-bossIdx*9,54)*(0.75+Math.random()*.5)}
  boss.shieldT-=dt;if(boss.shieldT<=0){boss.shield=!boss.shield;boss.shieldT=boss.shield?SHIELD_ON:SHIELD_OFF;beep(boss.shield?210:820,'sine',.18,.14)}
  const air=jy>8,tActive=tongue>2,reach=AX+175,mouthX=AX+8;
  for(let i=list.length-1;i>=0;i--){const a=list[i];a.x-=bsp*dt;let rm=false;const atBody=a.x<AX+18&&a.x>AX-16;
    if(!a.done){
      if(a.t=='black'){
        if(tActive&&!air&&a.x>mouthX&&a.x<reach){a.done=true;rm=true;ammo++;AM.textContent=ammo;burst3(a.x,GY-10,COL.glow);beep(440,'sine',.12,.14,620)}
      } else if(a.t=='fly'){
        if(atBody){if(ducking)a.done=true;else{a.done=true;rm=true;hurt()}}
      } else {
        if(atBody){if(jy<4){a.done=true;rm=true;hurt()}else a.done=true}
      }
    }
    if(rm||a.x<-40)list.splice(i,1)}
  // shots
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];if(!f.shot)continue;f.x+=f.vx*dt;
    if(f.x>=boss.x-26){if(boss.shield){burst3(boss.x-38,f.y,COL.dim);fx.splice(i,1);beep(200,'sine',.08,.1)}
      else{boss.hp--;burst3(boss.x-24,f.y,COL.danger);ring(boss.x-24,f.y,COL.danger);fx.splice(i,1);shake=7;hitStop=3;zoomKick+=.02;beep(300,'triangle',.14,.16,180);if(boss.hp<=0){bossDie();return}}}
    else if(f.x>W+10)fx.splice(i,1)}
  drawScene(()=>{drawBoss();for(const a of list)drawCreature(a)},true);
  dispScore+=(score()-dispScore)*.2;S.textContent=Math.round(dispScore);
}
function bossDie(){bonus+=40*bossIdx;for(let k=0;k<26;k++)fx.push({x:boss.x-24+rnd(30),y:GY-46+rnd(34),vx:rnd(4),vy:rnd(4),r:1.5+Math.random()*3,a:1,c:k%2?COL.glow:COL.danger});beep(520,'triangle',.4,.2,1040);beep(780,'sine',.5,.16,1560);shake=16;boss=null;mode='run';nextBoss+=1500;spawn=50}

// ---------- RENDER ----------
function glowDot(px,py,r,col,al){x.save();x.globalCompositeOperation='lighter';const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=al;x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.restore()}
function hx(col,a){if(col[0]!='#')return col;const n=parseInt(col.slice(1),16);return'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}

function bg(stat){
  // depth gradient
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,stat?'#0b0710':'#071420');g.addColorStop(.5,'#061019');g.addColorStop(1,COL.abyss);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const t=performance.now()*.001;
  // light shafts from above
  x.save();x.globalCompositeOperation='lighter';
  for(const s of shafts){const sx=s.x+Math.sin(t*.1+s.ph)*18;const grad=x.createLinearGradient(sx,0,sx-30,GY);
    grad.addColorStop(0,'rgba(127,227,239,.07)');grad.addColorStop(1,'rgba(127,227,239,0)');
    x.fillStyle=grad;x.beginPath();x.moveTo(sx-s.w/2,0);x.lineTo(sx+s.w/2,0);x.lineTo(sx+s.w/2-34,GY);x.lineTo(sx-s.w/2-34,GY);x.closePath();x.fill()}
  x.restore();
  // parallax plankton
  for(const p of plankton){p.x-=p.sp*(1+(playing?speed*.14:.3));if(p.x<-4)p.x=W+4,p.y=Math.random()*(GY-6);
    const tw=.3+.5*(.5+.5*Math.sin(t*2+p.ph));glowDot(p.x,p.y,p.r*2.4,hx(COL.glow,1),tw*[.25,.4,.6][p.z])}
  // seabed glow line
  const sg=x.createLinearGradient(0,GY-10,0,H);sg.addColorStop(0,'rgba(127,227,239,0)');sg.addColorStop(.25,'rgba(10,30,38,.5)');sg.addColorStop(1,'rgba(2,5,9,.9)');
  x.fillStyle=sg;x.fillRect(0,GY-10,W,H-GY+10);
  x.save();x.globalCompositeOperation='lighter';x.strokeStyle='rgba(127,227,239,.5)';x.lineWidth=1.4;x.beginPath();
  for(let i=0;i<=W;i+=8){const yy=GY+Math.sin(i*.05+ (playing?dist*.03:t))*2.2;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke();
  x.strokeStyle='rgba(127,227,239,.1)';x.lineWidth=2;for(let k=0;k<3;k++){x.beginPath();for(let i=0;i<=W;i+=12){const yy=GY+9+k*7+Math.sin(i*.08+t*2+k*1.7)*3;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}
  x.restore();
  // ridge silhouettes
  x.fillStyle='rgba(3,10,14,.85)';for(let k=0;k<3;k++){const off=(k*260-(playing?dist*(.1+k*.08):t*10))%(W+260);const bx=((off%(W+260))+W+260)%(W+260)-130;
    x.beginPath();x.moveTo(bx-130,H);x.quadraticCurveTo(bx,GY-6-k*4,bx+130,H);x.fill()}
}
function bloom(){bx2.clearRect(0,0,bw,bh);bx2.globalCompositeOperation='source-over';bx2.drawImage(c,0,0,bw,bh);
  x.save();x.globalCompositeOperation='lighter';x.imageSmoothingEnabled=true;x.globalAlpha=.5;x.drawImage(bloomC,0,0,W,H);x.globalAlpha=.26;x.drawImage(bloomC,0,0,W,H);x.restore()}
function drawScene(mid,stat){
  camY+=((-jy*0.10)-camY)*.1;
  const zt=1.045+(mode=='boss'?.028:0)+zoomKick;camZoom+=(zt-camZoom)*.12;zoomKick*=.86;
  const ox=shake>0?rnd(shake*.5):0,oy=shake>0?rnd(shake*.5):0;
  x.save();
  x.translate(W/2+ox,H/2+oy);x.scale(camZoom,camZoom);x.translate(-W/2,-H/2+camY);
  bg(stat);
  mid();
  drawBubbles();
  drawCone();
  drawHero();
  drawFx();
  drawFg();
  if(power>0)powerAura();
  x.restore();
  bloom();
  if(flash>0){x.save();x.globalCompositeOperation='lighter';x.fillStyle=hx(COL.danger,.14*(flash/12));x.fillRect(0,0,W,H);x.restore()}
  const v=x.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
}
function drawCone(){if(!playing)return;const hx0=AX+24,hy=GY-IH*.5-jy;x.save();x.globalCompositeOperation='lighter';
  const g=x.createLinearGradient(hx0,hy,hx0+160,hy+24);g.addColorStop(0,'rgba(127,227,239,.13)');g.addColorStop(1,'rgba(127,227,239,0)');
  x.fillStyle=g;x.beginPath();x.moveTo(hx0,hy-7);x.lineTo(hx0+175,hy-42);x.lineTo(hx0+175,hy+64);x.lineTo(hx0,hy+11);x.closePath();x.fill();x.restore()}
function drawFg(){x.save();x.globalCompositeOperation='lighter';for(const p of fg){p.x-=p.sp*(1+(playing?speed*.2:.3));if(p.x<-p.r){p.x=W+p.r;p.y=20+Math.random()*(GY-30)}glowDot(p.x,p.y,p.r,hx(COL.glow,1),p.a)}x.restore()}
function powerAura(){x.save();x.globalCompositeOperation='lighter';const py=GY-IH*.5-jy;glowDot(AX,py,70,hx(COL.glow,1),.12+.05*Math.sin(hueT*6));x.restore()}
function drawBubbles(){x.save();x.globalCompositeOperation='lighter';for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.vy;b.x-=speed*.3;b.a-=.012;
  if(b.a<=0||b.y<0){bubbles.splice(i,1);continue}x.strokeStyle=hx(COL.glow,b.a*.6);x.lineWidth=1;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke()}x.restore()}
function drawFx(){x.save();x.globalCompositeOperation='lighter';for(let i=fx.length-1;i>=0;i--){const f=fx[i];
  if(f.ring){f.r+=f.rr;f.rr*=.94;f.a-=.045;if(f.a<=0){fx.splice(i,1);continue}x.strokeStyle=hx(f.c,f.a);x.lineWidth=2;x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.stroke();continue}
  if(f.shot){glowDot(f.x,f.y,9,hx(COL.glow,1),.9);x.fillStyle=COL.bone;x.beginPath();x.arc(f.x,f.y,2.6,0,7);x.fill();continue}
  f.x+=(f.vx||0);f.y+=(f.vy||0);if(f.bub){f.vy+=.02}else{f.vx*=.92;f.vy=(f.vy||0)*.92+.04}f.a-=.03;f.r+=.4;
  if(f.a<=0){fx.splice(i,1);continue}glowDot(f.x,f.y,f.r*2.4,hx(f.c,1),f.a*.8)}x.restore()}

function drawHero(){const py=GY+2-jy+(grounded&&playing?Math.sin(dist*.18)*2.2:0);
  glowDot(AX,py-IH*.42,46,hx(COL.glow,1),.10);
  let st=1;if(!grounded)st=1+Math.max(-.16,Math.min(.2,vy*0.02));
  const dk=ducking?0.58:1,sy=st*squash*dk,sxx=1/Math.sqrt(Math.max(.4,st*squash));
  x.save();x.globalAlpha=flash>0&&(flash|0)%2?.45:1;x.translate(AX,py);
  x.scale(sxx,sy);
  const im=(tongue>0&&okT())?(heroT||imgT):(okN()?(heroN||imgN):null);
  if(im){x.save();x.globalCompositeOperation='lighter';x.globalAlpha=.25;x.drawImage(im,-HCX*SCL-1,-IH-1,CW*SCL+2,CH*SCL+2);x.restore();x.drawImage(im,-HCX*SCL,-IH,CW*SCL,CH*SCL)}
  else heroVec();
  x.restore();
}
function heroVec(){x.lineJoin='round';x.fillStyle='#9ED61E';x.strokeStyle='#1d2a0a';x.lineWidth=3;x.beginPath();x.ellipse(-8,-42,32,40,0,0,7);x.fill();x.stroke();
  x.beginPath();x.moveTo(14,-60);x.quadraticCurveTo(70,-54,62,-28);x.quadraticCurveTo(56,-18,38,-30);x.quadraticCurveTo(22,-42,14,-52);x.closePath();x.fill();x.stroke();
  x.fillStyle='#fff';x.beginPath();x.arc(16,-64,7,0,7);x.fill();x.stroke();x.fillStyle='#1d2a0a';x.beginPath();x.arc(18,-64,3.2,0,7);x.fill()}

// creatures (bioluminescent)
function legs(col,s){x.strokeStyle=col;x.lineWidth=1.2;const w=Math.sin(performance.now()*.02)*2;for(const dx of[-4,0,4]){x.beginPath();x.moveTo(dx,-5);x.lineTo(dx-3,1+w);x.stroke();x.beginPath();x.moveTo(dx,-5);x.lineTo(dx+3,1-w);x.stroke()}}
function drawCreature(a){const t=performance.now()*.004+a.ph;
  if(a.t=='heart'){const px=a.x,py=GY-16;glowDot(px,py,16,hx(COL.danger,1),.5);x.save();x.translate(px,py);const p=1+Math.sin(t*2)*.1;x.scale(p,p);
    x.fillStyle=COL.danger;x.strokeStyle=hx('#ffffff',.6);x.lineWidth=1;x.beginPath();x.moveTo(0,5);x.bezierCurveTo(-9,-5,-8,-14,0,-8);x.bezierCurveTo(8,-14,9,-5,0,5);x.fill();x.stroke();x.restore();return}
  if(a.t=='fly'){const px=a.x,py=FLY+Math.sin(t*1.4)*5;glowDot(px,py,22,hx(COL.danger,1),.45);x.save();x.translate(px,py);
    const bell=.8+.25*Math.abs(Math.sin(t*2.4));x.fillStyle=hx(COL.danger,.85);x.strokeStyle=hx('#ffd0da',.7);x.lineWidth=1.2;
    x.beginPath();x.ellipse(0,0,9,7*bell,0,Math.PI,0);x.fill();x.stroke();
    x.strokeStyle=hx(COL.danger,.8);x.lineWidth=1.4;for(let k=-2;k<=2;k++){x.beginPath();x.moveTo(k*3.4,0);x.quadraticCurveTo(k*3.4+Math.sin(t*3+k)*3,8,k*3.4+Math.sin(t*2+k)*4,16);x.stroke()}x.restore();return}
  if(a.t=='gold'){const px=a.x,py=GY-14+Math.sin(t*2)*3;glowDot(px,py,24,hx(COL.gold,1),.6);x.save();x.translate(px,py);
    // anglerfish lure
    x.strokeStyle=hx(COL.gold,.7);x.lineWidth=1.3;x.beginPath();x.moveTo(0,-6);x.quadraticCurveTo(6,-18,2,-24);x.stroke();glowDot(2,-24,8,hx(COL.gold,1),.9);
    x.fillStyle=hx(COL.gold,.9);x.strokeStyle=hx('#fff4d0',.8);x.lineWidth=1.4;x.beginPath();x.arc(0,0,7,0,7);x.fill();x.stroke();
    x.fillStyle=COL.abyss;x.font='bold 10px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('★',0,.5);x.restore();return}
  // red (floor) or black (edible)
  const danger=a.t=='red',col=danger?COL.danger:COL.bone,px=a.x,py=GY-6;
  glowDot(px,py,danger?16:12,hx(col,1),danger?.5:.42);
  x.save();x.translate(px,py);const s=danger?1.5:1.05;x.scale(s,s);
  if(danger&&power>0){x.globalCompositeOperation='lighter'}
  x.fillStyle=col;legs(hx(col,.9),s);
  for(const[bx,r] of[[-6,3.3],[0,4],[6,3.2]]){x.beginPath();x.arc(bx,-6,r,0,7);x.fill()}
  // antennae
  x.strokeStyle=hx(col,.9);x.lineWidth=1.1;x.beginPath();x.moveTo(-6,-8);x.lineTo(-10,-13);x.moveTo(-6,-8);x.lineTo(-11,-10);x.stroke();
  x.restore()}

function drawBoss(){const bx=boss.x,by=GY-34,t=boss.ph;
  glowDot(bx-8,by,70,hx(COL.danger,1),.16+.05*Math.sin(t*2));
  x.save();x.translate(bx,by);
  // leviathan body (dark mass)
  x.fillStyle='rgba(8,16,22,.96)';x.strokeStyle=hx(COL.danger,.45);x.lineWidth=2;
  x.beginPath();x.ellipse(6,0,34,26,0,0,7);x.fill();x.stroke();
  // jaw
  x.beginPath();x.moveTo(-24,-4);x.quadraticCurveTo(-44,-2,-50,6);x.quadraticCurveTo(-40,10,-24,10);x.closePath();x.fill();x.stroke();
  // teeth
  x.fillStyle=hx(COL.bone,.8);for(let k=0;k<5;k++){x.beginPath();x.moveTo(-44+k*5,2);x.lineTo(-42+k*5,8);x.lineTo(-40+k*5,2);x.fill()}
  // eye
  glowDot(18,-8,7,hx(COL.danger,1),.9);x.fillStyle=COL.danger;x.beginPath();x.arc(18,-8,3.2,0,7);x.fill();
  // lure
  x.strokeStyle=hx(COL.gold,.6);x.lineWidth=1.3;x.beginPath();x.moveTo(24,-18);x.quadraticCurveTo(44,-34,30,-40);x.stroke();glowDot(30,-40,9,hx(COL.gold,1),.8);
  x.restore();
  // shield ring of small creatures
  if(boss.shield){x.save();x.globalCompositeOperation='lighter';for(let k=0;k<7;k++){const yy=by-30+k*9,xx=bx-46+Math.sin(t*3+k)*2;glowDot(xx,yy,9,hx(COL.glow,1),.5);x.fillStyle=hx(COL.glow,.8);x.beginPath();x.arc(xx,yy,2.4,0,7);x.fill()}x.restore();}
  else{x.save();x.globalCompositeOperation='lighter';x.fillStyle=hx(COL.gold,.6+.4*Math.sin(t*6));x.font='italic 15px "Instrument Serif",serif';x.textAlign='center';x.fillText('hit it!',bx-30,by-44);x.restore()}
  // hp bar
  const bw=150,bxp=W/2-bw/2;x.fillStyle='rgba(127,227,239,.12)';x.fillRect(bxp,16,bw,7);
  x.save();x.globalCompositeOperation='lighter';x.fillStyle=COL.danger;x.fillRect(bxp,16,bw*boss.hp/boss.max,7);x.restore();
  x.fillStyle=COL.dim;x.font='500 9px "IBM Plex Mono",monospace';x.textAlign='center';x.textBaseline='alphabetic';
  x.fillText('LEVIATHAN '+bossIdx+'  ·  '+boss.hp+'/'+boss.max+(boss.shield?'  ·  shield':'  ·  open'),W/2,13)}

function loop(t){if(!playing)return;const dt=Math.min((t-last)/16.7,3);last=t;
  if(hitStop>0){hitStop-=dt;if(mode=='run')drawScene(()=>{for(const a of ants)drawCreature(a)});else if(mode=='boss')drawScene(()=>{drawBoss();for(const a of (boss&&boss.list||[]))drawCreature(a)},true);requestAnimationFrame(loop);return}

  requestAnimationFrame(loop)}

function showOver(){mode='dead';M.style.display='flex';const sc=score();

  const seeds=won>0?'<p class="seeds">+'+won+' tofu seed'+(won>1?'s':'')+' for Igor’s field. Collect them back on the island.</p>':'<p class="seeds" style="color:#7f949b">200 points give a tofu seed: dive deeper next time.</p>';
  if(!savedThis){savedThis=true;lb.forEach(e=>delete e._me);if(sc>0){lb.push({n:(ACCT&&ACCT.name)||'you',s:sc,_me:1});lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,20);saveLB()}
   if(ACCT){diveMsg='carving your depth into the annals…';if(sc>0)submitDive(sc);else diveMsg='No depth to carve this time.'}
   else{const best=Math.max(0,...lb.map(e=>e.s));diveMsg='Your best on this device: <span class="g">'+best+'</span>. <a href="'+HOME+'" style="color:inherit">Sign in on the island</a> to carve your name in the annals.'}}

    '<p class="lb">Total depth · everyone</p>'+lbHTML()+'<div><button class="btn ghost" id="ab-go">Again</button> <a class="btn" style="text-decoration:none;display:inline-block" href="'+HOME+'">Back to the island</a></div>';
  $('ab-go').onclick=()=>{won=0;reset()};startIdle()}

addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k=='a'){eat();e.preventDefault()}else if(k=='s'){jump();e.preventDefault()}else if(k=='d'){duckOn();e.preventDefault()}else if(k==' '){shoot();e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key.toLowerCase()=='d')duckOff()});

(()=>{const b=$('ab-d');b.addEventListener('pointerdown',e=>{e.preventDefault();duckOn()});b.addEventListener('pointerup',e=>{e.preventDefault();duckOff()});b.addEventListener('pointerleave',duckOff);b.addEventListener('pointercancel',duckOff)})();

lives=3;
