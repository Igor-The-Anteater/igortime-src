 if(!SES){chalk(s*.9,600);g.fillText(tt('Drum school','Scuola di batteria'),cx,B.y+B.h*.36);chalk(s*.6);g.fillText('🥁  ♪  🤘',cx,B.y+B.h*.64);return}
 if(SES.phase==='calib'){calibBoard(B,s);return}
 const ex=SES.ex,ln=lanes(ex),cyc=cycleSteps(ex),now=AC?AC.currentTime:0;
 chalk(Math.max(12,s*.42));g.globalAlpha=.75;g.fillText(`${T2(ST[ex.si].n)} · ${ex.k+1}/6 · ${ex.bpm} bpm`,cx,B.y+B.h*.08);g.globalAlpha=1;
 // the grid: one row per drum, one column per step (one or two bars)
 g.font=`600 ${Math.max(10,Math.min(s*.62,16))}px Fredoka,sans-serif`;const lw=Math.max(...ln.map(k=>g.measureText(T2(P[k].n)).width));
 const x0=B.x+Math.max(B.w*.06,lw+16),x1=B.x+B.w*.97,y0=B.y+B.h*.2,y1=B.y+B.h*(SES.res?.74:.84),cw=(x1-x0)/cyc,rh=Math.min((y1-y0)/(ln.length+.6),s*1.6),gy=y0+((y1-y0)-rh*(ln.length+.6))/2;
 const per=ex.G/4;
 for(let c=0;c<cyc;c++){const x=x0+c*cw;if(c%per===0){g.fillStyle=c%ex.G===0?'rgba(255,255,255,.1)':'rgba(255,255,255,.05)';g.fillRect(x+1,gy,cw*per-2,rh*ln.length)}}
 chalk(Math.max(9,Math.min(rh*.42,cw*.75)),600);for(let c=0;c<cyc;c++){const lab=countLab(ex.G,c%ex.G);g.globalAlpha=c%per===0?.95:.5;g.fillText(lab,x0+(c+.5)*cw,gy+rh*(ln.length+.35))}g.globalAlpha=1;
 // where are we?
 let cur=-1,cycN=0;if(SES.t0&&now>=SES.t0&&now<SES.end){const st=(now-SES.t0)/(SES.bt*4/ex.G);cur=Math.floor(st)%cyc;cycN=Math.floor(Math.floor(st)/cyc)}
 ln.forEach((k,r)=>{const y=gy+rh*(r+.5),col=P[k].col;g.font=`600 ${Math.max(10,Math.min(s*.62,16))}px Fredoka,sans-serif`;g.textAlign='right';g.fillStyle=col;g.fillText(T2(P[k].n),x0-8,y);
  const pat=ex.L[k];for(let c=0;c<cyc;c++){if(pat[c%pat.length]!=='x')continue;const x=x0+(c+.5)*cw,r0=Math.max(4,Math.min(rh*.3,cw*.36));
   // during your turn: green = on time, orange = a little early or late, white ring = missed
   let st=null;if(SES.mode==='play'||SES.res){const mine=TL.filter(n=>n.p===k&&n.s%cyc===c);const last=mine.filter(n=>n.t<=now+.02||SES.res);const n=SES.res?pickShow(mine):last[last.length-1];
    if(n&&(n.t<now-.17||SES.res))st=n.ok===1?'g':n.ok?'o':'m'}
   const lit=cur===c&&(SES.mode==='demo'||SES.mode==='play');
   glyph(k,x,y,r0*(lit?1.25:1),st==='g'?'#7fe08a':st==='o'?'#ffc06a':col,st==='m');
   if(st==='m'){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;g.beginPath();g.arc(x,y,r0*1.7,0,TAU);g.stroke()}
   if(st==='o'&&SES.res){const n=pickShow(TL.filter(q=>q.p===k&&q.s%cyc===c));if(n){g.fillStyle='#ffc06a';g.font=`700 ${Math.max(9,r0)}px Fredoka`;g.textAlign='center';g.fillText(n.err<0?'◂':'▸',x,y-r0*1.9)}}}});
 if(cur>=0){const x=x0+(cur+.5)*cw;g.strokeStyle='rgba(255,224,138,.8)';g.lineWidth=3;g.beginPath();g.moveTo(x,gy-6);g.lineTo(x,gy+rh*ln.length+4);g.stroke()}
 // count-in: big numbers
 let cl=null;for(const c of CLK)if(c.at<=now)cl=c;
 if(cl&&cl.count&&now-cl.at<SES.bt){chalk(s*2.2,700);g.fillStyle='rgba(246,211,74,.95)';g.fillText(String(cl.n+1),cx,B.y+B.h*.5)}
 // the beat dots under the grid
 if(cl&&now<SES.end+.1){const dy=B.y+B.h*.93,gap=Math.min(26,B.w*.06);for(let i=0;i<4;i++){const on=i===cl.n&&now-cl.at<SES.bt;g.fillStyle=on?(i===0?'#f6d34a':'#f3e7d3'):'rgba(243,231,211,.25)';g.beginPath();g.arc(cx+(i-1.5)*gap,dy,on?6:4,0,TAU);g.fill()}
  if(cl.mute&&!cl.count&&SES.mode==='play'){chalk(Math.max(10,s*.38));g.globalAlpha=.6;g.fillText(tt('(click off: keep the time!)','(clic spento: tieni il tempo!)'),cx,dy-16);g.globalAlpha=1}}
 if(SES.res){const R_=SES.res;chalk(Math.max(16,s*.8),700);g.fillStyle=R_.pass?'#7fe08a':'#ffc06a';g.fillText(Math.round(R_.acc*100)+'%',cx,B.y+B.h*.86)}}
/* in the summary every cell shows the hit of the last cycle you played */
function pickShow(list){if(!list.length)return null;return list[list.length-1]}
function drawRigor(){const F=L.m,w=F.h*SW/SH;let bob=0;if(AC&&SES&&SES.end&&AC.currentTime<SES.end&&AC.currentTime>SES.t0-4*SES.bt){const ph=((AC.currentTime-SES.t0)/SES.bt)%1;bob=Math.pow(1-((ph+1)%1),4)*F.h*.025}
 const hop=bubTxt&&!bob?Math.abs(Math.sin(T*4))*F.h*.015:0,by=F.y+bob-hop+Math.sin(T*1.6)*F.h*.01;g.save();g.translate(F.x,by);g.fillStyle='rgba(40,20,8,.25)';g.beginPath();g.ellipse(0,F.h*.5-bob,w*.34,F.h*.05,0,0,TAU);g.fill();
 if(igOK)g.drawImage(rspr,-w/2,-F.h/2-F.h*PAD,w,F.h*(1+PAD));g.restore()}
let ANT=null;
function frame(ts){const t=ts/1000,dt=Math.min(.05,t-(frame.l||t));frame.l=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);room();decor();board();
 if(igOK)paintRigor(T);drawRigor();lightPads();
 if(ANT){ANT.t+=dt;const F=L.m,u=clamp(ANT.t/.6,0,1),x=lerp(ANT.x,F.x+F.h*.32,u),y=lerp(ANT.y,F.y+F.h*.42,u)-Math.sin(u*Math.PI)*80;if(u<1)drawAnt(g,x,y,Math.max(.5,F.h/260),-.5+u,T,{});if(ANT.t>1)ANT=null}
 if(SES&&SES.phase==='calib')calibTick();
 requestAnimationFrame(frame)}

/* ================= Rigor talks ================= */
const bub=$('bubble');let bubTxt='';
function say(html){bubTxt=html;bub.innerHTML=html?`<small style="display:block;font-size:.68em;opacity:.65">${TEACHER}</small>`+html:'';bub.style.opacity=html?1:0;placeBubble()}
function placeBubble(){if(!bubTxt)return;const M=L.m;if(!M)return;const bw=bub.offsetWidth,bh=bub.offsetHeight,headY=M.y-M.h*.5-M.h*PAD*.55;
 let x=L.land?M.x-bw*.25:M.x-M.h*.25,y=headY-bh-14;x=clamp(x,10,W-bw-10);
 if(!L.land){y=clamp(y,L.b.y+L.b.h+8,Hh);if(y+bh>M.y-M.h*.15)y=Math.max(64,L.b.y+L.b.h-bh*.6)}else y=Math.max(64,y);
 bub.style.transform=`translate(${x}px,${y}px)`;bub.style.setProperty('--tx',clamp(M.x-x,24,bw-24)+'px')}

/* ================= the pads ================= */
const bar=$('bar');
function setBar(html){bar.innerHTML=html;layout();placeBubble();bindPads()}
function padsHtml(ln){return`<div class="pads" style="--n:${ln.length}">${ln.map(k=>`<button class="pad pad-${k}" data-p="${k}" style="--c:${P[k].col}"><span class="nm">${T2(P[k].n)}</span>${touch?'':`<span class="ky">${k==='bd'?tt('SPACE','SPAZIO'):P[k].key}</span>`}</button>`).join('')}</div>`}
function bindPads(){bar.querySelectorAll('[data-p]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();hit(b.dataset.p)});b.addEventListener('contextmenu',e=>e.preventDefault())})}
function lightPads(){bar.querySelectorAll('[data-p]').forEach(b=>{const a=T-(LIT[b.dataset.p]??-9);b.style.setProperty('--k',a<.25?(1-a/.25).toFixed(2):'0')});
 if(AC&&SES&&SES.mode==='demo'&&SES.end){const now=AC.currentTime;for(const n of TL)if(!n.lit&&n.t<=now){n.lit=1;LIT[n.p]=T}}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(KEYMAP[k]!==undefined&&!e.repeat&&(SES&&(SES.phase==='ex'||SES.phase==='calib'))){e.preventDefault();hit(KEYMAP[k]);return}
 if(e.key==='Enter'&&!e.repeat){const b=$('next')||$('play');if(b){e.preventDefault();b.click()}}});

/* ================= flow ================= */
function hdr(){if(!SES||SES.phase==='calib'){$('st1').innerHTML=`${tt('exercises','esercizi')} <b>${PR.done}/${NE}</b>`;$('dots').innerHTML='';return}
 const ex=SES.ex;$('st1').innerHTML=`${tt('stage','tappa')} <b>${ex.si+1}</b> · <b>${ex.k+1}/6</b>`;
 $('dots').innerHTML=ST[ex.si].ex.map((e,k)=>`<i class="${e.id<PR.done?'ok':k===ex.k?'now':''}"></i>`).join('')}
$('stat').onclick=()=>{if(SES)stopAll(),openMap()};
function stopAll(){if(SES){SES.end=0;SES.mode=null}TL=[];CLK=[];clearTimeout(stopAll.t)}
function openMap(){SES=null;say('');setBar('');hdr();const cur=Math.min(PR.done,NE-1),fin=PR.done>=NE;
 const chips=ST.map((s,si)=>{const n=Math.max(0,Math.min(6,PR.done-si*6)),open=OPEN||si*6<=PR.done;return`<button data-st="${si}" class="${n>=6?'done':open?'cur':''}" ${open?'':'disabled'}><span class="ic">${open?s.ic:'🔒'}</span>${T2(s.n)}<small>${n>=6?'✓ 6/6':n+'/6'}</small></button>`}).join('');
 $('startCard').innerHTML=`<h2>${tt('<em>Drum</em> school','Scuola di <em>batteria</em>')}</h2>
 <p>${tt(`<b>${TEACHER}</b> teaches you to play the drums, from zero: first keeping the time on the hi-hat, then off-beats, bass drum and snare, your first rock groove, fills and styles. ${NE} exercises: pass one and the next one opens.`,`<b>${TEACHER}</b> ti insegna a suonare la batteria, da zero: prima a tenere il tempo sul charleston, poi i levare, la cassa e il rullante, il primo groove rock, i fill e gli stili. ${NE} esercizi: ne superi uno e si apre il prossimo.`)}</p>
 <p>${touch?tt('Tap the pads at the bottom of the screen; from stage 5 you need <b>two fingers</b>.','Tocca i pad in basso; dalla tappa 5 servono <b>due dita</b>.'):tt('Keys: <b>A</b> hi-hat · <b>S</b> snare · <b>D</b> high tom · <b>F</b> low tom · <b>G</b> cymbal · <b>space</b> bass drum (or click the pads).','Tasti: <b>A</b> charleston · <b>S</b> rullante · <b>D</b> tom alto · <b>F</b> tom basso · <b>G</b> piatto · <b>spazio</b> cassa (oppure clicca i pad).')}</p>
 <div class="map">${chips}</div>
 <p class="small">${tt(`${Math.round(PASS*100)}% to pass · use headphones with a cable if you can · `,`${Math.round(PASS*100)}% per passare · se puoi, cuffie col filo · `)}<a href="#" id="cal">${PR.lat==null?tt('tune the timing','regola il tempo'):tt('tune the timing again','regola di nuovo il tempo')}</a></p>
 <div class="row"><button class="main" id="go">${fin?tt('Play the big concert again','Risuona il grande concerto'):PR.done?tt('Continue · exercise ','Continua · esercizio ')+(Math.floor(cur/6)+1)+'.'+(cur%6+1):tt('Start the first lesson','Inizia la prima lezione')}</button></div>
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('start').hidden=false;$('end').hidden=true;
 $('go').onclick=()=>start(fin?NE-1:cur);$('cal').onclick=e=>{e.preventDefault();calibrate(null)};
 document.querySelectorAll('.map button[data-st]').forEach(b=>b.onclick=()=>{const si=+b.dataset.st;start(PR.done>=si*6&&PR.done<si*6+6?PR.done:si*6)})}
function start(id){audio();if(AC.state==='suspended')AC.resume();$('start').hidden=true;$('end').hidden=true;
 // the very first time: tune the timing (phones with bluetooth headphones can be late)
 if(PR.lat==null&&!OPEN){calibrate(id);return}
 if(!PR.met){PR.met=1;saveP()}exercise(id)}
function exercise(id){audio();stopAll();const ex=exOf(id);SES={ex,phase:'ex',mode:null,res:null};hdr();
 say(T2(ex.say)+(ex.metro==='one'&&!/1/.test(T2(ex.say))?' '+tt('The click is only on 1.','Il clic è solo sull’1.'):''));
 setBar(`<div class="row"><button id="demo">▶ ${tt('Listen to Rigor','Ascolta Rigor')}</button><button class="main" id="play">${tt('Your turn! ▸','Tocca a te! ▸')}</button></div>`+padsHtml(lanes(ex)));
 $('demo').onclick=demo;$('play').onclick=play;setTimeout(()=>{if(SES&&SES.ex===ex&&!SES.mode)demo()},700)}
function demo(){if(!SES)return;const ex=SES.ex;SES.res=null;const d=schedule('demo');busy(true);clearTimeout(stopAll.t);stopAll.t=setTimeout(()=>{if(SES&&SES.mode==='demo'){SES.mode=null;busy(false);say(pick([['Your turn!','Tocca a te!'],['Now you!','Ora tu!'],['Ready? Go!','Pronto? Vai!']].map(T2)))}},d*1000+200)}
function play(){if(!SES)return;SES.res=null;const d=schedule('play');busy(true);say(tt('One, two, three, four…','Uno, due, tre, quattro…'));
 clearTimeout(stopAll.t);stopAll.t=setTimeout(done,d*1000+350)}
function busy(on){const a=$('demo'),b=$('play');if(a)a.disabled=on;if(b)b.disabled=on}
const PRAISE=[['Rock on!','Rock on!'],['Awesome!','Grandioso!'],['Yeah! You’re a natural!','Yeah! Sei nato per questo!'],['Wicked groove!','Che groove!'],['Perfect time!','Tempo perfetto!']];
function done(){if(!SES||SES.mode!=='play')return;const ex=SES.ex,R_=result();SES.res=R_;SES.mode=null;ding(R_.pass);
 PR.plays[ex.id]=(PR.plays[ex.id]|0)+1;if(!(PR.best[ex.id]>=R_.acc))PR.best[ex.id]=Math.round(R_.acc*100)/100;
 const isNew=R_.pass&&ex.id===PR.done;let seeds=0;if(isNew){PR.done++;seeds=2+(ex.k===5?3:0)}else if(R_.pass)seeds=1;saveP();
 if(seeds||isNew){let p={};try{p=JSON.parse(localStorage.getItem('igortime_pending'))||{}}catch(e){}p.seeds=(p.seeds|0)+seeds;p.scores=p.scores||{};p.scores.drumschool=p.scores.drumschool||{};if(!(p.scores.drumschool.all>=PR.done))p.scores.drumschool.all=PR.done;try{localStorage.setItem('igortime_pending',JSON.stringify(p))}catch(e){}}
 let tip='';if(R_.missed>TL.length*.25)tip=tt('A few hits were missing: listen to me once more.','Mancava qualche colpo: riascoltami una volta.');
 else if(R_.mean>.03)tip=tt('You were a tiny bit <b>late</b>: hit a little earlier, together with the click.','Eri un filo <b>in ritardo</b>: colpisci un po’ prima, insieme al clic.');
 else if(R_.mean<-.03)tip=tt('You were a tiny bit <b>early</b>: relax, wait for the click.','Eri un filo <b>in anticipo</b>: rilassati, aspetta il clic.');
 else if(R_.extra>2)tip=tt('A few extra hits: play only what is on the board.','Qualche colpo in più: suona solo quello che c’è sulla lavagna.');
 if(R_.pass){const B=L.b;ANT={x:B.x+B.w*.5,y:B.y+B.h*.5,t:0};say(T2(pick(PRAISE))+' '+(isNew?(ex.id===NE-1?tt('You finished the whole school. You’re a real rock star!','Hai finito tutta la scuola. Sei una vera rock star!'):tt('Next exercise unlocked.','Il prossimo esercizio è aperto.')):'')+(tip&&R_.acc<.95?' '+tip:''))}
 else say(pick([['So close!','Ci sei quasi!'],['Good energy!','Bella energia!'],['Nice try!','Bel tentativo!']].map(T2))+' '+(tip||tt(`You need ${Math.round(PASS*100)}%: one more go!`,`Serve il ${Math.round(PASS*100)}%: un altro giro!`)));
 const last=ex.id>=NE-1||!(OPEN||ex.id+1<=PR.done);
 setBar(`<div class="row"><button id="demo">▶ ${tt('Listen to Rigor','Ascolta Rigor')}</button><button ${R_.pass&&!last?'':'class="main"'} id="play">↺ ${tt('Play again','Riprova')}</button>${R_.pass&&!last?`<button class="main" id="next">${tt('Next ▸','Avanti ▸')}</button>`:''}<button id="map">${tt('All the stages','Tutte le tappe')}</button></div>${seeds?`<div class="row seeds">+${seeds} ${seeds>1?tt('tofu seeds','semi di tofu'):tt('tofu seed','seme di tofu')}</div>`:''}`+padsHtml(lanes(ex)));
 $('demo').onclick=demo;$('play').onclick=play;$('map').onclick=()=>{stopAll();openMap()};const nx=$('next');if(nx)nx.onclick=()=>exercise(ex.id+1);
 if(isNew&&ex.k===5&&PR.done>0)import('/board.js?v=5').then(B=>B.show($('startCard'),'drumschool','all',PR.done,ME.avatar,tt('How far everyone got · exercises','Fin dove siete arrivati · esercizi'))).catch(()=>{})}

/* ================= tuning the timing: tap along with 8 clicks ================= */
let CAL=null;
function calibrate(then){stopAll();SES={phase:'calib',taps:[],then};hdr();say(tt('Before we rock: let’s <b>tune the timing</b>. Tap the pad (or press space) <b>together with the clicks</b>, eight times.','Prima di suonare: <b>regoliamo il tempo</b>. Tocca il pad (o premi spazio) <b>insieme ai clic</b>, otto volte.'));
 setBar(`<div class="row"><button class="main" id="play">${tt('Start the clicks','Fai partire i clic')}</button><button id="skip">${tt('Skip','Salta')}</button></div><div class="pads" style="--n:1"><button class="pad" data-p="bd" style="--c:#c49bff"><span class="nm">${tt('tap here','tocca qui')}</span>${touch?'':'<span class="ky">'+tt('SPACE','SPAZIO')+'</span>'}</button></div>`);
 $('skip').onclick=()=>{if(PR.lat==null){PR.lat=0;saveP()}fin()};
 const fin=()=>{SES=null;if(then!=null)exercise(then);else openMap()};
 $('play').onclick=()=>{audio();const bt=60/90,c0=AC.currentTime+.2;SES.taps=[];SES.clicks=[];for(let i=0;i<12;i++){click(c0+i*bt,i%4===0);SES.clicks.push(c0+i*bt)}SES.t0=c0+4*bt;SES.bt=bt;SES.end=c0+12*bt;CAL={c0,bt};$('play').disabled=true;
  setTimeout(()=>{const offs=SES.taps.map(t=>{let b=1;for(const c of SES.clicks.slice(4)){const d=t-c;if(Math.abs(d)<Math.abs(b))b=d}return b}).filter(d=>Math.abs(d)<.3).sort((a,b)=>a-b);
   if(offs.length<5){say(tt('I didn’t hear enough taps. Let’s try again!','Non ho sentito abbastanza colpi. Riproviamo!'));$('play').disabled=false;return}
   const med=offs[Math.floor(offs.length/2)],old=PR.lat||0;PR.lat=Math.round(clamp(old+med,-.05,.4)*1000)/1000;saveP();
   say(Math.abs(med)<.02?tt('Perfect: your timing is spot on. Let’s rock!','Perfetto: il tempo torna. Si suona!'):tt(`Done! I’ll correct ${Math.round(Math.abs(PR.lat)*1000)} ms of delay. Let’s rock!`,`Fatto! Correggo ${Math.round(Math.abs(PR.lat)*1000)} ms di ritardo. Si suona!`));
   setTimeout(fin,2200)},(12*bt+.8)*1000)}}
function calibBoard(B,s){const cx=B.x+B.w/2;chalk(s*.7,600);g.fillText(tt('Tap with the clicks','Tocca insieme ai clic'),cx,B.y+B.h*.22);
 if(!CAL||!AC)return;const now=AC.currentTime,i=Math.floor((now-CAL.c0)/CAL.bt);for(let k=0;k<8;k++){const on=i-4===k,x=cx+(k-3.5)*Math.min(40,B.w*.1);g.fillStyle=on?'#f6d34a':k<i-4?'#7fe08a':'rgba(243,231,211,.25)';g.beginPath();g.arc(x,B.y+B.h*.55,on?11:8,0,TAU);g.fill()}
 if(i>=0&&i<4){chalk(s*2,700);g.fillStyle='rgba(246,211,74,.95)';g.fillText(String(i+1),cx,B.y+B.h*.8)}}
function calibTick(){}

resize();openMap();requestAnimationFrame(frame);
window.__ds={hitTime:()=>hitTime(),get AC(){return AC},PR,ST,EXS,get SES(){return SES},exercise,hit,result,get TL(){return TL},sched:schedule,calibrate};
})();
</script>
