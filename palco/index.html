<!DOCTYPE html>

<style>

.aud .ig{width:62px;height:62px;transition:transform .12s}

.aud .bub{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);font-size:18px;opacity:0;transition:opacity .2s}
.aud.hit .bub{opacity:1}
.prog{height:8px;background:#0c1330;border-radius:6px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--gold);transition:width .2s linear}
.vote{display:flex;justify-content:center;gap:6px;margin:8px 0}.vote button{font-size:30px;background:none;border:0;cursor:pointer;filter:grayscale(1);opacity:.35;transition:transform .1s}.vote button.on{filter:none;opacity:1;transform:scale(1.12)}

.ghost{display:inline-block;border:1.5px dashed var(--mut);border-radius:6px;font-size:10px;padding:0 5px;color:var(--mut);margin-left:4px;vertical-align:middle}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

</style>

<div id="app"><div class="topbar"><a class="igback" href="/" id="igback">← Isola</a><b>Il palco di Igor</b><span id="who" class="mut"></span></div><header id="hdr"></header><main id="view"></main></div>

<script>
'use strict';
const IGOR='/igor.webp';const $=s=>document.querySelector(s);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ================= AUDIO ================= */
const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,noiseBuf=null;
function audio(){if(!ac){try{ac=new AC();master=ac.createGain();master.gain.value=.8;const c=ac.createDynamicsCompressor();master.connect(c);c.connect(ac.destination);noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume();return ac}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function osc(type,f,t,dur,vol,att=.01,dest=master){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);return o}
function sus(type,f,t,dur,vol,att=.05,rel=.15,dest=master){const o=ac.createOscillator(),g=ac.createGain(),end=t+Math.max(att+.02,dur);o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.setValueAtTime(vol,end);g.gain.exponentialRampToValueAtTime(.0005,end+rel);o.connect(g);g.connect(dest);o.start(t);o.stop(end+rel+.05);return o}
function noise(t,dur,vol,type,freq,q=1){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)}
const DRUM=[t=>{const o=osc('sine',150,t,.28,.9,.002);o.frequency.exponentialRampToValueAtTime(42,t+.18)},t=>{noise(t,.18,.45,'bandpass',1800,.8);osc('triangle',190,t,.1,.3,.002)},t=>noise(t,.05,.22,'highpass',7500),t=>noise(t,.9,.25,'highpass',5000)];
const SCALE=[0,2,4,5,7,9,11];const deg=(n,base)=>base+SCALE[((n%7)+7)%7]+12*Math.floor(n/7);
const NN=['Do','Do#','Re','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];const WHITE=[0,2,4,5,7,9,11];
const QUAL={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],'°':[0,3,6],'ø':[0,3,6,10],'+':[0,4,8],sus4:[0,5,7],sus2:[0,2,7],'6':[0,4,7,9],m6:[0,3,7,9],'9':[0,4,7,10,14],add9:[0,4,7,14]};
const QORDER=['','m','7','maj7','m7','°','ø','+','sus4','sus2','6','m6','9','add9'];
const DIA=[{r:0,q:''},{r:2,q:'m'},{r:4,q:'m'},{r:5,q:''},{r:7,q:''},{r:9,q:'m'},{r:11,q:'°'}];
const chName=c=>NN[c.r]+c.q;
function guess(pcs){let best=null,bs=0;for(let r=0;r<12;r++)for(const q of QORDER){const t=QUAL[q].map(x=>(r+x)%12);const hit=t.filter(p=>pcs.includes(p)).length,extra=pcs.filter(p=>!t.includes(p)).length;const sc=hit-extra*1.2+(pcs.includes(r)?.3:0);if(hit>=Math.min(3,t.length)&&sc>bs){bs=sc;best={r,q}}}return best}const chPcs=c=>QUAL[c.q].map(x=>(c.r+x)%12);
const noteName=m=>NN[m%12]+(Math.floor(m/12)-1);
function lp(f){const x=ac.createBiquadFilter();x.type='lowpass';x.frequency.value=f;x.connect(master);return x}
const VOICE={
 bs:(m,t,d)=>{const f=lp(750),dd=Math.max(.2,d-.02);sus('sawtooth',mtof(m),t,dd,.24,.01,.12,f);sus('sine',mtof(m),t,dd,.28,.01,.12)},
 pn:(ns,t,d)=>{const v=.11/Math.sqrt(Math.max(1,ns.length/2));ns.forEach(m=>{osc('triangle',mtof(m),t,Math.max(1,d+.2),v,.008);osc('sine',mtof(m+12),t,.45,v*.25,.008)})},
 vl:(m,t,d)=>{const f=lp(2800),dd=Math.max(.16,d-.02),fq=mtof(m);const o1=sus('sawtooth',fq,t,dd,.075,.08,.18,f),o2=sus('sawtooth',fq*1.003,t,dd,.05,.1,.18,f);const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.3;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fq*.006,t+Math.min(.35,dd));l.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);l.start(t);l.stop(t+dd+.3)},
 gt:(c,t,d)=>{const base=52+((c.r-4+12)%12),dd=Math.min(2.2,d+.2);QUAL[c.q].concat([12]).forEach((x,i)=>osc('triangle',mtof(base+x),t+i*.025,dd,.1,.003))},
 mr:(m,t,d)=>{osc('sine',mtof(m),t,Math.max(.35,d),.3,.002);osc('sine',mtof(m)*4,t,.08,.06,.002)},
 bt:(m,t,d)=>{const dd=Math.max(.35,d-.02);sus('sine',mtof(m),t,dd,.2,.06,.2);sus('sine',mtof(m)*2,t,dd,.03,.08,.15);noise(t,Math.min(.25,dd),.04,'bandpass',mtof(m)*2,4)},
 gh:(ns,t,d)=>{const v=.12/Math.sqrt(Math.max(1,ns.length/2));ns.forEach(m=>{const dd=Math.max(.6,d);sus('sine',mtof(m),t,dd,v,.18,.5);sus('sine',mtof(m)*1.004,t,dd,v*.5,.25,.5);sus('sine',mtof(m)*2,t,dd,v*.15,.2,.3)})},
 pp:(ns,t,d)=>{ns.forEach(m=>{const kind=(m*7)%4,f=mtof(m);if(kind===0){osc('sine',f,t,.25,.22,.002);noise(t,.05,.12,'lowpass',900)}else if(kind===1){[1,2.76,5.4,8.93].forEach((r,i)=>osc('sine',f*r,t,1.1/(i+1),.12/(i+1),.002))}else if(kind===2){osc('triangle',f,t,.6,.14,.002);for(let i=0;i<5;i++)noise(t+.02+i*.035,.03,.06,'bandpass',3000+i*400,6)}else{osc('square',f/2,t,.12,.08,.002);noise(t,.15,.14,'bandpass',f*3,2)}})}};
const isOn=(k,v)=>TRK[k].poly?!!v:TRK[k].multi?!!(Array.isArray(v)&&v.length):TRK[k].chord?!!v:v>=0;
const HOLD=k=>TRK[k].multi?'H':-2;const isHold=(k,v)=>v===HOLD(k);
/* ================= DATA ================= */
const TRK={dr:{n:'Batteria',k:'R',rows:['Cassa','Rullante','Charleston','Piatto'],poly:1,col:'#ff8a5c'},bs:{n:'Basso',k:'R',lo:24,hi:55,def:36,col:'#ffb35c'},pn:{n:'Piano',k:'A',multi:1,lo:36,hi:96,def:60,col:'#b98cff'},
 vl:{n:'Violino',k:'M',lo:55,hi:96,def:72,col:'#4fc3ff'},gt:{n:'Chitarra',k:'A',chord:1,col:'#e0a0ff'},mr:{n:'Marimba',k:'M',lo:48,hi:96,def:72,col:'#5cd6c0'},bt:{n:'Bottiglie',k:'M',lo:60,hi:96,def:72,col:'#8fd8ff'},gh:{n:'Glassarmonica',k:'M',multi:1,lo:55,hi:96,def:72,col:'#a8f0ff'},pp:{n:'Piano preparato',k:'R',multi:1,lo:36,hi:84,def:48,col:'#d9c49a'}};
const ORDER=['dr','mr','bs','pn','vl','gt','bt','gh','pp'];
const UNL=[null,{t:['dr','mr'],bars:1,txt:'Batteria e Marimba · 1 battuta · tasti bianchi (Do maggiore / La minore)'},{t:'bs',bars:2,txt:'il Basso · 2 battute'},{t:'pn',bars:3,txt:'il Piano · 3 battute'},{t:'vl',bars:4,txt:'il Violino · 4 battute'},{t:'gt',bars:5,pcs:[6,1],txt:'la Chitarra · 5 battute · Fa# e Do# (Sol e Re maggiore)'},{t:'bt',bars:6,pcs:[8,3],txt:'le Bottiglie · 6 battute · Sol# e Re# (La e Mi maggiore)'},{pcs:[10],bars:8,txt:'il totale cromatico · 8 battute'},{allch:1,txt:'tutti gli accordi della chitarra (settime, diminuiti, sospesi…)'},{t:'gh',txt:'la Glassarmonica'},{bars:12,txt:'12 battute'},{bars:16,txt:'16 battute'},{t:'pp',txt:'il Piano preparato di John Cage'}];
const LVXP=[0,0,8,20,36,56,80,110,145,185,230,280,340];const LVMAX=12;
function ec(){const c=caps(S.lv);c.max=c.bars;c.bars=clamp(S.useBars||1,1,c.max);return c}
function caps(lv){const c={tracks:[],steps:16,bars:1,pcs:new Set(WHITE)};for(let i=1;i<=lv&&i<UNL.length;i++){const u=UNL[i];if(u.t)[].concat(u.t).forEach(t=>c.tracks.push(t));if(u.bars)c.bars=u.bars;if(u.pcs)u.pcs.forEach(p=>c.pcs.add(p));if(u.allch)c.allch=1}c.chrom=c.pcs.size===12;return c}
const KN={R:'Ritmo',M:'Melodia',A:'Armonia'},KC={R:'#ff8a5c',M:'#4fc3ff',A:'#b98cff'},KI={R:'🥁',M:'🎻',A:'🎹'};
const CAPC=['#ff6b6b','#4ecdc4','#ffd166','#c69cff','#ff9f43','#7bed9f','#70a1ff','#f78fb3'];
const BANDS=['Banda del Molo','Tofu Express','Quartetto Lingualunga','Le Code Verdi','I Grilli di Mezzanotte','Orchestra Mirtillo','Gli Zampettoni','I Muso Lungo','Tofu & Tamburi','Le Lingue Lunghe'];
const IGN=['Pip','Lulù','Bobo','Tic','Mirtillo','Zuzu','Fagiolo','Nina','Bric','Lollo','Teo','Brina'];
/* ================= STATE ================= */
const KEY='igortime_palco';

const KK_MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KK_MIN=[6.33,2.68,3.52,5.38,2.6,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

function corr(a,b){const ma=a.reduce((s,x)=>s+x,0)/12,mb=b.reduce((s,x)=>s+x,0)/12;let n=0,da=0,db=0;for(let i=0;i<12;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return da&&db?n/Math.sqrt(da*db):0}

function analyze(song,c){const has=k=>c.tracks.includes(k);const N=c.bars*16;const at=(k,i)=>song[k][Math.floor(i/16)][i%16];
 /* ---------- collect pitched material ---------- */
 const hist=Array(12).fill(0);const add=(m,w)=>{hist[((m%12)+12)%12]+=w};
 const melo=[],bassAt=Array(N).fill(null),chordAt=Array(N).fill(null);
 for(let i=0;i<N;i++){const acc=i%4===0?1.5:1;let top=null;
  for(const k of['mr','vl','bt']){if(!has(k))continue;const v=at(k,i);if(v>=0){add(v,acc);if(top==null||v>top)top=v}}
  for(const k of['gh','pn']){if(!has(k))continue;const v=at(k,i);if(Array.isArray(v)&&v.length){v.forEach(m=>add(m,acc*.8));if(v.length<=2){const t=Math.max(...v);if(top==null||t>top)top=t}}}
  if(has('bs')){const v=at('bs',i);if(v>=0){add(v,acc*1.6);bassAt[i]=v}}
  if(has('gt')){const v=at('gt',i);if(v){chordPcs(v).forEach(p=>hist[p]+=.8*acc)}}
  if(top!=null)melo.push({i,m:top})}

 for(let i=0;i<N;i++){let pcs=null;for(const k of['pn','gh']){if(!has(k))continue;const v=at(k,i);if(Array.isArray(v)&&v.length>=3){pcs=[...new Set(v.map(m=>m%12))];break}}if(!pcs&&has('gt')){const v=at('gt',i);if(v)pcs=chordPcs(v)}if(pcs&&pcs.length>=3)chordAt[i]=pcs}
 /* ---------- key ---------- */
 let key={t:0,minor:false},kc=-2;for(let t=0;t<12;t++){const rot=hist.slice(t).concat(hist.slice(0,t));const a=corr(rot,KK_MAJ),b=corr(rot,KK_MIN);if(a>kc){kc=a;key={t,minor:false}}if(b>kc){kc=b;key={t,minor:true}}}
 const scale=(key.minor?SC_MIN:SC_MAJ).map(x=>(x+key.t)%12);const inKey=m=>scale.includes(((m%12)+12)%12);const deg=pc=>((pc-key.t)%12+12)%12;
 /* ---------- RITMO ---------- */
 let R=1;{const dr=has('dr')?Array.from({length:N},(_,i)=>at('dr',i)):Array(N).fill(0);
  const perc=dr.map((m,i)=>m|| (has('pp')&&at('pp',i)&&at('pp',i).length?16:0));const hits=perc.filter(Boolean).length;
  if(hits){const dens=hits/N;const kick=i=>dr[i]&1,snare=i=>dr[i]&2,hat=i=>dr[i]&4;
   let anchor=0,anc=0;for(let b=0;b<c.bars;b++){anc++;if(kick(b*16)||perc[b*16])anchor++}anchor/=anc;
   let back=0,bc=0;for(let b=0;b<c.bars;b++)for(const s of[4,12]){bc++;if(snare(b*16+s))back++}back/=bc;
   const onBeat=perc.filter((m,i)=>m&&i%4===0).length/hits,off=1-onBeat;
   /* repetition with variation: compare halves of each bar and bars with each other */
   const sim=(a,b)=>{let same=0,tot=0;for(let k=0;k<a.length;k++){if(a[k]||b[k]){tot++;if(a[k]===b[k])same++}}return tot?same/tot:1};
   let rep=0,rc=0;for(let b=0;b<c.bars;b++){const x=perc.slice(b*16,b*16+8),y=perc.slice(b*16+8,b*16+16);rep+=sim(x,y);rc++}
   for(let b=1;b<c.bars;b++){rep+=sim(perc.slice(0,16),perc.slice(b*16,b*16+16));rc++}rep/=rc;
   const voices=[1,2,4,8].filter(f=>dr.some(m=>m&f)).length+(has('pp')&&perc.some(m=>m===16)?1:0);
   let lock=.5;if(has('bs')){const bon=bassAt.map((v,i)=>v!=null?i:-1).filter(i=>i>=0);if(bon.length)lock=bon.filter(i=>kick(i)||i%4===0).length/bon.length}
   const sc=.2*anchor+.16*back+.16*bell(rep,.55,.95,.35)+.14*bell(dens,.2,.7,.2)+.12*bell(off,.15,.55,.25)+.12*Math.min(1,(voices-1)/2)+.1*lock;
   R=1+4*Math.max(0,Math.min(1,(sc-.1)/.8))}
  else if(has('bs')){const n=bassAt.filter(v=>v!=null).length;R=1+Math.min(1,n/(N*.25))}}
 /* ---------- MELODIA ---------- */
 let M=1;if(melo.length>=3){const ms=melo.map(x=>x.m),n=ms.length;
  const ink=ms.filter(inKey).length/n;
  let st=0,lp=0,rec=0,big=0,pp=0;for(let j=1;j<n;j++){const iv=ms[j]-ms[j-1];if(Math.abs(iv)<=2&&iv!==0)st++;else if(Math.abs(iv)>2)lp++;
   if(Math.abs(iv)>=5){big++;if(j+1<n){const nx=ms[j+1]-ms[j];if(Math.sign(nx)===-Math.sign(iv)&&Math.abs(nx)<=Math.abs(iv))rec++}}
   if(j>=2&&Math.abs(iv)>=7&&Math.abs(ms[j-1]-ms[j-2])>=7&&Math.sign(iv)!==Math.sign(ms[j-1]-ms[j-2]))pp++}

  let gaps=0;for(let j=1;j<n;j++)if(melo[j].i-melo[j-1].i>=3)gaps++;const fill=n/N;const phr=Math.min(1,gaps/Math.max(1,c.bars*.75))*bell(fill,.2,.65,.3);

 else if(melo.length)M=1.5;
 /* ---------- ARMONIA ---------- */
 let A=1;{const evs=[];for(let i=0;i<N;i++)if(chordAt[i]){const b=bassAt[i]!=null?bassAt[i]:null;const g=recog(chordAt[i],b);evs.push({i,pcs:chordAt[i],g,b})}
  const layers=Array.from({length:N},(_,i)=>c.tracks.filter(k=>isOn(k,at(k,i))).length).reduce((a,b)=>a+b,0)/N;
  if(evs.length){const segs=[];for(const e of evs){const prev=segs[segs.length-1];const name=e.g?e.g.r+e.g.q:'x'+e.pcs.sort().join('');if(prev&&prev.name===name)continue;segs.push({...e,name})}
   /* intentional clusters: an unrecognised sonority repeated 3+ times counts as a colour, not as noise */
   const cnt={};evs.forEach(e=>{if(!e.g){const k=e.pcs.slice().sort((a,b)=>a-b).join();cnt[k]=(cnt[k]||0)+1}});
   const recR=evs.filter(e=>e.g||cnt[e.pcs.slice().sort((a,b)=>a-b).join()]>=3).length/evs.length;
   const fn=g=>{if(!g)return null;const d=deg(g.r);const dia=key.minor?{0:'T',2:'S',3:'T',5:'S',7:'D',8:'S',10:'D',11:'D'}:{0:'T',2:'S',4:'T',5:'S',7:'D',9:'T',11:'D'};return dia[d]||(g.q===''||g.q==='7'?'X':null)};
   const fns=segs.map(s=>fn(s.g));const diat=fns.filter(f=>f&&f!=='X').length/segs.length;
   const TR={TS:1,SD:1,DT:1,TD:.8,ST:.7,TT:.5,SS:.6,DD:.5,DS:.25,XT:.8,XS:.8,XD:.9,TX:.7,SX:.7,DX:.6,XX:.5};
   let prog=.4;if(segs.length>=2){let s=0,k=0;for(let j=1;j<segs.length;j++){const a=fns[j-1],b=fns[j];if(a&&b){s+=TR[a+b]??.4;k++}else{s+=.1;k++}}prog=s/k}
   const lastS=segs[segs.length-1],firstS=segs[0];let cad=0;if(lastS.g&&deg(lastS.g.r)===0)cad=1;else if(lastS.g&&deg(lastS.g.r)===7)cad=.6;
   for(let j=1;j<segs.length;j++)if(segs[j-1].g&&segs[j].g&&deg(segs[j-1].g.r)===7&&deg(segs[j].g.r)===0)cad=Math.max(cad,.9);
   if(firstS.g&&deg(firstS.g.r)===0)cad=Math.min(1,cad+.1);
   const perBar=segs.length/c.bars,hr=c.bars===1&&segs.length===1?.3:bell(perBar,1,4,2.5);
   let bsup=.5;{let ok=0,tot=0;for(const s of segs){let b=s.b;if(b==null){for(let i=s.i;i<Math.min(N,s.i+4);i++)if(bassAt[i]!=null){b=bassAt[i];break}}if(b==null)continue;tot++;if(s.g&&b%12===s.g.r)ok+=1;else if(s.pcs.includes(b%12))ok+=.6}if(tot)bsup=ok/tot}
   const rich=segs.filter(s=>s.g&&s.pcs.length>=4).length/segs.length;

  else A=1+Math.min(1,Math.max(0,layers-.5)*.8)}

const BPM=96,SD=60/BPM/4;let PL=null;

  lvUp(){if(S.lv<LVMAX){S.xp=LVXP[S.lv+1];gainXP(0)}save();render()},lvMax(){while(S.lv<LVMAX){S.xp=LVXP[S.lv+1];gainXP(0)}save();render()},
  reset(){if(t.dataset.sure){stopSong();V=null;S=fresh();save();render();greet(true);return}t.dataset.sure=1;t.textContent='Tocca ancora per confermare'}};
 if(A[a])A[a]()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.note!=null){S.notes=S.notes||{};const n=S.notes[S.bar]=S.notes[S.bar]||['','','',''];n[+t.dataset.note]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='speed'){S.speed=+t.value;save()}});
function greet(force){if(!S.met||force){S.met=true;save();say('Benvenuto sul tuo palco! Io sono Igorbaudo. Qui costruisci il tuo brano, pian piano, e le band dell\'isola vengono ad ascoltarlo. Comincia da Componi!',7000);return}
 if(S.pending.length)say('Bentornato! Mentre non c\'eri '+S.pending.length+' band hanno ascoltato il tuo brano!')}
function realVotes(list){/* votes from real players since the last visit */let n=0;for(const v of list){if(S.seenVotes&&S.seenVotes[v.id]===v.at)continue;S.seenVotes=S.seenVotes||{};S.seenVotes[v.id]=v.at;const L={who:v.nick,ver:v.ver,pv:v.pv,igs:v.ig||[],fin:v.fin,fl:!!v.fl,real:1};S.listens.unshift(L);S.pending.push(L);if(L.fl)S.flowers++;gainXP(L.fin);n++}if(n){save();if(S.tab==='palco'&&!PL)render()}}
window.addEventListener('palcocloud',()=>{PalcoCloud.ready().then(async()=>{const d=await PalcoCloud.loadDraft().catch(()=>null);if(d&&d.at>(S.at||0)&&d.song){S.song=migrate(d.song);for(const k of ORDER){S.song[k]=S.song[k]||[];while(S.song[k].length<16)S.song[k].push(Array(16).fill(EMPTY(k)))}S.useBars=d.useBars||S.useBars;S.notes=d.notes||S.notes;S.at=d.at;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!PL)render()}
 PalcoCloud.myVotes().then(realVotes).catch(()=>{});PalcoCloud.count().then(n=>{S.realStages=n;save()}).catch(()=>{})})});
render();greet();

 async publish(p){await ready;need();const ref=doc(db,'stages',user.uid),cur=await getDoc(ref);const base={nick:String(nick||'Igor').slice(0,16),ver:p.ver|0,song:p.song,c:p.c,score:p.score,at:serverTimestamp()};

 async pick(n,skip){await ready;const q=await getDocs(query(collection(db,'stages'),orderBy('last','asc'),limit(15)));const l=q.docs.filter(d=>(!user||d.id!==user.uid)&&!(skip||[]).includes(d.id)).map(d=>({uid:d.id,...d.data()}));for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}return l.slice(0,n).map(x=>({uid:x.uid,nick:x.nick,ver:x.ver,song:x.song,c:x.c}))},
