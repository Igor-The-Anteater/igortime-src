 if(SES.i===0)say(SES.k<0?tt('Read each note: treble clef on top, bass clef below.','Leggi ogni nota: sopra la chiave di violino, sotto quella di basso.'):tt('Now you. Think, then answer.','Ora tocca a te. Pensa, poi rispondi.'));else say('');
 setBar(ansHtml(q));bindAns(q)}
function answer(a,btn){const q=SES.q;if(!q||q.done)return;let ok;
 if(q.kb){const want=q.kb.want,sel=a.set;ok=sel.size===want.size&&[...want].every(s=>sel.has(s));bar.querySelectorAll('[data-s]').forEach(b=>{const s=+b.dataset.s;if(want.has(s)&&sel.has(s))b.classList.add('right');else if(want.has(s)||sel.has(s))b.classList.add(want.has(s)?'right':'wrong')})}
 else{ok=a.o===q.a;if(btn)btn.classList.add(ok?'right':'wrong');if(!ok){const rb=bar.querySelector(`[data-o="${q.a}"]`);if(rb)rb.classList.add('right')}const an=bar.querySelector('.ans');if(an)an.classList.add('done')}
 q.done=true;SES.res[SES.i]=ok?1:0;if(ok)SES.right++;hdr();ding(ok);
 if(q.show&&q.show.cols){VIEW.spec={...q.show,res:ok,cols:q.show.cols.map(c=>({...c,hide:0}))};if(q.full)VIEW.spec.cols=q.full}
 else if(q.play&&q.play.length&&q.play[0].n&&q.play[0].n.length){VIEW.spec={clef:'t',res:ok,cols:q.play.map(c=>({...c,mel:0}))}}
 setTimeout(()=>{if(q.play)playCols(q.play)},250);
 if(ok){if(SES.right%3===0){const B=L.b;ANT={x:B.x+B.w*.5,y:B.y+B.h*.5,t:0}}say(T2(pick(PRAISE)))}else say(T2(pick(SOFT))+(q.opts?' '+tt('The answer is','La risposta è')+` <b>${q.opts[q.a]}</b>.`:''));
 const nb=document.createElement('div');nb.className='row';nb.innerHTML=`<button class="main" id="next">${SES.i+1>=SES.n?tt('Finish ▸','Fine ▸'):tt('Next ▸','Avanti ▸')}</button>`;bar.appendChild(nb);layout();placeBubble();
 $('next').onclick=()=>{SES.i++;if(SES.i>=SES.n)finish();else question()}}
function finish(){SES.phase='end';hdr();say('');setBar('');VIEW=null;const k=SES.k,r=SES.right,n=SES.n;
 if(k<0){const pass=r>=Math.ceil(n*.9);PR.test=pass?1:Math.max(PR.test,-1);saveP();
  $('endCard').innerHTML=`<p class="small">${tt('Entry test','Test d’ingresso')}</p><div class="big">${r}/${n}</div><p>${pass?tt('You read music well. We can begin harmony.','Leggi bene le note. Possiamo cominciare l’armonia.'):tt(`You need ${Math.ceil(n*.9)} right notes. My advice: a few lessons with <a href="/notes/">Nadia Boulangigor</a>, then come back. But if you want, you can start anyway.`,`Servono ${Math.ceil(n*.9)} note giuste. Il mio consiglio: qualche lezione con <a href="/notes/">Nadia Boulangigor</a>, poi torna. Ma se vuoi, puoi cominciare lo stesso.`)}</p>
  <div class="row"><button class="main" id="nx">${pass||PR.done?tt('To the lessons ▸','Alle lezioni ▸'):tt('Start anyway ▸','Comincio lo stesso ▸')}</button>${pass?'':`<button id="again">${tt('Take the test again','Rifai il test')}</button><button id="nadia">${tt('Go to Nadia','Vai da Nadia')}</button>`}</div>`;
  $('end').hidden=false;$('nx').onclick=()=>{if(!pass&&!PR.test){PR.test=-1;saveP()}if(SES&&SES.after){begin(0)}else openMap()};if($('again'))$('again').onclick=()=>entry(SES&&SES.after);if($('nadia'))$('nadia').onclick=()=>{location.href='/notes/'};return}
 const pass=r>=PASS(k),isNew=pass&&k===PR.done&&PR.done<NL;PR.plays[k]=(PR.plays[k]|0)+1;if(!(PR.best[k]>=r))PR.best[k]=r;if(isNew)PR.done++;saveP();
 const test=isTest(k),seeds=pass?Math.min(10,(test?4:1)+(isNew?(test?4:1):0)):0;let p={};try{p=JSON.parse(localStorage.getItem('igortime_pending'))||{}}catch(e){}
 p.seeds=(p.seeds|0)+seeds;p.scores=p.scores||{};p.scores.harmony=p.scores.harmony||{};if(!(p.scores.harmony.all>=PR.done))p.scores.harmony.all=PR.done;try{localStorage.setItem('igortime_pending',JSON.stringify(p))}catch(e){}
 const nm=AVN[ME.avatar]||'Igor',l=LS[k],ready=pass&&l.ready?T2(l.ready):'';
 const msg=pass?(test?tt('Check passed. The unit is yours.','Verifica superata. L’unità è tua.'):tt('Lesson passed.','Lezione superata.')):tt(`You need ${PASS(k)} right answers. Read the lesson again and try once more.`,`Servono ${PASS(k)} risposte giuste. Rileggi la lezione e riprova.`);
 $('endCard').innerHTML=`<p class="small">${tt('Lesson','Lezione')} ${k+1} · ${T2(l.n)}</p><div class="big">${r}/${n}</div><p>${msg}</p>${ready?`<p id="endnew">${ready}</p>`:''}
 ${isNew&&PR.done<NL?`<p class="small">${tt('Next:','Prossima:')} ${PR.done+1}. ${T2(LS[PR.done].n)}</p>`:''}
 <p style="color:var(--warm)">${seeds?tt(`+${seeds} tofu seed${seeds>1?'s':''} for ${nm}’s field. Collect them back on the island.`,`+${seeds} sem${seeds>1?'i':'e'} di tofu per il campo di ${nm}. Li ritrovi sull’isola.`):''}</p>
 <div class="row">${isNew&&PR.done<NL?`<button class="main" id="nx">${tt('Next lesson ▸','Prossima lezione ▸')}</button>`:''}<button ${isNew&&PR.done<NL?'':'class="main"'} id="again">${tt('Do it again','Rifalla')}</button>${ready?`<button id="piano">🎹 ${tt('To the piano','Al pianoforte')}</button>`:''}<button id="map">${tt('All the lessons','Tutte le lezioni')}</button></div>
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('end').hidden=false;if($('nx'))$('nx').onclick=()=>begin(PR.done);$('again').onclick=()=>begin(k);$('map').onclick=()=>openMap();if($('piano'))$('piano').onclick=()=>{location.href='/cadences/'};
 if(PR.done>0)import('/board.js?v=5').then(B=>B.show($('endCard'),'harmony','all',PR.done,ME.avatar,tt('How far everyone got · lessons','Fin dove siete arrivati · lezioni'))).catch(()=>{})}
function entry(after){audio();if(AC.state==='suspended')AC.resume();$('start').hidden=true;$('end').hidden=true;SES={k:-1,i:0,right:0,res:[],q:null,phase:'lesson',n:20,after};VIEW={title:tt('Entry test','Test d’ingresso'),spec:{clef:'g',cols:[col([P(0,0,4)],'C'),col([P(4,0,4)]),col([P(3,0,3)])]}};hdr();
 say(tt('Before harmony, a little test: 20 notes on the grand staff, treble and bass clef. You need 18 right.','Prima dell’armonia, un piccolo test: 20 note sull’endecalineo, chiave di violino e di basso. Ne servono 18 giuste.'));
 setBar(`<div class="row"><button id="skip">${tt('Skip','Salta')}</button><button class="main" id="next">${tt('Start the test ▸','Inizia il test ▸')}</button></div>`);$('next').onclick=question;$('skip').onclick=()=>{if(!PR.test){PR.test=-1;saveP()}if(after)begin(0);else openMap()}}
window.__hm={G,LS,US,HT,makeQ,begin,openMap,entry,PR};
resize();requestAnimationFrame(frame);openMap();
})();
</script>
