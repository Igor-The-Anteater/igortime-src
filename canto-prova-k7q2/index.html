<script>/* Zoltán Kodigor, the teacher of singing and dictation (a homage to Zoltán Kodály, who taught a whole country to sing):
   an Igorlet with a white mane swept back, bushy white eyebrows, a big white beard and a dark jacket with a bow.
   Drawn in the 663×730 coordinates of Igor's picture. Also: his tuning fork. */
(function(){
const INK='#141414',TAU=Math.PI*2,WH='#f4f1ea',SH='rgba(150,145,135,.55)';
function hair(c){c.save();c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;c.lineWidth=6;
 // the mane: thick white hair swept back over the top of the head, with curly ends behind
 c.fillStyle=WH;c.beginPath();c.moveTo(392,122);
 c.bezierCurveTo(380,70,300,44,220,46);c.bezierCurveTo(150,46,90,58,46,84);
 c.bezierCurveTo(20,92,4,104,6,124);c.bezierCurveTo(-2,150,14,176,34,186);
 c.bezierCurveTo(30,160,40,140,58,132);c.bezierCurveTo(52,154,62,176,80,184);
 c.bezierCurveTo(80,154,100,128,140,112);c.bezierCurveTo(200,96,300,94,392,122);c.closePath();c.fill();c.stroke();
 c.strokeStyle=SH;c.lineWidth=4;for(let k=0;k<5;k++){c.beginPath();c.moveTo(360-k*58,90+k*4);c.quadraticCurveTo(300-k*58,64+k*6,230-k*50,72+k*10);c.stroke()}
 // bushy white eyebrows over the two eyes
 c.strokeStyle=INK;c.lineWidth=5;c.fillStyle=WH;
 for(const[x,y,r,w]of[[438,166,-.55,74],[536,146,.08,66]]){c.save();c.translate(x,y);c.rotate(r);c.beginPath();c.moveTo(-w/2,8);c.quadraticCurveTo(-w/2-6,-14,-w/4,-16);c.quadraticCurveTo(-w/8,-30,w/8,-20);c.quadraticCurveTo(w/3,-32,w/2+8,-10);c.quadraticCurveTo(w/2,8,w/4,8);c.quadraticCurveTo(0,16,-w/2,8);c.closePath();c.fill();c.stroke();c.restore()}
 c.restore()}
function beard(c){c.save();c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;c.lineWidth=6;
 // the jacket and the bow under the beard
 c.fillStyle='#2e2a3a';c.beginPath();c.moveTo(226,470);c.quadraticCurveTo(330,500,482,466);c.lineTo(500,570);c.quadraticCurveTo(360,600,206,566);c.closePath();c.fill();c.stroke();
 // a big white beard hanging under the head (the snout stays free on the right)
 c.fillStyle=WH;c.beginPath();c.moveTo(222,392);
 c.bezierCurveTo(260,420,380,446,476,432);
 c.bezierCurveTo(490,470,476,506,456,520);c.bezierCurveTo(450,548,424,560,404,556);
 c.bezierCurveTo(396,590,370,612,344,628);c.bezierCurveTo(328,600,300,588,284,566);
 c.bezierCurveTo(252,566,232,540,240,512);c.bezierCurveTo(214,498,210,470,226,452);
 c.bezierCurveTo(208,436,206,410,222,392);c.closePath();c.fill();c.stroke();
 c.strokeStyle=SH;c.lineWidth=4;for(let k=0;k<6;k++){const x=256+k*36;c.beginPath();c.moveTo(x,448+((k*7)%3)*6);c.quadraticCurveTo(x+8,494,x-2,532-((k*5)%3)*8);c.stroke()}
 // a little moustache over the smile
 c.strokeStyle=INK;c.lineWidth=5;c.fillStyle=WH;c.beginPath();c.moveTo(316,350);c.quadraticCurveTo(340,326,372,346);c.quadraticCurveTo(402,330,424,356);c.quadraticCurveTo(396,372,370,360);c.quadraticCurveTo(344,374,316,350);c.closePath();c.fill();c.stroke();
 c.restore()}
/* a tuning fork, centred at x,y, size s (for the boards and the room) */
function fork(c,x,y,s,col){c.save();c.translate(x,y);c.strokeStyle=col||'#c9a24a';c.lineCap='round';c.lineWidth=Math.max(2,s*.12);
 c.beginPath();c.moveTo(-s*.28,-s);c.lineTo(-s*.28,-s*.1);c.quadraticCurveTo(-s*.28,s*.18,0,s*.18);c.quadraticCurveTo(s*.28,s*.18,s*.28,-s*.1);c.lineTo(s*.28,-s);c.moveTo(0,s*.18);c.lineTo(0,s);c.stroke();c.restore()}
window.IgorKodigor={hair,beard,fork,LOOK:{avatar:'igor'}};
})();
</script>
<script>
(()=>{
const H=IgorHouse,{TAU,clamp,lerp,rr,drawAnt,paintAvatar,ME,AVN}=H,PAD=H.PAD||.24;
let IT=false;try{IT=(localStorage.getItem('igortime_lang')||window.SV_LANG||((navigator.language||'').toLowerCase().startsWith('it')?'it':'en'))==='it'}catch(e){IT=window.SV_LANG==='it'}
const tt=(en,it)=>IT?it:en,T2=a=>a?(IT?a[1]:a[0]):'';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),n=s.length;return n%2?s[n>>1]:(s[n/2-1]+s[n/2])/2};
const TEACHER='Zoltán Kodigor';
try{const h=localStorage.getItem('igortime_home');if(h)document.querySelectorAll('a[href="/"]').forEach(a=>a.href=h)}catch(e){}
if(IT)document.documentElement.lang='it';
$('gm').textContent=' · '+tt('Sing!','Canta!');
const SEEDR=6;

/* ================= names ================= */
const NM=IT?['Do','Re','Mi','Fa','Sol','La','Si']:['C','D','E','F','G','A','B'];
const PCN=IT?['Do','Do♯','Re','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si']:['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const LPC=[0,2,4,5,7,9,11];
const nameM=m=>PCN[((Math.round(m)%12)+12)%12];
const IVN={1:['minor 2nd','seconda minore'],2:['major 2nd','seconda maggiore'],3:['minor 3rd','terza minore'],4:['major 3rd','terza maggiore'],5:['perfect 4th','quarta giusta'],6:['tritone','tritono'],
 7:['perfect 5th','quinta giusta'],8:['minor 6th','sesta minore'],9:['major 6th','sesta maggiore'],10:['minor 7th','settima minore'],11:['major 7th','settima maggiore'],12:['octave','ottava']};
/* the little songs of Amadigor and Gubaigorina, to remember the intervals */
const SONG={1:['Jaws','Lo squalo'],'-1':['Für Elise','Per Elisa'],2:['Frère Jacques','Fra Martino'],3:['Brahms’ lullaby','la Ninna nanna di Brahms'],'-3':['cuck-oo!','cu-cù!'],
 4:['When the Saints','When the Saints'],'-4':['Beethoven’s Fifth','la Quinta di Beethoven'],5:['Here comes the bride','la Marcia nuziale'],6:['The Simpsons','i Simpson'],7:['Star Wars','Star Wars'],
 8:['The Entertainer','The Entertainer'],9:['My Bonnie','My Bonnie'],10:['Star Trek','Star Trek'],12:['Over the Rainbow','Over the Rainbow']};
const ivTxt=iv=>`<b>${T2(IVN[Math.abs(iv)])}</b> ${iv>0?'↑':'↓'}`;

/* ================= keys (for the notes of a key and for reading) =================
   t = tonic pc, L = letter of the tonic (0=C), m = mode, d = where the tonic sits on the treble staff (0 = middle C), sig = key signature */
const KEYS=[{t:0,L:0,m:'M',d:0,sig:[]},{t:7,L:4,m:'M',d:4,sig:[['s',10]]},{t:5,L:3,m:'M',d:3,sig:[['f',6]]},{t:2,L:1,m:'M',d:1,sig:[['s',10],['s',7]]},
 {t:9,L:5,m:'m',d:5,sig:[]},{t:4,L:2,m:'m',d:2,sig:[['s',10]]},{t:2,L:1,m:'m',d:1,sig:[['f',6]]}];
const SCALE={M:[0,2,4,5,7,9,11],m:[0,2,3,5,7,8,10]};
const kName=K=>spell(K,0)+' '+(K.m==='M'?tt('major','maggiore'):tt('minor','minore'));
/* degree (0 = tonic, 7 = the tonic above, -1 = below…), raised = the leading tone of minor */
const degPc=(K,g,raised)=>{const o=Math.floor(g/7),k=((g%7)+7)%7;return K.t+SCALE[K.m][k]+12*o+(raised&&k===6&&K.m==='m'?1:0)};
function spell(K,g,raised){const k=((g%7)+7)%7,L=(K.L+k)%7,want=((K.t+SCALE[K.m][k]+(raised&&k===6&&K.m==='m'?1:0))%12+12)%12;let a=want-LPC[L];if(a>6)a-=12;if(a<-6)a+=12;
 return NM[L]+(a===1?'♯':a===-1?'♭':a===2?'𝄪':a===-2?'𝄫':'')}

/* ================= progress ================= */
const KEY='igortime_solfege';
let PR={done:{},plays:{},voice:0,met:0};
try{Object.assign(PR,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const saveP=()=>{try{localStorage.setItem(KEY,JSON.stringify(PR))}catch(e){}};
const V=()=>PR.voice||55; // the comfortable note of the player's voice (MIDI)

/* ================= the course ================= */
const L=(id,n,k,p,cnt)=>({id,n,k,p:p||{},cnt:cnt||8});
const UNITS=[
 {ic:'🎤',n:['Your voice','La tua voce'],les:[
  L('v1',['Sing with me','Canta con me'],'one',{r:[-2,2],show:1,tol:.5},6),
  L('v2',['Other notes','Altre note'],'one',{r:[-5,5],show:1,tol:.5}),
  L('v3',['High and low','Acute e gravi'],'one',{r:[-7,8],show:1}),
  L('v4',['On the fly','Al volo'],'one',{r:[-6,7],show:1,short:1})]},
 {ic:'👣',n:['Little steps','Passetti'],les:[
  L('s1',['Same, then up','Uguale, poi su'],'echo',{ivs:[0,2,0,2],show:1,tol:.5}),
  L('s2',['Up and down','Su e giù'],'echo',{ivs:[2,-2],show:1}),
  L('s3',['Half steps','Mezzi passi'],'echo',{ivs:[1,-1,2,-2],show:1})]},
 {ic:'🪜',n:['Thirds','Le terze'],les:[
  L('t1',['Thirds up','Terze in su'],'echo',{ivs:[4,3],show:1}),
  L('t2',['Thirds down','Terze in giù'],'echo',{ivs:[-4,-3],show:1}),
  L('t3',['Steps and thirds','Passi e terze'],'echo',{ivs:[2,-2,3,-3,4,-4,1]})]},
 {ic:'🦘',n:['Big jumps','Salti grandi'],les:[
  L('j1',['Fifth and fourth up','Quinta e quarta in su'],'echo',{ivs:[7,5],show:1}),
  L('j2',['Fifth and fourth down','Quinta e quarta in giù'],'echo',{ivs:[-7,-5],show:1}),
  L('j3',['Octaves too','Anche le ottave'],'echo',{ivs:[12,-12,7,-7,5,-5]})]},
 {ic:'🎢',n:['Wide intervals','Intervalli larghi'],les:[
  L('w1',['Sixths','Le seste'],'echo',{ivs:[9,8,-9,-8]}),
  L('w2',['Sevenths and the tritone','Settime e tritono'],'echo',{ivs:[10,-10,6,-6,11]})]},
 {ic:'🎶',n:['Three notes','Tre note'],les:[
  L('m1',['Little steps','Passetti'],'echoN',{n:3,step:1,show:1}),
  L('m2',['Arpeggios','Arpeggi'],'echoN',{n:3,arp:1,show:1}),
  L('m3',['Anything goes','Un po’ di tutto'],'echoN',{n:3})]},
 {ic:'🎼',n:['Four and five notes','Quattro e cinque note'],les:[
  L('m4',['Four notes','Quattro note'],'echoN',{n:4,show:1},6),
  L('m5',['Five notes','Cinque note'],'echoN',{n:5},6)]},
 {ic:'🏷️',n:['Sing the interval','Canta l’intervallo'],les:[
  L('n1',['Seconds up','Seconde in su'],'name',{ivs:[2,1]}),
  L('n2',['Thirds up','Terze in su'],'name',{ivs:[3,4]}),
  L('n3',['Fifth, fourth, octave','Quinta, quarta, ottava'],'name',{ivs:[7,5,12]}),
  L('n4',['Seconds down','Seconde in giù'],'name',{ivs:[-2,-1]}),
  L('n5',['Thirds down','Terze in giù'],'name',{ivs:[-3,-4]}),
  L('n6',['Big ones down','Grandi in giù'],'name',{ivs:[-5,-7,-12]}),
  L('n7',['Sixths','Le seste'],'name',{ivs:[9,8]}),
  L('n8',['Seventh and tritone','Settima e tritono'],'name',{ivs:[10,6]}),
  L('n9',['All together','Tutti insieme'],'name',{ivs:[1,2,3,4,5,7,9,12,-1,-2,-3,-4,-5,-7],nodemo:1},10)]},
 {ic:'🔑',n:['Sing in a key','Canta nella tonalità'],les:[
  L('k1',['The first three','Le prime tre'],'deg',{pool:[0,1,2],len:1}),
  L('k2',['Up to the fifth','Fino alla quinta'],'deg',{pool:[0,1,2,3,4],len:1}),
  L('k3',['The whole scale','Tutta la scala'],'deg',{pool:[0,1,2,3,4,5,6,7],len:1}),
  L('k4',['Little tunes','Piccole melodie'],'deg',{pool:[0,1,2,3,4,5,6,7],len:3},6)]},
 {ic:'👀',n:['Read and sing','Leggi e canta'],les:[
  L('r1',['Three notes','Tre note'],'read',{n:3,leap:0,names:1},6),

const inVoice=(a,b)=>{const v=V();return ri(v+a,v+Math.max(a,b))};

 else if(les.k==='echo'){const iv=shuffle([...p.ivs,...p.ivs,...p.ivs,...p.ivs]).slice(0,n);for(const x of iv){const a=baseFor(x);out.push({k:'echo',tg:[a,a+x]})}}

  const pool=shuffle([...ivs,...ivs,...ivs,...ivs,...ivs]);for(let i=0;i<n;i++){const iv=pool[i%pool.length];const a=baseFor(iv);out.push({k:'name',iv,tg:[a,a+iv]})}}

 S.tm=setTimeout(()=>{if(SES!==S||S.cur!==it)return;const n=it.tg.length;listen({n,max:n===1?12:n*1.6+12});LS.item=it;setBar(micHtml(false));if(it.k==='one'||it.k==='echo')say(tt('Now you!','Ora tu!')+' 🎤')},dur*1000)}
function micHtml(wait){return`<div class="row"><div class="mic ${wait?'wait':''}"><span class="dot">🎤</span>${wait?tt('Listen…','Ascolta…'):tt('Sing!','Canta!')}<span class="lv"><i></i></span></div></div>
 <div class="row"><button id="rep">↻ ${tt('Hear it again','Riascolta')}</button>${wait?'':`<button id="dn">✓ ${tt('Done','Fatto')}</button>`}<button id="skip">${tt('Skip','Salta')}</button></div>`}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!SES)return;const it=SES.cur;
 if(b.id==='rep'&&it){stopListen(true);prompt(it)}
 else if(b.id==='dn'){stopListen()}
 else if(b.id==='skip'&&it){stopListen(true);if(!it.rep&&SES.first[SES.k]==null)SES.first[SES.k]=0;next()}
 else if(b.id==='again'&&it){prompt(it)}
 else if(b.id==='nx'){next()}
 else if(b.id==='hearA'&&it){playAnswer(it)}});
function playAnswer(it){if(it.k==='tempo'||it.k==='read'){chord(it.K,it.root);let t=1.7;const spb=it.spb||.6;it.notes.forEach(n=>{voice(n.m,t,Math.max(.3,n.dur*spb*.92));t+=n.dur*spb});return}
 it.tg.forEach((m,i)=>voice(m,i*.95,.85))}
function stopListen(cancel){if(!LS||LS.done)return;LS.done=true;const ls=LS;if(cancel){LS=null;return}judge(ls)}
/* ---- judging ---- */
function judge(ls){const it=ls.item,S=SES;if(!S||S.cur!==it)return;const tol=TOL(it);let res,oct=0;
 const voiced=ls.fr.filter(f=>f.m!=null).length;
 if(voiced<6){LS=null;VIEW.fr=null;say(tt('I couldn’t hear you. Sing a little louder, close to the microphone!','Non ti ho sentito. Canta un po’ più forte, vicino al microfono!'));
  setBar(`<div class="row"><button class="ex again" id="again">🎤 ${tt('Try again','Riprova')}</button><button id="skip">${tt('Skip','Salta')}</button></div>`);return}
 if(it.k==='tempo')({res,oct}=judgeTimed(ls,it,tol));
 else if(it.tg.length===1){let m=ls.stable;if(m==null){const sg=segment(ls.fr);const lg=sg.sort((a,b)=>b.dur-a.dur)[0];m=lg?lg.m:med(ls.fr.filter(f=>f.m!=null).map(f=>f.m))}
  const o=12*Math.round((m-it.tg[0])/12),e=m-o-it.tg[0];oct=o;res=[{m:m-o,err:e,ok:Math.abs(e)<=tol}]}
 else{const sg=segment(ls.fr,it.k==='read'?.14:.16);const A=align(sg,it.tg);oct=A.o;res=A.res.map((r,k)=>r?{m:r.m,err:r.m-it.tg[k],ok:Math.abs(r.m-it.tg[k])<=tol}:{m:null,err:0,ok:false})}
 VIEW.res=res;VIEW.oct=oct;VIEW.fr=ls.fr;VIEW.liveI=null;LS=null;
 const ok=res.every(r=>r.ok),first=it.tries===0;it.tries++;
 if(window.IgorStats)try{IgorStats.answer('solfege',it.k==='name'||it.k==='demo'?'iv'+it.iv:it.k,ok&&first,it.k==='name'||it.k==='demo'?[IVN[Math.abs(it.iv)][0]+(it.iv>0?' ↑':' ↓'),IVN[Math.abs(it.iv)][1]+(it.iv>0?' ↑':' ↓')]:null)}catch(e){}
 if(S.first[S.k]==null&&!it.rep)S.first[S.k]=ok?1:0;
 ding(ok);
 if(ok){const B=Lo.b;ANT={x:B.x+B.w*.5,y:B.y+B.h*.5,t:0};const e=Math.max(...res.map(r=>Math.abs(r.err)));
  say(T2(pick(PRAISE))+(e<=.2?' ✨':' '+tt('<small>(a hair off, but good!)</small>','<small>(un pelo fuori, ma va bene!)</small>')));
  setBar(`<div class="row"><button class="ex go" id="nx">${tt('Next','Avanti')} ▸</button></div>`);S.tm=setTimeout(()=>{if(SES===S&&S.cur===it)next()},1700);return}
 // not yet: say what to fix, simply
 const bad=res.findIndex(r=>!r.ok),r=res[bad];let tip;
 if(r.m==null)tip=res.length>1?tt(`I heard ${res.filter(x=>x.m!=null).length} notes out of ${res.length}. Sing them all, one after the other!`,`Ho sentito ${res.filter(x=>x.m!=null).length} note su ${res.length}. Cantale tutte, una dopo l’altra!`):tt('Hold the note a little longer!','Tieni la nota un po’ più a lungo!');
 else{const which=res.length>1?(IT?` (nota ${bad+1})`:` (note ${bad+1})`):'',dir=r.err<0?tt('A bit higher ↑','Un po’ più su ↑'):tt('A bit lower ↓','Un po’ più giù ↓');tip=(Math.abs(r.err)>1.5?tt('Not quite: ','Non ancora: '):tt('Almost! ','Quasi! '))+dir+which}
 if(it.tries>=3){S.again.push({...it,tries:2,rep:true});say(tip+'<br>'+tt('Here’s how it goes. We’ll try it again later!','Ecco com’è. La riproviamo dopo!'));playAnswer(it);
  setBar(`<div class="row"><button id="hearA">🔊 ${tt('Hear it','Ascolta')}</button><button class="ex go" id="nx">${tt('Next','Avanti')} ▸</button></div>`);return}
 say(tip);setBar(`<div class="row"><button class="ex again" id="again">🎤 ${tt('Try again','Riprova')}</button><button id="hearA">🔊 ${tt('Hear it','Ascolta')}</button><button id="nx">${tt('Next','Avanti')} ▸</button></div>`)}
/* in time: every note has its window; your voice inside the window must be on the note (a little delay is fine) */
function judgeTimed(ls,it,tol){const spb=it.spb,pre=ls.off,N=it.notes;let best=null;
 const vs=ls.fr.filter(f=>f.m!=null),mt=it.tg.reduce((a,b)=>a+b,0)/it.tg.length;const o=12*Math.round((med(vs.map(f=>f.m))-mt)/12);
 for(const lat of[0,.06,.12,.18,.24,.3,.36]){let beat=0,ok=0;const res=N.map(n=>{const a=pre+(beat+n.dur*.22)*spb+lat,b=pre+(beat+n.dur*.88)*spb+lat;beat+=n.dur;
   const w=ls.fr.filter(f=>f.t>=a&&f.t<=b),v=w.filter(f=>f.m!=null).map(f=>f.m-o);if(v.length<Math.max(2,w.length*.35))return{m:null,err:0,ok:false};
   // fold the octave of each note to the nearest (one slip of a deep voice should not ruin a phrase)
   let m=med(v),e=m-n.m;if(Math.abs(e)>9){const f=12*Math.round(e/12);m-=f;e-=f}const k=Math.abs(e)<=tol;if(k)ok++;return{m,err:e,ok:k}});
  if(!best||ok>best.ok)best={ok,res,lat}}
 return{res:best.res,oct:o}}
function next(){const S=SES;if(!S)return;clearTimeout(S.tm);stopListen(true);S.k++;VIEW={kind:'idle'};item()}

/* ================= end of a lesson ================= */
function finish(){const S=SES;S.over=true;hdr();say('');setBar('');VIEW={kind:'idle'};const n=S.nOrig||1,r=S.first.filter(x=>x===1).length,pct=r/n,les=S.les;
 if(window.IgorStats)IgorStats.game('solfege','all',{pct});
 const was=PR.done[les.id]>=PASS,pass=pct>=PASS;PR.plays[les.id]=(PR.plays[les.id]|0)+1;if(!(PR.done[les.id]>=pct))PR.done[les.id]=Math.round(pct*100)/100;saveP();
 const isNew=pass&&!was,seeds=Math.min(8,Math.ceil(pct*4)+(isNew?3:0)),nd=nDone();let p={};try{p=JSON.parse(localStorage.getItem('igortime_pending'))||{}}catch(e){}
 p.seeds=(p.seeds|0)+seeds;p.scores=p.scores||{};p.scores.solfege=p.scores.solfege||{};if(!(p.scores.solfege.all>=nd))p.scores.solfege.all=nd;try{localStorage.setItem('igortime_pending',JSON.stringify(p))}catch(e){}
 const stars=pct>=.95?3:pct>=.8?2:pct>=PASS?1:0,nx=LES.findIndex(l=>!(PR.done[l.id]>=PASS)),all=nx<0;
 const msg=pass?(all?tt('You sang the whole course. Bravo! Now any song is yours.','Hai cantato tutto il corso. Bravo! Ora ogni canzone è tua.'):isNew?tt('Lesson done! Your voice is getting surer.','Lezione fatta! La tua voce è sempre più sicura.'):tt('Done again: well sung!','Rifatta: ben cantata!')):
  tt('Good singing! One more go and it’s yours.','Bel lavoro! Un altro giro ed è tua.');
 $('endCard').innerHTML=`<p class="small">${T2(UNITS[les.u].n)} · ${T2(les.n)}</p><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="big">${r}/${n}</div><p>${msg}</p>
 ${!pct&&!r&&S.first.every(x=>x===0)?`<p>${tt('Tip: start from the lesson before, it helps!','Consiglio: riparti dalla lezione prima, aiuta!')}</p>`:''}
 <p style="color:var(--warm)">${seeds?tt(`+${seeds*SEEDR} tofu ants for the island`,`+${seeds*SEEDR} formiche di tofu per l’isola`):''}</p>
 <div class="row">${pass&&!all&&nx>=0?`<button class="main" id="enx">${tt('Next lesson ▸','Prossima lezione ▸')}</button>`:''}<button ${pass&&!all?'':'class="main"'} id="eag">${tt('Sing it again','Ricantala')}</button><button id="emap">${tt('All the lessons','Tutte le lezioni')}</button></div>
 ${pass&&!all&&nx>=0?`<p id="endnew">${UNITS[LES[nx].u].ic} ${T2(LES[nx].n)}</p>`:''}
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('end').hidden=false;if($('enx'))$('enx').onclick=()=>begin(nx);$('eag').onclick=()=>begin(les.i);$('emap').onclick=openMap;
 if(nd>0)Promise.reject().then(B=>B.show($('endCard'),'solfege','all',nd,ME.avatar,tt('How far everyone got · lessons','Fin dove siete arrivati · lezioni'))).catch(()=>{});
 hdr();$('sx').style.display='none';$('prog').style.display='none'}

/* ================= the microphone, the voice test ================= */
function micAsk(then){$('end').hidden=true;$('start').hidden=false;
 $('startCard').innerHTML=`<h2>🎤 ${tt('The <em>microphone</em>','Il <em>microfono</em>')}</h2><p>${tt('To hear you sing, I need the microphone. Nothing is recorded or sent anywhere: I only listen to the pitch, here, while you sing.','Per sentirti cantare mi serve il microfono. Niente viene registrato né mandato da nessuna parte: ascolto solo l’altezza, qui, mentre canti.')}</p>
 <div class="row"><button class="main" id="mok">🎤 ${tt('Turn on the microphone','Accendi il microfono')}</button><button id="mno">${tt('Back','Indietro')}</button></div><p class="small" id="merr"></p>`;
 $('mno').onclick=openMap;$('mok').onclick=async()=>{const ok=await micOn();if(ok){then()}else $('merr').innerHTML=tt('I can’t use the microphone. Allow it in the browser (the 🎤 or 🔒 icon next to the address) and try again. On a computer, check that a microphone is connected.','Non riesco a usare il microfono. Consentilo nel browser (l’icona 🎤 o 🔒 accanto all’indirizzo) e riprova. Sul computer, controlla che ci sia un microfono collegato.')}}
/* the voice test: sing a comfortable "aaah", I find your middle */
function calib(then){$('start').hidden=true;$('end').hidden=true;SES=null;hdr();VIEW={kind:'graph',tg:[V()],show:[0],tol:.5,span:5};
 say(tt('First, your voice. Sing a long, comfortable <b>“aaah”</b>: not high, not low. Like when you talk.','Prima, la tua voce. Canta un <b>“aaah”</b> lungo e comodo: né alto né basso. Come quando parli.'));
 const go=()=>{listen({n:1,max:99,calib:1});LS.item={calib:1};setBar(`<div class="row"><div class="mic"><span class="dot">🎤</span>${tt('Aaah…','Aaah…')}<span class="lv"><i></i></span></div></div>`);
  const chk=setInterval(()=>{if(!LS||LS.done||!LS.item||!LS.item.calib){clearInterval(chk);return}const t=nowA()-LS.t0,st=stable(LS.fr.filter(f=>f.t>t-1.1),t);
   if(st!=null&&LS.fr.filter(f=>f.t>t-1.1&&f.m!=null).length>25){clearInterval(chk);LS.done=true;const fr=LS.fr;LS=null;done(st,fr)}else if(t>9){clearInterval(chk);LS.done=true;LS=null;fail()}},120)};
 const done=(m,fr)=>{let v=Math.round(m);v=clamp(v,40,76);PR.voice=v;saveP();VIEW={kind:'graph',tg:[v],show:[1],tol:.5,fr,span:5,res:[{m,err:m-v,ok:true}],oct:0};
  say(tt(`Your voice is at home around <b>${nameM(v)}</b>. I’ll sing to you around there.`,`La tua voce sta comoda intorno al <b>${nameM(v)}</b>. Ti canterò lì intorno.`));
  setBar(`<div class="row"><button class="ex go" id="cok">${tt('Let’s sing!','Cantiamo!')} ▸</button><button id="cre">↻ ${tt('Again','Rifai')}</button></div>`);$('cok').onclick=then;$('cre').onclick=()=>calib(then)};
 const fail=()=>{say(tt('I couldn’t hear a steady note. Hold one “aaah”, a bit louder!','Non ho sentito una nota ferma. Tieni un “aaah”, un po’ più forte!'));
  setBar(`<div class="row"><button class="ex again" id="cre">🎤 ${tt('Try again','Riprova')}</button><button id="clow">${tt('Low voice','Voce grave')}</button><button id="chi">${tt('High voice','Voce acuta')}</button></div>`);
  $('cre').onclick=()=>calib(then);$('clow').onclick=()=>{PR.voice=50;saveP();then()};$('chi').onclick=()=>{PR.voice=60;saveP();then()}};
 setBar('');setTimeout(go,900)}

/* ================= the map of the course ================= */
function openMap(){stopAll();SES=null;say('');setBar('');VIEW={kind:'idle'};hdr();const nx=LES.findIndex(l=>!(PR.done[l.id]>=PASS)),all=nx<0;
 const units=UNITS.map((u,ui)=>{const ok=u.les.filter(l=>PR.done[l.id]>=PASS).length;return`<div class="unit">${u.ic} ${T2(u.n)} <small>${ok}/${u.les.length}</small></div><div class="map">${u.les.map(l=>{const d=PR.done[l.id],cls=d>=PASS?'done':l.i===nx?'cur':'';
  return`<button data-l="${l.i}" class="${cls}">${T2(l.n)}<small>${d>=PASS?(d>=.95?'★★★':d>=.8?'★★':'★'):l.i===nx?tt('next','prossima'):(l.i+1)}</small></button>`}).join('')}</div>`}).join('');
 $('startCard').innerHTML=`<h2>${tt('<em>Sing</em> with Kodigor','<em>Canta</em> con Kodigor')}</h2>
 <p>${tt(`<b>${TEACHER}</b> teaches you to sing in tune: first one note, then two, then little tunes; then the intervals by name, the notes of a key, and at the end you read and sing a whole solfège in time. He listens through the microphone.`,`<b>${TEACHER}</b> ti insegna a cantare intonato: prima una nota, poi due, poi piccole melodie; poi gli intervalli per nome, le note della tonalità, e alla fine leggi e canti un solfeggio intero a tempo. Ti ascolta dal microfono.`)}</p>
 ${PR.voice?`<p><span class="voice">🎤 ${tt('your voice','la tua voce')}: <b>${nameM(PR.voice)}</b> <button id="rev">${tt('test again','rifai il test')}</button></span></p>`:''}
 <div class="row"><button class="main" id="go">${all?tt('Sing the great solfège again','Ricanta il grande solfeggio'):nDone()?tt('Continue','Continua')+' · '+T2(LES[nx].n):tt('Start singing','Inizia a cantare')}</button></div>
 ${units}
 <p class="small">${tt('Earphones help: I hear only you, not me. For reading the notes there is Nadia Boulangigor, by the staff.','Con gli auricolari è meglio: sento solo te, non me. Per imparare a leggere le note c’è Nadia Boulangigor, al pentagramma.')}</p>
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('start').hidden=false;$('end').hidden=true;$('go').onclick=()=>begin(all?NL-1:nx);document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>begin(+b.dataset.l));
 if($('rev'))$('rev').onclick=()=>{audio();const go=()=>calib(openMap);MIC?go():micAsk(go)}}

resize();openMap();requestAnimationFrame(frame);
addEventListener('pagehide',micOff);
window.__sv={nowA:()=>nowA(),PR,LES,UNITS,get SES(){return SES},get LS(){return LS},begin,segment,align,detect,openMap,next,get VIEW(){return VIEW}};
})();
