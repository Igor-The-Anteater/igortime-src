 if(!f.fields.length)f.fields=d.fields;if(!f.igs.length)f.igs=d.igs;f.fields.forEach((x,i)=>{if(x.x==null){const P=plotPos(i);x.x=P.x;x.z=P.z}});if(!f.pos.pen||f.pos.pen.x===-4.9&&f.pos.pen.z===-1.5)f.pos.pen={x:-7,z:9};if(!f.cut.t)f.cut={t:[],r:[]};

/* --- the fields --- */
function growMult(f){const F=FM();return(1+.1*(F.fields.length-1))*(f.gh?1/1.2:1)*(f.compNext?.7:1)}
function phase(f,t){if(f.st!=='sown')return f.st;if(t>=f.tr)return'ready';if(t>=f.tg)return t>=(f.tg+f.tr)/2?'plant':'sprout';return'seed'}
const needsCare=(f,t)=>f.st==='sown'&&!f.cared&&t>=f.tg&&t<f.tr+SPC[f.sp].win*MIN;
function yieldOf(f,t){const sp=SPC[f.sp];let y=sp.yield+(FM().tools.basket>=2?1:0)+(f.bonus||0);if(!f.cared)y=Math.ceil(y*.75);return Math.max(1,y)}

/* --- jobs: the Igorlets take them in order; Igor can do some himself --- */
const TNAME={clear:['clearing','pulisce'],plow:['plowing','ara'],sow:['sowing','semina'],water:['watering','annaffia'],weed:['weeding','sarchia'],harvest:['harvesting','raccoglie'],tarp:['tarp','telo'],scare:['shooing','scaccia'],build:['building','costruisce']};
function taskMin(q){const Tl=FM().tools,f=q.f!=null?FM().fields[q.f]:null;switch(q.k){case'clear':return 20*[1,.7,.5][Tl.cart];case'plow':return 6*[1,.5,.25][Tl.plow];case'sow':return 2;
 case'water':return 4*(Tl.can?.5:1);case'weed':return 8;case'harvest':return({t:5,p:8,c:12})[f?f.sp:'t']*(Tl.basket?.6:1);case'tarp':return 10;case'scare':return 5;
 case'build':return BLD[q.b].up[q.to].min*[1,.7,.5][Tl.cart]}return 5}
function addTask(o){const F=FM();const q={id:F.nid++,done:0,w:[],max:o.k==='build'?2:1,igor:false,...o};q.dur=taskMin(q)*MIN;F.tasks.push(q);fmDirty=true;return q}
function tstate(q,t){const F=FM(),f=q.f!=null?F.fields[q.f]:null,before=ks=>F.tasks.some(o=>o.id<q.id&&o.f===q.f&&ks.includes(o.k));
 switch(q.k){case'clear':return f&&f.st==='new'?'ok':'drop';
  case'plow':return!f?'drop':f.st==='wild'?'ok':before(['clear','harvest'])?'wait':'drop';
  case'sow':return!f?'drop':f.st==='plowed'?'ok':before(['clear','harvest','plow'])?'wait':'drop';
  case'water':case'weed':{if(!f||f.st!=='sown')return'drop';if(q.heat){const E=F.ev;return E&&E.id===q.heat&&t<E.at&&f.heatOK!==q.heat?'ok':'drop'}return f.cared||t>=f.tr+SPC[f.sp].win*MIN?'drop':t>=f.tg?'ok':'wait'}
  case'harvest':return!f||f.st!=='sown'?'drop':t>=f.tr?'ok':'wait';
  case'tarp':return f?'ok':'drop';
  case'scare':{const E=F.ev;return E&&E.id===q.ev&&t<E.end&&!E.scared?'ok':'drop'}
  case'build':return'ok'}return'drop'}
function freeWorkers(q){for(const id of q.w){const g=igById(id);if(g&&g.task===q.id)g.task=null}q.w=[]}
function dropTask(q,why){const F=FM();freeWorkers(q);refund(q.cost);F.tasks=F.tasks.filter(o=>o!==q);fmDirty=true;if(why)note(why)}
function siteOf(q){if(q.k==='build')return spotOf(q.b);if(q.k==='scare')return fieldsMid();return fieldPos(q.f)}
function igorAt(q){if(where!=='out'||!started)return false;const P=siteOf(q);return Math.hypot(igor.position.x-P.x,igor.position.z-P.z)<2.3}
function assign(t){const F=FM();for(const q of F.tasks){if(q.igor||q.w.length>=q.max||tstate(q,t)!=='ok')continue;
  const need=isBuildK(q.k)?2:1,free=F.igs.filter(g=>!g.task&&!g.rest&&g.en>=need).sort((a,b)=>b.en-a.en);
  while(q.w.length<q.max&&free.length){if(q.w.length&&F.tasks.some(o=>o!==q&&!o.igor&&!o.w.length&&tstate(o,t)==='ok'))break;const g=free.shift();g.en-=need;g.task=q.id;q.w.push(g.id);fmDirty=true}}}
function finish(q,t){const F=FM(),f=q.f!=null?F.fields[q.f]:null;if(fmLive)snd(q.k,q.k==='harvest'&&f?yieldOf(f,t):0);
 for(const id of q.w){const g=igById(id);if(g){g.task=null;if(g.en<1){g.rest=true;note(tt(`${g.name} is tired: a nap at home.`,`${g.name} è stanco: un pisolino a casa.`),1)}}}q.w=[];F.tasks=F.tasks.filter(o=>o!==q);fmDirty=true;
 switch(q.k){
  case'clear':f.st='wild';note(tt(`${cap1(fname(q.f))} is cleared!`,`${cap1(fname(q.f))} è pulito!`));break;
  case'plow':f.st='plowed';note(tt(`${cap1(fname(q.f))} plowed.`,`${cap1(fname(q.f))} arato.`),1);break;
  case'sow':{const sp=SPC[f.sp],m=growMult(f);f.st='sown';f.t0=t;f.loss=0;f.bonus=0;f.cared=!sp.care||false;f.heatOK=null;
   if(F.first){f.tg=t+5*MIN;f.tr=t+15*MIN}else{f.tg=t+sp.germ*m*MIN;f.tr=t+sp.ready*m*MIN}f.compNext=false;
   note(tt(`Sown! Sprouts in ${fmtL(f.tg-t)}.`,`Seminato! Germoglia tra ${fmtL(f.tg-t)}.`),1);break}
  case'water':case'weed':{if(q.heat)f.heatOK=q.heat;if(q.k==='weed'||SPC[f.sp].care==='water')if(t>=f.tg)f.cared=true;
   if(q.k==='water'&&F.tools.can>=2){const j=F.fields.findIndex((o,i)=>i!==q.f&&(q.heat?o.st==='sown'&&o.heatOK!==q.heat&&!o.gh:SPC[o.sp].care==='water'&&needsCare(o,t)));if(j>=0){const o=F.fields[j];if(q.heat)o.heatOK=q.heat;if(SPC[o.sp].care==='water'&&t>=o.tg)o.cared=true;F.tasks.filter(x=>x.f===j&&x.k==='water'&&!x.w.length).forEach(x=>dropTask(x))}}
   note(q.k==='weed'?tt('Weeded!','Sarchiato!'):tt('Watered!','Annaffiato!'),1);break}
  case'harvest':{const y=yieldOf(f,t),r=addAnts(f.sp,y);f.st='wild';f.tg=f.tr=null;f.loss=0;f.bonus=0;F.first=false;
   note(r.lost?tt(`+${r.got} tofu ants. No room for the rest!`,`+${r.got} formiche di tofu. Non c’è posto per le altre!`):tt(`+${y} tofu ants. Gnam!`,`+${y} formiche di tofu. Gnam!`),2);
   if(f.auto&&!F.tasks.some(o=>o.f===q.f&&(o.k==='plow'||o.k==='sow'))){const c={s:SPC[f.sp].seeds};if((S.seeds|0)>=c.s){S.seeds-=c.s;addTask({k:'plow',f:q.f});addTask({k:'sow',f:q.f,cost:c})}else note(tt('No seeds to replant: play a game!','Niente semi per ripiantare: fai un gioco!'),1)}break}
  case'tarp':f.tarp={k:q.tk||'n',left:3};note(tt(`Tarp on ${fname(q.f)}.`,`Telo sul ${fname(q.f)}.`),1);break;
  case'scare':if(F.ev&&F.ev.id===q.ev)F.ev.scared=true;note(tt('Sparrows gone!','Passeri scacciati!'));break;
  case'build':F.b[q.b]=q.to;note(tt(`${N(BLD[q.b].N)} ready!`,`${N(BLD[q.b].N)}: fatto!`),2);break}}
// a ready field is harvested by the first free Igorlet, without asking
function autoTick(t){const F=FM();F.fields.forEach((f,i)=>{if(f.st==='sown'&&t>=f.tr&&!F.tasks.some(q=>q.f===i&&q.k==='harvest'))addTask({k:'harvest',f:i,auto:1})})}
function careTick(t){const F=FM();if(!F.water)return;F.fields.forEach((f,i)=>{if(F.water>0&&SPC[f.sp].care==='water'&&needsCare(f,t)){F.water--;f.cared=true;F.tasks.filter(x=>x.f===i&&x.k==='water'&&!x.heat).forEach(x=>dropTask(x))}})}
function advance(t,dt,live){const F=FM(),t1=t+dt;
 for(const g of F.igs)if(!g.task){g.en=Math.min(enMax(),g.en+dt/(LEAF*MIN)*restMult());if(g.rest&&g.en>=REST_TO){g.rest=false;fmDirty=true}}
 for(const q of F.tasks){if(tstate(q,t)!=='ok')continue;let r=q.w.length;if(live&&igorAt(q))r+=1;q.done+=dt*r}
 for(const q of[...F.tasks]){if(!F.tasks.includes(q))continue;const s=tstate(q,t1);if(s==='drop')dropTask(q);else if(s==='ok'&&q.done>=q.dur)finish(q,t1)}
 for(const g of F.igs)if(g.task&&!F.tasks.some(q=>q.id===g.task))g.task=null;
 autoTick(t1);assign(t1);careTick(t1);eventTick(t1)}
let fmDirty=false,fmLive=false,fmClock=0;
function simTo(t,live){const F=FM();let last=F.t||t;if(t-last>4*DAY)last=t-4*DAY;fmLive=live;const step=MIN/4;
 while(last<t){const dt=Math.min(step,t-last);fmClock=last+dt;advance(last,dt,live&&t-last<=step);last+=dt}F.t=t;fmLive=false}

/* --- messages: said now if you are here, kept for later if you are away --- */
function note(txt,quiet){const F=FM();F.log.push({t:fmClock||Date.now(),x:txt});if(F.log.length>30)F.log.splice(0,F.log.length-30);
 if(fmLive&&started&&Math.abs((fmClock||Date.now())-Date.now())<20000){say(txt,quiet===1?2.4:3.2)}}
const fmtL=ms=>{const s=Math.max(0,ms)/1000,h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?`${h} h${m?' '+m+' min':''}`:m?`${m} min`:`${Math.ceil(s)} s`};

/* --- events: one a day between 9 and 21, the same for everyone; a warning first --- */
const hsh=n=>{let h=Math.sin(n*12.9898+78.233)*43758.5453;return h-Math.floor(h)};
const tzMs=t=>-new Date(t).getTimezoneOffset()*6e4;
const dayIdx=t=>FAST>1?Math.floor(t/DAY):Math.floor((t+tzMs(t))/864e5);
const dayStart=d=>FAST>1?d*DAY:d*864e5-tzMs(d*864e5);
function seasonOfT(t){const m=FAST>1?new Date().getMonth():new Date(t).getMonth();return m<2||m===11?'Winter':m<5?'Spring':m<8?'Summer':'Autumn'}
function mkEv(k,at,id){const D=EVK[k],lead=D.lead*MIN;return{id,k,warn:at-lead,at,end:at+D.dur*MIN}}
function evPlan(d){const F=FM();if(lvlOf()<2)return null;const h1=hsh(d*1.7+.3),h2=hsh(d*3.1+.7),at=dayStart(d)+(9+h1*11)*HOUR;if(at<F.created+2*DAY)return null;let k;
 if(((d%7)+7)%7===3&&F.igs.length<IGMAX)k='stray';
 else{const L=EVS[seasonOfT(at)],tot=L.reduce((a,b)=>a+b[1],0);let x=h2*tot;for(const[kk,w]of L){x-=w;if(x<0){k=kk;break}}k=k||L[0][0]}
 return mkEv(k,at,'d'+d)}
function eventTick(t){const F=FM();let E=F.ev;
 if(!E){const d=dayIdx(t);for(const dd of[d-1,d]){const c=evPlan(dd);if(c&&!F.evDone[c.id]&&t>=c.warn&&t<c.end){F.ev=E=c;fmDirty=true;break}}}
 if(!E)return;
 if(!E.seen){E.seen=1;onWarn(E,t)}if(fmLive&&t>=E.warn&&t<=E.at)E.here=1;
 if(!E.started&&t>=E.at){E.started=1;strike(E,t)}
 if(t>=E.end){endEv(E,t);F.evDone[E.id]=1;const ks=Object.keys(F.evDone);if(ks.length>40)for(const k of ks.slice(0,ks.length-40))delete F.evDone[k];F.ev=null;fmDirty=true}}
const sownFields=()=>FM().fields.map((f,i)=>[f,i]).filter(([f])=>f.st==='sown');
function onWarn(E,t){const D=EVK[E.k];if(fmLive)snd('warn');
 if(D.lead)note(tt(`${N(D.N)} in ${fmtL(E.at-t)}! ${N(D.ask)}`,`${N(D.N)} tra ${fmtL(E.at-t)}! ${N(D.ask)}`));else note(`${N(D.N)}! ${N(D.ask)}`)}
/* gentle weather: nothing is ever lost. A field that is ready gets a bonus; a field left out only grows a bit slower,
   and only if someone was on the island during the warning: who wasn't there loses nothing */
function strike(E,t){const F=FM(),S0=sownFields();E.nf=S0.length;E.cov=0;const slow=[],D0=EVK[E.k];let bon=0;
 const quarter=f=>Math.ceil(SPC[f.sp].yield/4),third=f=>Math.ceil(SPC[f.sp].yield/3),delay=(f,ms)=>{if(!E.here)return;if(t<f.tr){if(t<f.tg)f.tg+=ms;f.tr+=ms}};
 const plus=(f,n)=>{f.bonus=(f.bonus||0)+n;bon+=n;E.cov++};
 for(const[f,i]of S0){if(f.gh&&E.k!=='drizzle'){plus(f,quarter(f));continue}
  switch(E.k){case'storm':case'hail':case'frost':{const tp=f.tarp,need=TK[E.k];if(tp){tp.left--;if(tp.left<=0)f.tarp=null}
    if(tp&&(!need||tp.k===need)){plus(f,E.k==='frost'?third(f):quarter(f));break}
    if(E.here){delay(f,(E.k==='frost'?3:E.k==='hail'?1:2)*HOUR*(tp?.5:1));slow.push(i)}break}
   case'heat':if(f.heatOK===E.id){plus(f,quarter(f));break}if(E.here&&t<f.tr){if(t<f.tg)f.tg+=(f.tg-t)*.3;f.tr+=(f.tr-t)*.3;slow.push(i)}break;
   case'birds':if(f.crow||E.scared){plus(f,quarter(f));break}if(E.here){delay(f,HOUR);slow.push(i)}break;
   case'drizzle':if(t<f.tr){const r=Math.min(f.tr-t,3*HOUR)*.25;if(t<f.tg)f.tg-=Math.min(f.tg-t,r);f.tr-=r}break}}
 E.hurt=slow;fmDirty=true;const n=slow.length;
 if(D0.neg)note(!E.nf?tt(`${N(D0.N)}! Nothing was growing.`,`${N(D0.N)}! Non cresceva niente.`):bon&&!n?tt(`${N(D0.N)}! All fields ready: +${bon} tofu ants at harvest!`,`${N(D0.N)}! Tutti i campi pronti: +${bon} formiche di tofu al raccolto!`):bon?tt(`${N(D0.N)}! +${bon} tofu ants for the ready fields; the others grow a bit slower.`,`${N(D0.N)}! +${bon} formiche per i campi pronti; gli altri crescono un po’ più piano.`):n?tt(`${N(D0.N)}! The fields grow a bit slower. Next time we get ready!`,`${N(D0.N)}! I campi crescono un po’ più piano. La prossima volta ci prepariamo!`):tt(`${N(D0.N)} went by. All fine!`,`${N(D0.N)} passato. Tutto bene!`));
 else if(E.k==='drizzle')note(tt('Drizzle: everything grows faster.','Pioggerella: tutto cresce più in fretta.'))}
function endEv(E,t){if(E.k==='storm'&&E.nf>0&&E.cov===E.nf){S.seeds+=3;note(tt('A rainbow! +3 seeds.','Un arcobaleno! +3 semi.'),2)}
 if(E.k==='stray'&&!E.taken)note(tt('The stray Igorlet left.','L’Igorlet randagio se n’è andato.'))}

/* --- player actions --- */
const NEED=c=>tt(`Need ${costTxt(c)}.`,`Servono ${costTxt(c)}.`);
function sowCost(f){return{s:SPC[f.sp].seeds}}
function order(i,k,mine){const F=FM(),f=F.fields[i];if(!f)return;
 if(k!=='replant'&&F.tasks.some(q=>q.f===i&&q.k===k&&!q.heat))return say(tt('Already on the list.','È già in lista.'),2);
 const mk=(kk,extra={})=>addTask({k:kk,f:i,igor:!!mine,...extra});
 if(k==='sow'||k==='plowsow'||k==='replant'){const c=sowCost(f);if(!pay(c))return say(tt(`Need ${costTxt(c)}: play a game!`,`Servono ${costTxt(c)}: fai un gioco!`),3);
  if(k==='plowsow')mk('plow');if(k==='replant'){if(!F.tasks.some(q=>q.f===i&&q.k==='harvest'))mk('harvest');mk('plow')}mk('sow',{cost:c})}
