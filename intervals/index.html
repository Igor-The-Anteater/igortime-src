 m2:{s:1,n:['semitone','semitono'],t:['minor second','seconda minore'],up:{ic:'🦈',h:['like Jaws','come Lo squalo']},dn:{ic:'🎹',h:['like Für Elise','come Per Elisa'],mel:'elise'},ha:['it scratches','graffia']},
 M2:{s:2,n:['tone','tono'],t:['major second','seconda maggiore'],up:{ic:'🔔',h:['like Frère Jacques','come Fra Martino'],mel:'jacques'},dn:{ic:'🪜',h:['one step down: mi-re','un gradino giù: mi-re'],mel:'scale'},ha:['a bit rough','un po’ ruvido']},
 m3:{s:3,n:['minor third','terza minore'],up:{ic:'🌙',h:['like Brahms’ Lullaby','come la Ninna nanna'],mel:'brahms'},dn:{ic:'🐦',h:['like the cuckoo','come il cucù'],mel:'cuckoo'},ha:['sweet, a bit sad','dolce, un po’ triste']},
 M3:{s:4,n:['major third','terza maggiore'],up:{ic:'🎺',h:['like When the Saints','come When the Saints'],mel:'saints'},dn:{ic:'⚡',h:['like Beethoven’s Fifth','come la Quinta di Beethoven'],mel:'fifth'},ha:['sweet and bright','dolce e luminosa']},
 P4:{s:5,n:['fourth','quarta'],t:['perfect fourth','quarta giusta'],up:{ic:'💍',h:['like the Wedding March','come la Marcia nuziale'],mel:'wedding'},dn:{ic:'🎻',h:['like Mozart’s Little Night Music','come la Serenata di Mozart'],mel:'mozart'},ha:['open, a bit hollow','aperta, un po’ vuota']},

 m6:{s:8,n:['minor sixth','sesta minore'],up:{ic:'🎩',h:['like The Entertainer','come The Entertainer'],mel:'entertainer'},dn:{ic:'🍂',h:['a big, wistful jump','un salto grande e malinconico']},ha:['soft and dreamy','morbida e sognante']},
 M6:{s:9,n:['major sixth','sesta maggiore'],up:{ic:'⛵',h:['like My Bonnie','come My Bonnie'],mel:'bonnie'},dn:{ic:'🏔',h:['a big, bright jump','un salto grande e luminoso']},ha:['warm and open','calda e aperta']},
 m7:{s:10,n:['minor seventh','settima minore'],up:{ic:'🖖',h:['an octave minus a tone (Star Trek)','un’ottava meno un tono (Star Trek)']},dn:{ic:'🖖',h:['an octave minus a tone','un’ottava meno un tono']},ha:['wants to move on','vuole andare avanti']},
 M7:{s:11,n:['major seventh','settima maggiore'],up:{ic:'🤏',h:['an octave minus a semitone','un’ottava meno un semitono']},dn:{ic:'🤏',h:['an octave minus a semitone','un’ottava meno un semitono']},ha:['sharp and tense','tagliente e tesa']},
 P8:{s:12,n:['octave','ottava'],up:{ic:'🪞',h:['the same note, higher','la stessa nota, più in alto']},dn:{ic:'🪞',h:['the same note, lower','la stessa nota, più in basso']},ha:['one note, doubled','una nota sola, doppia']}};

const MEL={
 jacques:[[0,.42],[2,.42],[4,.42],[0,.6]],
 scale:[[0,.42],[-2,.42],[-4,.7]],
 brahms:[[0,.26],[0,.26],[3,.8],[null,.06],[0,.26],[0,.26],[3,.9]],
 cuckoo:[[0,.3],[-3,.55],[null,.25],[0,.3],[-3,.7]],
 saints:[[0,.34],[4,.34],[5,.34],[7,1.1]],
 fifth:[[0,.15],[0,.15],[0,.15],[-4,1.2]],
 wedding:[[0,.6],[5,.45],[5,.15],[5,1.1]],
 mozart:[[0,.42],[null,.06],[-5,.2],[0,.42],[null,.06],[-5,.2],[0,.2],[-5,.2],[0,.2],[4,.2],[7,.8]],
 twinkle:[[0,.34],[0,.34],[7,.34],[7,.34],[9,.34],[9,.34],[7,.7]],
 entertainer:[[-2,.13],[-1,.13],[0,.13],[8,.26],[0,.13],[8,.26],[0,.13],[8,.7]],

/* ================= the stages ================= */
const ST=[
 {k:'same',ic:'👂',name:['Same or different?','Uguali o diverse?']},
 {k:'dir',ic:'↕️',name:['Up or down?','Sale o scende?']},
 {k:'step',ic:'🦘',name:['Little step or jump?','Passetto o salto?']},
 {k:'iv',ic:'🦈',name:['Semitone and tone','Semitono e tono'],nw:['m2','M2']},
 {k:'iv',ic:'🌙',name:['The minor third','La terza minore'],nw:['m3']},
 {k:'iv',ic:'🎺',name:['The major third','La terza maggiore'],nw:['M3']},
 {k:'iv',ic:'⭐',name:['The fifth','La quinta'],nw:['P5']},
 {k:'iv',ic:'💍',name:['The fourth','La quarta'],nw:['P4']},
 {k:'iv',ic:'🪞',name:['The octave','L’ottava'],nw:['P8']},
 {k:'iv',ic:'😈',name:['The tritone','Il tritono'],nw:['TT']},
 {k:'iv',ic:'🎩',name:['The sixths','Le seste'],nw:['m6','M6']},
 {k:'iv',ic:'🖖',name:['The sevenths','Le settime'],nw:['m7','M7']},
 {k:'iv',ic:'🎼',name:['All together','Tutti insieme'],nw:[],all:1},
 {k:'iv',ic:'🎹',name:['Notes together','Note insieme'],nw:[],harm:1}];
const NS=ST.length,NQ=10,PASS=8;
function setOf(si){if(ST[si].harm)return null;const o=[];for(let k=3;k<=si;k++)for(const x of ST[k].nw||[])o.push(x);return ST[si].all?IVK.slice():o}
const HARM0=['m2','M2','m3','M3','P4','P5','P8'],HARM1=['m2','M2','m3','M3','P4','TT','P5','m6','M6','m7','M7','P8'];

/* what the maestro says at the start of each stage; ex = things to listen to */
const S_=(en,it,ex)=>({say:[en,it],ex:ex||[]});
const X={iv:(k,d,lab)=>({iv:k,d,lab}),mel:(m,lab)=>({mel:m,lab}),same:lab=>({same:1,lab}),st:(n,d,lab)=>({st:n,d,lab}),harm:(k,lab)=>({harm:k,lab})};
const LES=[
 [S_(`Welcome to our school! I am <b>${MAESTRO}</b>, the music teacher.`,`Benvenuto nella nostra scuola! Io sono <b>${MAESTRO}</b>, il maestro di musica.`),
  S_(`And I am <b>${MAESTRA}</b>. We teach together: here we train our ears, one little step at a time.`,`E io sono <b>${MAESTRA}</b>. Insegniamo insieme: qui alleniamo le orecchie, un passetto alla volta.`),
  S_('We start easy: I play two notes, one after the other. Are they the <b>same</b> or <b>different</b>?','Si comincia facile: suono due note, una dopo l’altra. Sono <b>uguali</b> o <b>diverse</b>?',[X.same(['Same','Uguali']),X.st(7,1,['Different','Diverse'])]),
  S_('You listen and choose. A mistake? No problem: we listen again together. Ready?','Tu ascolti e scegli. Sbagli? Nessun problema: le riascoltiamo insieme. Pronto?')],
 [S_('Now: does the second note go <b>up</b> or <b>down</b>? Think of Igor on the stairs.','Adesso: la seconda nota <b>sale</b> o <b>scende</b>? Pensa a Igor sulle scale.',[X.st(5,1,['Up','Sale']),X.st(5,-1,['Down','Scende'])]),
  S_('When the notes are close, it is harder. Listen carefully!','Quando le note sono vicine è più difficile. Ascolta bene!',[X.st(2,1,['Up','Sale']),X.st(2,-1,['Down','Scende'])])],
 [S_('Two notes can be close, like a <b>little step</b> on the stairs…','Due note possono essere vicine, come un <b>passetto</b> sulle scale…',[X.st(2,1,['Little step','Passetto']),X.st(1,-1,['Little step','Passetto'])]),
  S_('…or far apart, like a <b>jump</b>!','…oppure lontane, come un <b>salto</b>!',[X.st(7,1,['Jump','Salto']),X.st(9,-1,['Jump','Salto'])]),
  S_('Up or down does not matter now: only the distance counts.','Che salga o scenda adesso non importa: conta solo la distanza.')],
 [S_('The smallest little step of all is the <b>semitone</b>. It is also called a <b>minor second</b>.','Il passetto più piccolo di tutti si chiama <b>semitono</b>. Si chiama anche <b>seconda minore</b>.',[X.iv('m2',1,['Semitone up','Semitono su']),X.iv('m2',-1,['Semitone down','Semitono giù'])]),
  S_('Going up, it sounds like the shark in <b>Jaws</b>: dum-dum… Going down, it is the start of <b>Für Elise</b>.','Salendo è come lo squalo di <b>Lo squalo</b>: dum-dum… Scendendo è l’inizio di <b>Per Elisa</b>.',[X.iv('m2',1,['🦈 Jaws','🦈 Lo squalo']),X.mel('elise',['🎹 Für Elise','🎹 Per Elisa'])]),
  S_('Two semitones make a <b>tone</b>. It is also called a <b>major second</b>.','Due semitoni fanno un <b>tono</b>. Si chiama anche <b>seconda maggiore</b>.',[X.iv('M2',1,['Tone up','Tono su']),X.iv('M2',-1,['Tone down','Tono giù'])]),
  S_('Going up, it is <b>Frère Jacques</b>. Going down, it is like stepping down: mi-re.','Salendo è <b>Fra Martino</b>. Scendendo è come scendere un gradino: mi-re.',[X.mel('jacques',['🔔 Frère Jacques','🔔 Fra Martino']),X.mel('scale',['🪜 Mi-re-do','🪜 Mi-re-do'])]),
  S_('Hear the difference: semitone… tone. The buttons will help you with the little songs.','Senti la differenza: semitono… tono. Sui pulsanti trovi le canzoncine per aiutarti.',[X.iv('m2',1,['Semitone','Semitono']),X.iv('M2',1,['Tone','Tono'])])],
 [S_('A new friend: the <b>minor third</b>. A small jump, a little bit sad.','Una nuova amica: la <b>terza minore</b>. Un piccolo salto, un po’ malinconico.',[X.iv('m3',1,['Up','Sale']),X.iv('m3',-1,['Down','Scende'])]),
  S_('Going up, it starts like <b>Brahms’ Lullaby</b>. When two notes sound like the lullaby, it is always a minor third!','Salendo inizia come la <b>Ninna nanna</b> di Brahms. Quando due note ti sembrano la ninna nanna, è sempre una terza minore!',[X.mel('brahms',['🌙 The lullaby','🌙 La ninna nanna']),X.iv('m3',1,['Minor third','Terza minore'])]),
  S_('Going down, it is the <b>cuckoo</b>!','Scendendo è il <b>cucù</b>!',[X.mel('cuckoo',['🐦 Cuckoo!','🐦 Cucù!']),X.iv('m3',-1,['Minor third down','Terza minore giù'])]),
  S_('Now I mix it with semitones and tones. Listen, then choose.','Adesso la mescolo con semitoni e toni. Ascolta, poi scegli.')],
 [S_('The <b>major third</b>: one semitone bigger than the minor one, and brighter.','La <b>terza maggiore</b>: un semitono più grande della minore, e più luminosa.',[X.iv('M3',1,['Major third','Terza maggiore']),X.iv('m3',1,['Minor third','Terza minore'])]),
  S_('Going up, it is <b>When the Saints Go Marching In</b>.','Salendo è <b>When the Saints Go Marching In</b>.',[X.mel('saints',['🎺 When the Saints','🎺 When the Saints'])]),
  S_('Going down, it is <b>Beethoven’s Fifth</b>: ta-ta-ta-taaa!','Scendendo è la <b>Quinta di Beethoven</b>: ta-ta-ta-taaa!',[X.mel('fifth',['⚡ Beethoven','⚡ Beethoven']),X.iv('M3',-1,['Major third down','Terza maggiore giù'])])],
 [S_('The <b>fifth</b>: a nice, wide-open jump.','La <b>quinta</b>: un salto bello aperto.',[X.iv('P5',1,['Fifth up','Quinta su'])]),
  S_('Going up, it is <b>Twinkle Twinkle Little Star</b>… and the start of <b>Star Wars</b> too!','Salendo è <b>Brilla brilla la stellina</b>… e anche l’inizio di <b>Star Wars</b>!',[X.mel('twinkle',['⭐ Twinkle twinkle','⭐ Brilla brilla'])]),
  S_('Going down, it is a <b>falling star</b>.','Scendendo è una <b>stella cadente</b>.',[X.iv('P5',-1,['🌠 Fifth down','🌠 Quinta giù'])])],

 g.strokeStyle='#ffe08a';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.moveTo(ax,ay);g.quadraticCurveTo((ax+bx)/2,Math.min(ay,by)-sh*2.2,lerp(ax,bx,u),lerp(ay,by,u)-Math.sin(u*Math.PI)*0);g.stroke();g.setLineDash([]);
 const dot=(x,y,c,lab)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,Math.max(7,sw*.32),0,TAU);g.fill();g.strokeStyle='#1d2b22';g.lineWidth=2;g.stroke();if(lab){chalk(Math.max(10,sw*.38),600);g.fillStyle='#1d2b22';g.fillText(lab,x,y+1)}};
 dot(ax,ay,'#f6d34a','1');if(u>.98||demo)dot(bx,by,'#7fe08a','2');
 const s=Math.min(B.w/14,B.h/7);chalk(Math.max(13,s*.62),600);
 const name=q.ans&&IV[q.ans]?T2(IV[q.ans].n):n===0?tt('the same note','la stessa nota'):'';g.fillText((name?name+' · ':'')+(n===0?'':n+' '+(n===1?tt('semitone','semitono'):tt('semitones','semitoni'))),B.x+B.w/2,B.y+B.h*.22+ (B.h*.0));
 if(q.harm){chalk(Math.max(11,s*.45));g.globalAlpha=.75;g.fillText(tt('(played together)','(suonate insieme)'),B.x+B.w/2,B.y+B.h*.33);g.globalAlpha=1}}
function drawFig(spr,F,face){const w=F.h*SW/SH,by=F.y+Math.sin(T*1.6)*F.h*.012;g.save();g.translate(F.x,by);g.scale(face,1);g.fillStyle='rgba(40,20,8,.25)';g.beginPath();g.ellipse(0,F.h*.5,w*.34,F.h*.05,0,0,TAU);g.fill();
 if(igOK)g.drawImage(spr,-w/2,-F.h/2-F.h*PAD,w,F.h*(1+PAD));g.restore()}
/* the ant prize: one hops into the student's mouth */
let ANT=null;
function frame(ts){const t=ts/1000,dt=Math.min(.05,t-(frame.l||t));frame.l=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);room();board();
 if(igOK){paintMaestro(T);paintSofia(T);paintStudent(T)}
 // the one who is talking hops a little
 const hop=k=>SPK===k&&bubTxt?Math.abs(Math.sin(T*4))*L.m.h*.025:0;
 drawFig(mspr,{...L.m,y:L.m.y-hop('a')},1);drawFig(fspr,{...L.f,y:L.f.y-hop('s')},1);
 const gulp=ANT&&ANT.t>.55&&ANT.t<.8?Math.sin((ANT.t-.55)/.25*Math.PI):0;const S=L.s;g.save();g.translate(S.x,S.y);g.scale(1+gulp*.07,1-gulp*.05);g.translate(-S.x,-S.y);drawFig(sspr,S,-1);g.restore();
 if(ANT){ANT.t+=dt;const u=clamp(ANT.t/.6,0,1),mxp=S.x-S.h*.32,myp=S.y+S.h*.42,x=lerp(ANT.x,mxp,u),y=lerp(ANT.y,myp,u)-Math.sin(u*Math.PI)*80;if(u<1)drawAnt(g,x,y,Math.max(.5,S.h/260),-.5+u,T,{});if(ANT.t>1)ANT=null}
 requestAnimationFrame(frame)}

/* ================= the maestro talks ================= */
const bub=$('bubble');let bubTxt='';
let SPK='a';
/* who: 'a' = Amadigor, 's' = Sofia Gubaigorina; they take turns */
function say(html,who){if(who)SPK=who;bubTxt=html;bub.innerHTML=html?`<small style="display:block;font-size:.68em;opacity:.65">${SPK==='s'?MAESTRA:MAESTRO}</small>`+html:'';bub.style.opacity=html?1:0;placeBubble()}
function placeBubble(){if(!bubTxt)return;const M=SPK==='s'?L.f:L.m;if(!M)return;const bw=bub.offsetWidth,bh=bub.offsetHeight,headY=M.y-M.h*.5-M.h*PAD*.55;
 let x=L.land?M.x-bw*.25:M.x-M.h*.25,y=headY-bh-14;x=clamp(x,10,W-bw-10);
 if(!L.land){y=clamp(y,L.b.y+L.b.h+8,Hh);if(y+bh>M.y-M.h*.15){/* not enough room above the maestro: put the bubble over the board's lower edge */y=Math.max(64,L.b.y+L.b.h-bh*.6)}}
 else y=Math.max(64,y);
 bub.style.transform=`translate(${x}px,${y}px)`;bub.style.setProperty('--tx',clamp(M.x-x,24,bw-24)+'px')}

/* ================= flow ================= */
const bar=$('bar');
function setBar(html){bar.innerHTML=html;layout();placeBubble()}
function hdr(){if(!SES){$('st1').innerHTML=`${tt('stages','tappe')} <b>${PR.done}/${NS}</b>`;$('dots').innerHTML='';return}
 $('st1').innerHTML=`${tt('stage','tappa')} <b>${SES.si+1}</b>`+(SES.phase==='lesson'?'':` · <b>${Math.min(SES.i+1,NQ)}/${NQ}</b>`);
 $('dots').innerHTML=SES.phase==='lesson'?'':Array.from({length:NQ},(_,k)=>`<i class="${SES.res[k]===1?'ok':SES.res[k]===0?'no':k===SES.i?'now':''}"></i>`).join('')}
$('stat').onclick=()=>{if(SES&&SES.phase!=='end'){hush();openMap()}};

function openMap(){SES=null;say('');setBar('');hdr();const cur=Math.min(PR.done,NS-1),fin=PR.done>=NS;
 const chips=ST.map((s,k)=>`<button data-st="${k}" class="${k<PR.done?'done':k===cur&&!fin?'cur':''}" ${k>PR.done&&!OPEN?'disabled':''}><span class="ic">${k>PR.done&&!OPEN?'🔒':s.ic}</span>${T2(s.name)}<small>${k<PR.done?'✓ '+tt('done','fatta'):k===cur&&!fin?tt('next','prossima'):tt('stage','tappa')+' '+(k+1)}</small></button>`).join('');
 $('startCard').innerHTML=`<h2>${tt('The <em>maestros’</em> lessons','Le lezioni dei <em>maestri</em>')}</h2>
 <p>${tt(`<b>${MAESTRO}</b> and <b>${MAESTRA}</b> teach you to recognise <b>intervals</b>: the distance between two notes. No music theory needed: we start very easy, and little songs help you remember. Every stage you pass opens the next one.`,`<b>${MAESTRO}</b> e <b>${MAESTRA}</b> ti insegnano a riconoscere gli <b>intervalli</b>: la distanza tra due note. Non serve sapere la musica: si parte facilissimo, e le canzoncine ti aiutano a ricordare. Ogni tappa superata apre la successiva.`)}</p>
 <div class="map">${chips}</div>
 <p class="small">${tt(`${NQ} questions per stage · ${PASS} right to pass · the more you play a stage, the harder it gets`,`${NQ} domande per tappa · ${PASS} giuste per passare · più rigiochi una tappa, più diventa difficile`)}</p>
 <div class="row"><button class="main" id="go">${fin?tt('Play the big review','Rigioca il grande ripasso'):PR.done?tt('Continue · stage ','Continua · tappa ')+(cur+1):tt('Start the first lesson','Inizia la prima lezione')}</button></div>
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('start').hidden=false;$('end').hidden=true;
 $('go').onclick=()=>begin(fin?12:cur);document.querySelectorAll('.map button[data-st]').forEach(b=>b.onclick=()=>begin(+b.dataset.st))}

function begin(si){audio();if(AC.state==='suspended')AC.resume();if(!PR.met){PR.met=1;saveP()}$('start').hidden=true;$('end').hidden=true;SES={si,i:0,right:0,res:[],q:null,phase:'lesson',step:0,demo:null};
 // the lesson is told the first time; when you play a stage again, the maestro only reminds you
 if(PR.plays[si])lessonShort();else lesson(0)}
function exampleBtns(ex){return ex.map((e,k)=>`<button class="ex" data-ex="${k}">▶ ${T2(e.lab)}</button>`).join('')}
function playEx(e){if(e.mel){playMel(e.mel);SES.demo=null;return}if(e.same){const a=ri(58,66);playPair(a,a);SES.demo={n:0,d:1};return}
 if(e.harm){const a=ri(55,62);playPair(a,a+IV[e.harm].s,{harm:true});SES.demo={n:IV[e.harm].s,d:1,ans:e.harm,harm:true};return}
 const n=e.st??IV[e.iv].s,d=e.d||1;const[a,b]=mkPair(n,d,0);playPair(a,b);SES.demo={n,d,ans:e.iv}}
function lesson(k){const L_=LES[SES.si],s=L_[k];SES.phase='lesson';SES.step=k;hdr();say(T2(s.say),k%2?'s':'a');const last=k===L_.length-1;
 setBar(`<div class="row">${exampleBtns(s.ex)}</div><div class="row">${k?`<button id="back">‹</button>`:''}<button class="main" id="next">${last?tt('Let’s start! ▸','Iniziamo! ▸'):tt('Next ▸','Avanti ▸')}</button></div>`);
 bar.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{bar.querySelectorAll('.ex').forEach(x=>x.classList.remove('on'));b.classList.add('on');playEx(s.ex[+b.dataset.ex])});
 if(s.ex.length){const first=bar.querySelector('[data-ex="0"]');setTimeout(()=>{if(SES&&SES.phase==='lesson'&&SES.step===k){first.classList.add('on');playEx(s.ex[0])}},450)}else SES.demo=null;
 $('next').onclick=()=>{hush();last?question():lesson(k+1)};const bk=$('back');if(bk)bk.onclick=()=>{hush();lesson(k-1)}}
function lessonShort(){SES.phase='lesson';hdr();const st=ST[SES.si],g_=giro(SES.si);
 const txt=g_>=2&&!ST[SES.si].all?tt('Again? Bravo! This time <b>no song hints</b> on the buttons: only your ears.','Di nuovo? Bravo! Stavolta <b>niente canzoncine</b> sui pulsanti: solo le tue orecchie.'):tt('Welcome back! This time it is a little harder: notes higher and lower, and new sounds.','Bentornato! Stavolta è un po’ più difficile: note più alte e più basse, e suoni nuovi.');
 say(txt,(PR.plays[SES.si]|0)%2?'a':'s');const all=LES[SES.si].flatMap(s=>s.ex);SES.demo=null;
 setBar(`<div class="row">${exampleBtns(all.slice(0,6))}</div><div class="row"><button id="les">${tt('The whole lesson','Tutta la lezione')}</button><button class="main" id="next">${tt('Let’s start! ▸','Iniziamo! ▸')}</button></div>`);
 bar.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{bar.querySelectorAll('.ex').forEach(x=>x.classList.remove('on'));b.classList.add('on');playEx(all[+b.dataset.ex])});
 $('next').onclick=()=>{hush();question()};$('les').onclick=()=>lesson(0)}

const PRAISE=[['Bravissimo!','Bravissimo!'],['Wunderbar!','Wunderbar!'],['Golden ears!','Orecchio d’oro!'],['Exactly!','Esatto!'],['Perfect!','Perfetto!'],['Magnifique!','Magnifico!'],['Yes!','Sì!']];
const SOFT=[['Almost!','Quasi!'],['So close!','Ci sei quasi!'],['Good try!','Bel tentativo!'],['Nearly there!','Manca poco!']];
function question(){const q=gen(SES.si,SES.i);SES.q=q;SES.phase='q';SES.ansd=false;hdr();SPK=SES.i%2?'s':'a';say(SES.i===0?tt('Listen…','Ascolta…'):pick([['Listen…','Ascolta…'],['Next one!','La prossima!'],['Here it comes…','Ecco…']].map(T2)));
 const st=ST[SES.si],opts=BIN[st.k]?BIN[st.k].map(([k,ic,n])=>[k,`<span class="ic">${ic}</span>${T2(n)}`]):q.ch.map(k=>[k,ansBtn(k,q,SES.si)]);
 const cols=opts.length<=2?2:opts.length===4?(W<620?2:4):Math.min(opts.length,W<620?3:5);
 setBar(`<div class="row"><button id="rep">▶ ${tt('Listen again','Riascolta')}</button></div><div class="ans" style="--n:${cols}">${opts.map(([k,h],j)=>`<button data-a="${k}" title="${j+1}">${h}</button>`).join('')}</div>`);
 $('rep').onclick=playQ;bar.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(b.dataset.a,b));setTimeout(()=>{if(SES&&SES.q===q)playQ()},350)}
function answer(k,btn){if(SES.ansd)return;SES.ansd=true;const q=SES.q,ok=k===q.ans;SES.res[SES.i]=ok?1:0;if(ok)SES.right++;else if(IV[q.ans])PR.miss[q.ans]=(PR.miss[q.ans]|0)+1;if(ok&&IV[q.ans]&&PR.miss[q.ans])PR.miss[q.ans]--;
 const box=bar.querySelector('.ans');box.classList.add('done');bar.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(b.dataset.a===q.ans)b.classList.add('right')});if(!ok)btn.classList.add('wrong');
 SES.phase='fb';SES.fbT=T;hdr();ding(ok);
 const v=IV[q.ans],song=v&&!q.harm?(q.d>0?v.up:v.dn):null;
 if(ok){const B=L.b;ANT={x:B.x+B.w*.5,y:B.y+B.h*.5,t:0};
  say(T2(pick(PRAISE))+(v?' '+(q.harm?tt(`A ${T2(v.n)}: ${T2(v.ha)}.`,`Una ${T2(v.n)}: ${T2(v.ha)}.`):`${cap(T2(v.n))}: ${T2(song.h)}.`):''));
  setBar(`<div class="row"><button id="rep">▶ ${tt('Listen again','Riascolta')}</button>${song&&song.mel?`<button class="ex" id="song">▶ ${song.ic} ${tt('the song','la canzoncina')}</button>`:''}<button class="main" id="next">${tt('Next ▸','Avanti ▸')}</button></div>`+box.outerHTML);
  SES.auto=setTimeout(()=>{if(SES&&SES.phase==='fb'&&SES.q===q)next()},2600)}
 else{const right=labelOf(q.ans,q),mine=labelOf(k,q);
  say(T2(pick(SOFT))+' '+(v?tt(`It was <b>${right}</b>${!q.harm&&song?' — '+T2(song.h):''}. Listen to both:`,`Era <b>${right}</b>${!q.harm&&song?' — '+T2(song.h):''}. Ascoltale tutte e due:`):tt(`It was <b>${right}</b>. Listen again:`,`Era <b>${right}</b>. Riascolta:`)));
  setBar(`<div class="row"><button class="ex" id="cmpA">▶ ${tt('It was','Era')}: ${right}</button><button class="ex" id="cmpB">▶ ${tt('You chose','Hai scelto')}: ${mine}</button>${song&&song.mel?`<button class="ex" id="song">▶ ${song.ic} ${tt('the song','la canzoncina')}</button>`:''}</div><div class="row"><button class="main" id="next">${tt('Next ▸','Avanti ▸')}</button></div>`+box.outerHTML);
  $('cmpA').onclick=playQ;$('cmpB').onclick=()=>playWrong(k);setTimeout(()=>{if(SES&&SES.q===q&&SES.phase==='fb')playQ()},700)}
 const stop=()=>clearTimeout(SES.auto),sg=$('song');if(sg)sg.onclick=()=>{stop();playMel(song.mel,q.a)};const rp=$('rep');if(rp)rp.onclick=()=>{stop();playQ()};
 $('next').onclick=next;saveP()}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* what you chose, from the same first note */
function playWrong(k){const q=SES.q;let n=q.n,d=q.d;if(k==='same')n=0;else if(k==='diff'||k==='jump')n=n||5;else if(k==='step')n=2;else if(k==='up')d=1;else if(k==='down')d=-1;else if(IV[k])n=IV[k].s;
 if(k==='diff'&&!q.n)n=5;playPair(q.a,q.a+n*d,{dur:q.dur,tb:q.tb,harm:q.harm});SES.q2={n,d}}
function next(){clearTimeout(SES.auto);hush();SES.i++;if(SES.i>=NQ)finish();else question()}

function finish(){SES.phase='end';hdr();say('');setBar('');const si=SES.si,r=SES.right,pass=r>=PASS,isNew=pass&&si===PR.done&&PR.done<NS;
 PR.plays[si]=(PR.plays[si]|0)+1;if(!(PR.best[si]>=r))PR.best[si]=r;if(isNew)PR.done++;saveP();
 const n=Math.min(8,Math.ceil(r/2)+(isNew?3:0));let p={};try{p=JSON.parse(localStorage.getItem('igortime_pending'))||{}}catch(e){}
 p.seeds=(p.seeds|0)+n;p.scores=p.scores||{};p.scores.intervals=p.scores.intervals||{};if(!(p.scores.intervals.all>=PR.done))p.scores.intervals.all=PR.done;try{localStorage.setItem('igortime_pending',JSON.stringify(p))}catch(e){}
 const fin=PR.done>=NS,nm=AVN[ME.avatar]||'Igor';
 const msg=pass?(isNew?(fin?tt('You finished every stage! You are a real maestro now. Play them again: they get harder.','Hai finito tutte le tappe! Adesso sei un vero maestro. Rigiocale: diventano più difficili.'):tt('Stage passed! Wunderbar!','Tappa superata! Wunderbar!')):tt('Stage passed again: the next round will be harder!','Tappa superata di nuovo: il prossimo giro sarà più difficile!')):
  r>=5?tt(`So close! You need ${PASS} to pass: one more go and it is yours.`,`Ci sei quasi! Ne servono ${PASS} per passare: un altro giro ed è tua.`):tt('Good work! Listen to the lesson again and try once more: your ears are learning.','Bel lavoro! Riascolta la lezione e riprova: le tue orecchie stanno imparando.');
 if(pass)fanfare();
 $('endCard').innerHTML=`<p class="small">${tt('Stage','Tappa')} ${si+1} · ${T2(ST[si].name)}</p><div class="big">${r}/${NQ}</div><p>${msg}</p>
 ${isNew&&!fin?`<p id="endnew">${tt('New stage open:','Nuova tappa aperta:')} ${ST[PR.done].ic} ${T2(ST[PR.done].name)}</p>`:''}
 <p style="color:var(--warm)">${n?tt(`+${n} tofu seed${n>1?'s':''} for ${nm}’s field. Collect them back on the island.`,`+${n} sem${n>1?'i':'e'} di tofu per il campo di ${nm}. Li ritrovi sull’isola.`):''}</p>
 <div class="row">${isNew&&!fin?`<button class="main" id="nx">${tt('Next stage ▸','Prossima tappa ▸')}</button>`:''}<button ${isNew&&!fin?'':'class="main"'} id="again">${tt('Play this stage again','Rigioca questa tappa')}</button><button id="map">${tt('All the stages','Tutte le tappe')}</button></div>
 <p class="small"><a href="${document.querySelector('a.igback').href}">${tt('← back to the island','← torna all’isola')}</a></p>`;
 $('end').hidden=false;if($('nx'))$('nx').onclick=()=>begin(PR.done);$('again').onclick=()=>begin(si);$('map').onclick=openMap;
 if(PR.done>0)import('/board.js?v=5').then(B=>B.show($('endCard'),'intervals','all',PR.done,ME.avatar,tt('How far everyone got · stages','Fin dove siete arrivati · tappe'))).catch(()=>{})}

addEventListener('keydown',e=>{if(!SES||e.repeat)return;if(SES.phase==='q'){if(e.key===' '||e.key==='r'||e.key==='R'){e.preventDefault();playQ();return}const n=+e.key;if(n>=1){const b=bar.querySelectorAll('[data-a]')[n-1];if(b)b.click()}}
 else if((SES.phase==='fb'||SES.phase==='lesson')&&e.key==='Enter'){e.preventDefault();const b=$('next');b&&b.click()}});
resize();openMap();requestAnimationFrame(frame);
window.__iv={PR,gen:(si,i)=>gen(si,i),ST,IV,get SES(){return SES},begin,answer:k=>{const b=bar.querySelector(`[data-a="${k}"]`);b&&b.click()},next:()=>{const b=$('next');b&&b.click()}};
})();
</script>
