<!doctype html>
<html lang="en"><head><script src="/lang.js?v=2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The kitchen · Igor time</title>
<meta name="description" content="A duration ear-training game: hear a gas flame behind the curtain, then hold the gas for exactly as long and cook Igor's tofu ants to golden perfection.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Fredoka:wght@500;600;700&display=swap">
</head><body>
<script src="/house/kit.js"></script>
<script>
(()=>{
const {TAU,clamp,lerp,ease,rr,drawAnt,drawCurtain,drawRoom}=IgorHouse;
const LEVELS={
 easy:   {name:'Easy',   min:.5,max:2,replays:Infinity,zero:.5, info:'Flames from 0.5 to 2 seconds · listen as often as you like'},
 medium: {name:'Medium', min:.3,max:4,replays:1,       zero:.4, info:'Flames from 0.3 to 4 seconds · you hear it twice'},
 extreme:{name:'Extreme',min:.2,max:6,replays:0,       zero:.32,info:'Flames from 0.2 to 6 seconds · you hear it only once'}};
/* cooking colours: raw → golden (just right) → burnt */
const COOK=['#f8f5ec','#f4e9b8','#f2d34f','#e8a93a','#dd7428','#bf3a26','#6e3a1e'];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function cookCol(c){c=clamp(c,0,6);const i=Math.min(5,Math.floor(c)),f=c-i,a=hex(COOK[i]),b=hex(COOK[i+1]);return`rgb(${a.map((v,k)=>Math.round(lerp(v,b[k],f))).join(',')})`}
const cookOf=(p,r)=>p>6?7:clamp(3+3*Math.log2(Math.max(.01,p)/r),0,6); // 3 = golden, 0 = half the time, 6 = twice the time
const colOf=c=>c>=7?'#3a2f2a':cookCol(c);

/* ---------- sound: a gas flame with a clean start and stop ---------- */
let flameRef=null,flameMe=null;
function crackleBuffer(AC){const sr=AC.sampleRate,n=sr*6,b=AC.createBuffer(1,n,sr),d=b.getChannelData(0);let t=0;
 while(t<n){t+=Math.floor(sr*(-Math.log(1-Math.random()))/22); // about 22 pops a second, at random
  const big=Math.random()<.12,a=(big?.9:.25+Math.random()*.4)*(Math.random()<.5?-1:1),len=Math.floor(sr*(big?.012:.004+Math.random()*.004));
  for(let k=0;k<len&&t+k<n;k++)d[t+k]+=a*Math.exp(-k/(len*.25))*(Math.random()*2-1)}
 return b}
function flame(K){const AC=K.AC;if(!K.CRACK)K.CRACK=crackleBuffer(AC);
 const g=AC.createGain();g.gain.value=0;g.connect(K.OUT);
 // the roar: filtered noise whose colour and level wander slowly
 const src=AC.createBufferSource();src.buffer=K.NOISE;src.loop=true;
 const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=.6;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
 const flut=AC.createGain();flut.gain.value=.8;
 src.connect(hp);hp.connect(bp);bp.connect(lp);lp.connect(flut);flut.connect(g);
 const lfo=(f,depth,param)=>{const o=AC.createOscillator(),d=AC.createGain();o.frequency.value=f*(.8+Math.random()*.4);d.gain.value=depth;o.connect(d);d.connect(param);o.start(AC.currentTime+Math.random())};
 lfo(.37,140,bp.frequency);lfo(1.9,60,bp.frequency);lfo(.53,500,lp.frequency);lfo(3.1,.1,flut.gain);lfo(.71,.08,flut.gain);
 // the crackle: little pops, bright and dry
 const cr=AC.createBufferSource();cr.buffer=K.CRACK;cr.loop=true;const chp=AC.createBiquadFilter();chp.type='highpass';chp.frequency.value=1400;
 const cbp=AC.createBiquadFilter();cbp.type='peaking';cbp.frequency.value=3200;cbp.gain.value=6;const cg=AC.createGain();cg.gain.value=.55;
 cr.connect(chp);chp.connect(cbp);cbp.connect(cg);cg.connect(g);
 src.start(0,Math.random()*3);cr.start(0,Math.random()*5);
 const V=.6;
 return{on(){const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(V,t+.006)},
  off(){const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.008)},
  onFor(d){const t=AC.currentTime+.02;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(V,t+.006);g.gain.setValueAtTime(V,t+d-.008);g.gain.linearRampToValueAtTime(0,t+d)}}}

/* ---------- holding the gas ---------- */
let holding=false,holdT0=0,holdA0=0,holdDur=0;
const canHold=K=>K.phase==='guess'&&K.R&&K.R.played&&!K.refOn&&!holding;
function gasOn(K){if(!canHold(K))return;holding=true;holdT0=K.now();holdA0=K.AC.currentTime;flameMe.on();$gas.classList.add('on');K.R.moved=true}
function gasOff(K){if(!holding)return;holding=false;flameMe.off();holdDur=Math.max(.02,K.AC.currentTime-holdA0);K.R.held=holdDur;$gas.classList.remove('on');K.confirm()}

const K=IgorGame({key:'kitchen',name:'The kitchen',rounds:5,maxRound:100,outfit:'chef',bubble:1.6,levels:LEVELS,
 aria:'Two stoves: on the left a gas flame burns behind a curtain; on the right you hold the gas to cook the tofu ants for the same time',
 title:'The <em>kitchen</em>',
 intro:`<p>Behind the curtain a <b>gas flame</b> is lit for a while: listen to how long it burns.</p>
 <p>Then <b>hold the gas</b> (the big button or the knob) for exactly as long. Same time, and <span class="nm">Igor</span>’s tofu ants come out golden. Too short and they’re raw, too long and they burn.</p>`,
 keys:'keys: L = listen, hold space = gas',
 bar:`<button id="listen" type="button">▶ Listen</button><button id="gas" class="hold" type="button">🔥 Hold the gas</button>`,
 lines:{first:'Listen to the flame…',again:['Again! How long?','Shh. The flame…','Another one. Count with your ears.'],last:'Last one. Golden, please.'},
 revealMs:6200,msgDelay:1300,
 onAudio(K){flameRef=flame(K);flameMe=flame(K)},
 newRound(R,LV){R.ref=Math.exp(lerp(Math.log(LV.min),Math.log(LV.max),Math.random()));R.held=0},
 playRef(R,LV,K){flameRef.onFor(R.ref);return R.ref+.02},
 busy:()=>holding,
 judge(R,LV){const p=R.held,r=R.ref,e=Math.abs(p-r)/r,ms=Math.round(Math.abs(p-r)*1000),short=p<r;
  const pts=e<.03?125:125*(1-e/LV.zero),good=e<.1;R.cook=cookOf(p,r);
  let msg;if(e<.03)msg=['Golden! Spot on.','Perfectly cooked. What timing!'][K.round%2];
  else if(e<.1)msg=['Only '+ms+' ms off. Delicious!','Just '+ms+' ms. Yummy!'][K.round%2];
  else if(e<.3)msg=short?'Nearly golden! Next time hold a little longer.':'Nearly golden! Next time let go a little sooner.';
  else msg=short?'Nice try! The flame burned a bit longer. The next one’s yours.':(p>6?'Extra crispy! Igor loves them anyway. The flame was shorter.':'Nice try! The flame was a bit shorter. You’ll get the next one.');
  return{pts,good,msg}},
 update(K){document.getElementById("gas").disabled=!(canHold(K)||holding)},
 key_down(e,K){if(e.key===' '){e.preventDefault();if(!e.repeat)gasOn(K)}},
 key_up(e,K){if(e.key===' ')gasOff(K)},
 draw});
const $gas=document.getElementById('gas');
$gas.addEventListener('pointerdown',e=>{e.preventDefault();try{$gas.setPointerCapture(e.pointerId)}catch(_){}gasOn(K)});
['pointerup','pointercancel','lostpointercapture'].forEach(k=>$gas.addEventListener(k,()=>gasOff(K)));
/* the knob on the stove works too */
let knob=null;
K.cv.addEventListener('pointerdown',e=>{if(!knob)return;if(Math.hypot(e.clientX-knob.x,e.clientY-knob.y)<knob.r*1.6){try{K.cv.setPointerCapture(e.pointerId)}catch(_){}gasOn(K)}});
['pointerup','pointercancel'].forEach(k=>K.cv.addEventListener(k,()=>gasOff(K)));
K.update();

/* ---------- drawing ---------- */
function drawFlame(g,x,y,r,k,t){if(k<=0)return;g.save();g.globalCompositeOperation='lighter';
 const gr=g.createRadialGradient(x,y,0,x,y,r*1.6);gr.addColorStop(0,`rgba(90,150,255,${.35*k})`);gr.addColorStop(1,'rgba(90,150,255,0)');g.fillStyle=gr;g.fillRect(x-r*2,y-r*2,r*4,r*3);
 const n=16;for(let i=0;i<n;i++){const a=i/n*TAU,cx=x+Math.cos(a)*r*.85,cy=y+Math.sin(a)*r*.2,h=r*(.42+.16*Math.sin(t*23+i*1.7)+.08*Math.sin(t*41+i*3.1))*k,w=r*.1;
  g.fillStyle=`rgba(80,140,255,${.85*k})`;g.beginPath();g.moveTo(cx-w,cy);g.quadraticCurveTo(cx,cy-h*1.4,cx+w,cy);g.fill();
  g.fillStyle=`rgba(200,225,255,${.7*k})`;g.beginPath();g.moveTo(cx-w*.45,cy);g.quadraticCurveTo(cx,cy-h*.6,cx+w*.45,cy);g.fill()}
 g.restore()}
function stove(g,cx,top,sw,bot){const x=cx-sw/2,h=bot-top,u=sw;
 g.fillStyle='#3a3533';rr(g,x-4,top-u*.06,sw+8,u*.075,6);g.fill(); // hob
 g.fillStyle='#d9d4c8';rr(g,x,top,sw,h+20,10);g.fill();g.fillStyle='#bdb6a8';g.fillRect(x,top+u*.13,sw,3);
 g.fillStyle='#2b2724';rr(g,x+sw*.12,top+u*.2,sw*.76,Math.max(24,h*.55),8);g.fill(); // oven door
 g.fillStyle='rgba(255,190,120,.12)';rr(g,x+sw*.18,top+u*.24,sw*.64,Math.max(14,h*.35),6);g.fill();
 g.fillStyle='#8c8577';g.fillRect(x+sw*.2,top+u*.165,sw*.6,4); // handle
 return{x,w:sw,r:clamp(sw*.06,11,26),ky:top+u*.065,dy:top+u*.2,dh:Math.max(24,h*.55)}}
function pan(g,cx,cy,pr,t,ants,col,lid,smoke){ // the frying pan with its tofu ants
 g.fillStyle='#3a3533';g.save();g.translate(cx+pr*1.05,cy);g.rotate(-.08);rr(g,0,-pr*.09,pr*1.05,pr*.18,pr*.09);g.fill();g.restore();
 g.fillStyle='#2a2624';g.beginPath();g.ellipse(cx,cy+pr*.08,pr,pr*.36,0,0,TAU);g.fill();
 g.fillStyle='#4a4441';g.beginPath();g.ellipse(cx,cy,pr,pr*.34,0,0,TAU);g.fill();
 g.fillStyle='#1d1a19';g.beginPath();g.ellipse(cx,cy+pr*.02,pr*.86,pr*.27,0,0,TAU);g.fill();
 const k=pr/42;for(const[ax,ay,an]of ants)drawAnt(g,cx+ax*pr,cy+ay*pr,k,an,t,{col,walk:0,leg:'rgba(30,20,12,.9)'});
 if(col==='#3a2f2a'&&smoke>0){for(let i=0;i<3;i++){const u=(t*.6+i/3)%1;g.fillStyle=`rgba(90,90,90,${.35*(1-u)*smoke})`;g.beginPath();g.arc(cx+(i-1)*pr*.4+Math.sin(t*2+i)*6,cy-pr*.2-u*pr*1.4,pr*(.12+.2*u),0,TAU);g.fill()}
  drawFlame(g,cx,cy-pr*.05,pr*.5,.7,t)}
 if(lid>0){const ly=cy-pr*.04-(1-lid)*pr*1.6,lx=cx+(1-lid)*pr*.9,a=lid<1?(1-lid)*.5:0;g.save();g.globalAlpha=Math.min(1,lid*1.4);g.translate(lx,ly);g.rotate(a);
  const gr=g.createLinearGradient(0,-pr*.6,0,0);gr.addColorStop(0,'#c9ccd1');gr.addColorStop(1,'#8d9298');g.fillStyle=gr;g.beginPath();g.ellipse(0,0,pr*.98,pr*.62,0,Math.PI,TAU);g.fill();
  g.fillStyle='#7d8288';g.beginPath();g.ellipse(0,0,pr*.98,pr*.3,0,0,TAU);g.fill();g.fillStyle='#9ca1a7';g.beginPath();g.ellipse(0,-pr*.03,pr*.9,pr*.24,0,0,TAU);g.fill();g.fillStyle='#3a3533';rr(g,-pr*.16,-pr*.72,pr*.32,pr*.16,pr*.06);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-pr*.4,-pr*.32,pr*.14,pr*.06,-.5,0,TAU);g.fill();g.restore()}}
const ANTS=[[-.42,-.02,.3],[.12,-.08,-.4],[.35,.1,2.6],[-.1,.12,3.4]];
function display(g,x,S,lines,col){const sz=clamp(S.w*.075,13,30);g.save();g.textAlign='center';g.shadowColor=col;g.shadowBlur=10;g.fillStyle=col;
 g.font='600 '+Math.round(sz*1.3)+'px "IBM Plex Mono",monospace';g.fillText(lines[0],x,S.dy+S.dh*.42);
 g.font='500 '+Math.round(sz*.8)+'px "IBM Plex Mono",monospace';g.fillText(lines[1],x,S.dy+S.dh*.42+sz*1.3);g.restore()}
/* ---------- a vegan kitchen: utensils, legumes, herbs, tofu ---------- */
function utensil(g,kind,x,y,s,a){g.save();g.translate(x,y);g.rotate(a);g.lineCap='round';g.lineJoin='round';
 g.strokeStyle='#2b2724';g.lineWidth=2*s;g.beginPath();g.arc(0,4*s,3*s,0,TAU);g.stroke(); // the little ring on the hook
 if(kind===3){g.strokeStyle='#a8743f';g.lineWidth=5*s;g.beginPath();g.moveTo(0,8*s);g.lineTo(0,52*s);g.stroke();g.fillStyle='#b8834c';g.beginPath();g.ellipse(0,64*s,9*s,13*s,0,0,TAU);g.fill()}
 else{g.strokeStyle='#9aa1a8';g.lineWidth=4*s;g.beginPath();g.moveTo(0,8*s);g.lineTo(0,kind===2?40*s:50*s);g.stroke();g.strokeStyle='#5b4632';g.lineWidth=6*s;g.beginPath();g.moveTo(0,8*s);g.lineTo(0,24*s);g.stroke();
  if(kind===0){g.fillStyle='#b9c0c7';g.strokeStyle='#7d858c';g.lineWidth=1.5*s;g.beginPath();g.arc(0,60*s,11*s,0,Math.PI);g.closePath();g.fill();g.stroke()}
  else if(kind===1){g.fillStyle='#c3c9cf';rr(g,-9*s,48*s,18*s,24*s,3*s);g.fill();g.strokeStyle='#8a9197';g.lineWidth=1.5*s;for(const dx of[-4,0,4]){g.beginPath();g.moveTo(dx*s,53*s);g.lineTo(dx*s,67*s);g.stroke()}}
  else{g.strokeStyle='#b9c0c7';g.lineWidth=1.6*s;for(const w of[4,8,12]){g.beginPath();g.ellipse(0,56*s,w*s*.75,17*s,0,0,TAU);g.stroke()}}}
 g.restore()}
function jar(g,x,y,w,h,fill,dots,lab){g.fillStyle='rgba(225,240,245,.55)';rr(g,x,y-h,w,h,w*.18);g.fill();g.fillStyle=fill;rr(g,x+2,y-h*.72,w-4,h*.7,w*.15);g.fill();
 if(dots){g.fillStyle=dots;for(let i=0;i<10;i++)g.fillRect(x+3+((i*37)%100)/100*(w-7),y-h*.68+((i*53)%100)/100*h*.6,2,2)}
 g.fillStyle='#b5583a';rr(g,x-1,y-h-4,w+2,6,2);g.fill();if(lab&&w>22){g.fillStyle='#f7ecd4';rr(g,x+w*.12,y-h*.5,w*.76,h*.22,2);g.fill();g.fillStyle='#5b3a22';g.font='600 '+Math.max(6,h*.15)+'px Fredoka,sans-serif';g.textAlign='center';g.fillText(lab,x+w/2,y-h*.34)}}
function decor(g,l,side,t,tall){const p=l.p,s=clamp(Math.min(p.w/640,p.h/800)*(tall?1.6:1.15),.5,1.5),sway=k=>Math.sin(t*1.1+k)*.04;
 // utensil rail
 const ry=p.y+p.h*(tall?.17:.25),x0=l.cx-l.sw*.48,x1=side?l.cx+l.sw*.02:l.cx+l.sw*.48;
 g.fillStyle='#6d747a';rr(g,x0,ry,x1-x0,5*s,2.5*s);g.fill();g.fillStyle='#4b5157';g.beginPath();g.arc(x0,ry+2.5*s,4*s,0,TAU);g.arc(x1,ry+2.5*s,4*s,0,TAU);g.fill();
 const n=Math.max(3,Math.floor((x1-x0)/(30*s)));for(let i=0;i<n;i++)utensil(g,i%4,x0+(i+.5)*(x1-x0)/n,ry+2*s,s,sway(i));
 if(!side)return;
 // shelf with legumes, pasta, rice, tofu and basil
 const sx0=l.cx+l.sw*.16,sx1=Math.min(p.x+p.w-14*s,l.cx+l.sw*.16+190*s),sy=p.y+p.h*(tall?.12:.19);
 g.fillStyle='#8a5a33';rr(g,sx0,sy,sx1-sx0,7*s,3*s);g.fill();g.fillStyle='#6b4426';g.fillRect(sx0+10*s,sy+7*s,4*s,12*s);g.fillRect(sx1-14*s,sy+7*s,4*s,12*s);
 let x=sx0+6*s;const J=[['#e0893a','#b8561f','lentils'],['#f2d34f',null,'pasta'],['#f3efe2','#d8d0bb','rice'],['#d9b26a','#b08848','beans']];
 for(const[f,d,lab]of J){if(x+24*s>sx1-50*s)break;const h=(30+((lab.length*7)%10))*s;jar(g,x,sy,22*s,h,f,d,lab);x+=27*s}
 // tofu box
 if(x+30*s<sx1-28*s){g.fillStyle='#ffffff';g.strokeStyle='#cfd8cf';g.lineWidth=1;rr(g,x,sy-20*s,30*s,20*s,3*s);g.fill();g.stroke();g.fillStyle='#4f9a48';g.font='700 '+Math.round(8*s)+'px Fredoka,sans-serif';g.textAlign='center';g.fillText('TOFU',x+15*s,sy-7*s);x+=34*s}
 // basil pot
 const bx=Math.min(x+12*s,sx1-14*s);g.fillStyle='#c4683f';g.beginPath();g.moveTo(bx-11*s,sy-16*s);g.lineTo(bx+11*s,sy-16*s);g.lineTo(bx+8*s,sy);g.lineTo(bx-8*s,sy);g.closePath();g.fill();
 g.fillStyle='#4f9a48';for(let i=0;i<7;i++){const a=-Math.PI/2+(i-3)*.42+Math.sin(t*1.3+i)*.04;g.beginPath();g.ellipse(bx+Math.cos(a)*11*s,sy-20*s+Math.sin(a)*11*s,6*s,3.6*s,a,0,TAU);g.fill()}
 // garlic braid and chilli string hanging by the window side
 const gx=p.x+p.w-(tall?20:28)*s,gy0=p.y+p.h*(tall?.04:.09);g.strokeStyle='#c9a46a';g.lineWidth=2*s;g.beginPath();g.moveTo(gx,gy0);g.lineTo(gx+Math.sin(t)*2,gy0+70*s);g.stroke();
 for(let i=0;i<5;i++){const yy=gy0+14*s+i*12*s,xx=gx+(i%2?5:-5)*s;g.fillStyle='#f4efe4';g.beginPath();g.arc(xx,yy,6.5*s,0,TAU);g.fill();g.strokeStyle='#d7cdb8';g.lineWidth=1;g.beginPath();g.moveTo(xx,yy-6*s);g.lineTo(xx,yy+6*s);g.stroke()}
 const cx2=gx-24*s;g.strokeStyle='#7a5a2e';g.lineWidth=1.5*s;g.beginPath();g.moveTo(cx2,gy0);g.lineTo(cx2,gy0+60*s);g.stroke();
 for(let i=0;i<5;i++){const yy=gy0+10*s+i*11*s,d=i%2?1:-1;g.fillStyle='#d8352a';g.beginPath();g.moveTo(cx2,yy);g.quadraticCurveTo(cx2+d*9*s,yy+3*s,cx2+d*6*s,yy+12*s);g.quadraticCurveTo(cx2+d*2*s,yy+5*s,cx2,yy);g.fill();g.fillStyle='#3f8a3a';g.fillRect(cx2-1.5*s,yy-2*s,3*s,3*s)}}
function clock(g,x,y,r){const d=new Date(),h=d.getHours()%12+d.getMinutes()/60,m=d.getMinutes()+d.getSeconds()/60;
 g.fillStyle='#fff8ea';g.strokeStyle='#6b4426';g.lineWidth=Math.max(2,r*.16);g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.stroke();
 g.strokeStyle='#2b2018';g.lineCap='round';for(let i=0;i<12;i++){const a=i/12*TAU;g.lineWidth=1.2;g.beginPath();g.moveTo(x+Math.cos(a)*r*.78,y+Math.sin(a)*r*.78);g.lineTo(x+Math.cos(a)*r*.9,y+Math.sin(a)*r*.9);g.stroke()}
 const hand=(a,L,w)=>{g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.sin(a)*L,y-Math.cos(a)*L);g.stroke()};hand(h/12*TAU,r*.5,Math.max(2,r*.12));hand(m/60*TAU,r*.75,Math.max(1.5,r*.08))}
function label(g,x,y,txt,col,sub){g.save();g.font='600 '+(sub?14:17)+'px Fredoka,sans-serif';g.textAlign='center';const w=g.measureText(txt).width+22;
 g.fillStyle='#f7ecd4';g.strokeStyle='#2b2018';g.lineWidth=2.5;rr(g,x-w/2,y-15,w,28,12);g.fill();g.stroke();g.fillStyle=col||'#2b2018';g.fillText(txt,x,y+5);g.restore()}

function draw(K,dt){const g=K.g,W=K.W,H=K.H,t=K.T,R=K.R,{tall,P}=IgorHouse.panels(W,H);
 const open=K.phase==='reveal'||K.phase==='end'?clamp(K.revT/.9,0,1):0,rev=R&&(K.phase==='reveal'||K.phase==='end')&&R.cook!=null;
 g.fillStyle='#140d09';g.fillRect(0,0,W,H);
 let L=[];
 for(const [side,p] of P.entries()){g.save();g.beginPath();g.rect(p.x,p.y,p.w,p.h);g.clip();
  const top=p.y+p.h*(tall?.6:.6),bot=p.y+p.h;
  drawRoom(g,p.x,p.w,p.h,{y0:p.y,floorY:p.y+p.h*(tall?.86:.8),wall:['#f3e1bd','#e5c99a']});
