<script>

/* Igor’s Music Pinball (21 Nov 2026, v2) — the pinball of the bar on Igor’s island.
   Physics in 2D on the playfield (x across, y up the table, ball radius .27, gravity along the table),
   drawn in 3D with three.js r128. Seven note lanes at the top (C…B): each mission asks for a chord,
   shown on the apron display; a complete chord plays a brass fanfare and lights the ramp jackpot.
   The bumpers are a drum kit (kick, snare, cymbal) feeding a GROOVE meter (playfield multiplier).
   ANT bank ×3 lights POLIFONIA (multiball) at the ramp: the note lanes close and sound when hit.
   One tofu ant walks around: eating it turns on Igor’s ball saver. Rewards go to igortime_pending. */
(()=>{
'use strict';
const LANG=(()=>{try{return localStorage.getItem('igortime_lang')||((navigator.language||'').toLowerCase().startsWith('it')?'it':'en')}catch(e){return'en'}})();
const IT=LANG==='it',tt=(e,i)=>IT?i:e,L2=a=>Array.isArray(a)?(IT?a[1]:a[0]):a;
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,IT?'.':',');
const IGSRC=window.IGOR_SRC||'/igor.webp';
if(window.IGOR_SRC){$('tImg').src=IGSRC}
const IH=window.IgorHouse||null;
const BEST_K='igortime_flipper_best';
const getBest=()=>{try{return+localStorage.getItem(BEST_K)||0}catch(e){return 0}};

/* ================= music: notes and chord missions ================= */
const NOTE_N=IT?['DO','RE','MI','FA','SOL','LA','SI']:['C','D','E','F','G','A','B'];
const NOTE_M=[60,62,64,65,67,69,71];
const NOTE_C=['#ff5a5a','#ff9a3c','#ffd84a','#7fd96a','#4fd1e8','#6a86ff','#c77dff'];
const MIS=[
 {N:['C major','Do maggiore'],n:[0,2,4]},
 {N:['A minor','La minore'],n:[5,0,2]},
 {N:['F major','Fa maggiore'],n:[3,5,0]},
 {N:['G seventh','Sol settima'],n:[4,6,1,3]},
 {N:['D minor seventh','Re minore settima'],n:[1,3,5,0]},
 {N:['C major seventh','Do settima maggiore'],n:[0,2,4,6]},
 {N:['The whole scale!','Tutta la scala!'],n:[0,1,2,3,4,5,6]}];
/* the chord as pitches, in root position from its first note */
function chordMidi(n){const r=[];let last=-1;for(const k of n){let m=NOTE_M[k]-12;while(m<=last)m+=12;r.push(m);last=m}return r}
const chordNames=mi=>mi.n.map(k=>NOTE_N[k]).join(' · ');
let THEME='home';
const MODES=[
 {k:'chords',N:['Chords','Accordi'],ic:'🎹',T:80,need:3,how:['Light the notes of 3 chords in the top lanes!','Accendi nelle corsie in alto le note di 3 accordi!']},
 {k:'drums',N:['Drum solo','Assolo di batteria'],ic:'🥁',T:40,need:40,how:['Drum solo: hit the drums 40 times!','Assolo: colpisci la batteria 40 volte!']},
 {k:'ff',N:['Fortissimo','Fortissimo'],ic:'💥',T:50,need:3,how:['Knock down the statue: only fortissimo hits count!','Abbatti la statua: valgono solo i colpi fortissimo!']},
 {k:'ear',N:['Which note?','Che nota è?'],ic:'👂',T:60,need:3,how:['Listen to my note and hit its lane!','Ascolta la mia nota e prendi la sua corsia!']},
 {k:'key',N:['Key signature','Armatura'],ic:'♯',T:60,need:1,how:['Each lane: natural, sharp, flat. Set the right key signature!','Ogni corsia: naturale, diesis, bemolle. Metti l’armatura giusta!']},
 {k:'metro',N:['Metronome','Metronomo'],ic:'⏱',T:60,need:3,how:['Ramps and orbits on the beat of the metronome!','Rampe e orbite a tempo col metronomo!']},
 {k:'tune',N:['Melody','Melodia'],ic:'🎶',T:60,need:1,how:['Play the melody: take the lanes in order!','Suona la melodia: prendi le corsie in ordine!']}];
const RANKS=[['Student','Allievo'],['Player','Orchestrale'],['Soloist','Solista'],['Concertmaster','Primo violino'],['Maestro','Maestro'],['Soloist star','Solista stella'],['Conductor','Direttore']];
const KEYS=[{N:['G major','Sol maggiore'],a:{3:1}},{N:['F major','Fa maggiore'],a:{6:-1}},{N:['D major','Re maggiore'],a:{3:1,0:1}},{N:['B♭ major','Si♭ maggiore'],a:{6:-1,2:-1}}];
const TUNES=[{N:['Frère Jacques','Fra Martino'],n:[0,1,2,0]},{N:['Ode to Joy','Inno alla gioia'],n:[2,2,3,4]},{N:['Twinkle Twinkle','Brilla brilla stellina'],n:[0,0,4,4]},{N:['Happy Birthday','Tanti auguri'],n:[4,4,5,4]}];
const DYN=['pp','p','mp','mf','f','ff'];
const ACC=['','♯','♭'],accOf=v=>v===1?'♯':v===-1?'♭':'';


/* ================= audio ================= */
let MUTE=false;try{MUTE=localStorage.getItem('igortime_flipper_mute')==='1'}catch(e){}
const A={c:null};
function ac(){if(!A.c){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=A.c=new C();A.m=c.createGain();A.m.gain.value=MUTE?0:.9;
  const cp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=5;A.m.connect(cp);cp.connect(c.destination);
  const n=c.sampleRate*1.2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;A.noise=b;
  const rl=Math.floor(c.sampleRate*(MOBILE?1.2:2.4)),rb=c.createBuffer(2,rl,c.sampleRate);for(let ch=0;ch<2;ch++){const dd=rb.getChannelData(ch);for(let i=0;i<rl;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3.2)}
  A.rv=c.createConvolver();A.rv.buffer=rb;const rg=c.createGain();rg.gain.value=.3;A.rv.connect(rg);rg.connect(A.m)}
 if(A.c.state==='suspended')A.c.resume();return A.c}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function out(node,o){const c=A.c;let n=node;if(o.pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);n.connect(p);n=p}n.connect(A.m);if(o.rv)n.connect(A.rv)}
function osc(o){const c=A.c;if(!c||MUTE)return;const t=c.currentTime+(o.t||0),a=o.a??.004,d=o.d??.2,v=o.v??.2;
 const s=c.createOscillator(),g=c.createGain();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.g||d));if(o.det)s.detune.value=o.det;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.hold)g.gain.setValueAtTime(v,t+a+o.hold);g.gain.exponentialRampToValueAtTime(.0007,t+a+(o.hold||0)+d);s.connect(g);let n=g;
 if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);if(o.lp2){f.frequency.linearRampToValueAtTime(o.lp2,t+a+.08);f.frequency.exponentialRampToValueAtTime(o.lp,t+a+(o.hold||0)+d)}g.connect(f);n=f}
 out(n,o);s.start(t);s.stop(t+a+(o.hold||0)+d+.05)}
function nz(o){const c=A.c;if(!c||MUTE)return;const t=c.currentTime+(o.t||0),d=o.d??.05,v=o.v??.2;const s=c.createBufferSource();s.buffer=A.noise;
 const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||2000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+d);f.Q.value=o.q||1;
 const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.002));g.gain.exponentialRampToValueAtTime(.0007,t+(o.a||.002)+d);
 s.connect(f);f.connect(g);out(g,o);s.start(t,Math.random()*.5);s.stop(t+d+.1)}
const panX=x=>(x-.4)/5;
function brass(m,t,hold,v=.07){for(const det of[-8,7])osc({f:mtof(m),type:'sawtooth',det,a:.05,hold,d:.5,v,lp:700,lp2:2600,t,rv:1})}
const SND={
 flip:s=>{nz({f:2600,q:1.4,v:.18,d:.04,pan:s*.45});osc({f:150,f2:55,v:.2,d:.07,pan:s*.45});nz({f:500,f2:2400,q:3,v:.12,d:.09,pan:s*.45})},
 kick:x=>{osc({f:160,f2:42,g:.12,v:.55,d:.28,pan:panX(x)});nz({f:3000,v:.08,d:.015})},
 snare:x=>{nz({f:1900,q:.7,v:.38,d:.18,pan:panX(x),rv:1});osc({f:200,f2:160,type:'triangle',v:.2,d:.1,pan:panX(x)})},
 cymbal:x=>{nz({f:7000,ft:'highpass',v:.18,d:1.1,pan:panX(x),rv:1});nz({f:9500,q:3,v:.1,d:.6,pan:panX(x)});osc({f:3300,type:'square',lp:9000,v:.015,d:.5})},
 sling:x=>{osc({f:mtof(chordMidi(MIS[GS.mi].n)[0]-12),type:'square',lp:800,v:.18,d:.2,pan:panX(x)});nz({f:1400,v:.14,d:.04,pan:panX(x)})},
 wall:v=>nz({f:4200,q:2,v:Math.min(.07,v*.005),d:.018}),
 note:(k,loud)=>{const m=NOTE_M[k]+12;osc({f:mtof(m),v:loud?.22:.12,d:.9,rv:1});osc({f:mtof(m)*2,v:loud?.08:.04,d:.5,rv:1});osc({f:mtof(m)*3.01,v:.03,d:.25})},
 noteBrass:k=>brass(NOTE_M[k],0,.18,.09),

/* plunger: most of the travel is spent on the useful range (top lanes, the secret gap by the DO lane, the orbit) */
const plungeV=c=>c<.15?31+c/.15*2.5:c<.85?33.5+(c-.15)/.7*5:38.5+(c-.85)/.15*7.5;
let RAMP_VY=4.5;const GOLD=[.55,.7];
/* the golden plunge: the ball rides the top arc and drops through the secret passage next to the DO lane, onto the small flipper */
/* the alley pass: hold a flipper up while the ball comes down its inlane, and the ball rolls under it to the other flipper, always the same way */
function alleyPass(b,s){ const pts=[V(b.x,b.y,R),V(1.75*s,2.72,R),V(.8*s,2.38,R),V(-.2*s,2.3,R),V(-1.15*s,2.62,R)];b.gp=new THREE.CatmullRomCurve3(pts);b.u=0;b.ps=s;b.mode='pass';SND.roll();addScore(2000)}
function goldPath(b){const a0=Math.atan2(b.y-16,b.x-.4),pts=[];for(let a=a0;a<2.35;a+=.12)pts.push(V(.4+4.73*Math.cos(a),16+4.73*Math.sin(a),R));
 pts.push(V(-2.45,18.35,R),V(-2.62,17.4,R),V(-2.7,16.35,R));const c=new THREE.CatmullRomCurve3(pts);b.gp=c;b.glen=c.getLength();b.u=0;b.spd=Math.max(9,Math.hypot(b.vx,b.vy));b.mode='guide'}
function launch(b,c){b.mode='play';b.y=PLUNGE.y;b.vx=0;b.vy=plungeV(c);b.gold=!b.auto0&&c>=GOLD[0]&&c<=GOLD[1];SND.launch();GS.skillT=4;hint(null);if(GS.save<=0&&!GS.multi&&!b.auto0)setSave(10)}

  multi:false,save:0,combo:0,comboT:0,ants:0,antsEver:0,ramps:0,orbits:0,drums:0,notes:0,extraGiven:0,kb:[1,1],cb:0,mode:-1,modeT:0,mp:0,done:[false,false,false,false,false,false,false],rank:0,sel:0,flag:0,ready:false,finale:0});FFS.on=false;updVariants();flagTex();
 DROPS.forEach((s,i)=>{s.on=true;DMESH[i].y=.23});GATES.forEach(g=>g.on=false);setMission(0);serve();MU.on=true;antT=4;MU.bpm=88;MU.en=0;

/* ================= missions (like the old Space Cadet): choose with the flag, start at the Stage ================= */
/* Hit the spinning flag (banderuola) to choose a mission: 3 hits light "mission ready" at the Stage (the saucer).
   The Stage holds the ball, Igor explains, the mission starts with a timer. Each mission completed = a new rank.
   All seven = GRAN CONCERTO (4-ball multiball, everything ×2). */
const MODE=()=>GS.mode>=0?MODES[GS.mode].k:null;
const METRO_P=.8;
function nextSel(from){for(let i=1;i<=7;i++){const j=(from+i)%7;if(!GS.done[j])return j}return from}
const THEME_OF={chords:'home',drums:'shroom',ff:'lake',ear:'lake',key:'carib',metro:'carib',tune:'carib'};
function startMode(i){const m=MODES[i];{const tk=THEME_OF[m.k];if(tk!==THEME){setTheme(tk,true);burst(0,10,1,TH[tk].acc,50,6);if(tk!=='home')setTimeout(()=>{if(GS.mode===i)say(L2(TH[tk].hi),3.2,false)},4800)}}GS.mode=i;GS.modeT=m.T;GS.mp=0;GS.ready=false;GS.flag=0;GS.lit=[0,0,0,0,0,0,0];
 if(m.k==='chords')setMission((GS.mi+1)%6);
 if(m.k==='ff'){FFS.on=true;GS.ffHits=0;FFM.t=0;ffBar(-1)}
 if(m.k==='ear'){GS.ear=Math.random()*7|0;GS.earT=1.2}
 if(m.k==='key'){GS.key=pick(KEYS);GS.acc=[0,0,0,0,0,0,0]}
 if(m.k==='metro')GS.metro0=GS.t;
 if(m.k==='tune'){GS.tune=pick(TUNES);GS.tuneI=0}
 updVariants();SND.fanfare([0,2,4]);flash(.4);[SPR.igor,SPR.host].forEach(s=>jump(s,1));
 dmsg([tt('MISSION','MISSIONE'),L2(m.N).toUpperCase().slice(0,16)],2.6,true,4);
 const extra=m.k==='key'?` ${L2(GS.key.N)}: ${Object.keys(GS.key.a).map(k=>NOTE_N[k]+accOf(GS.key.a[k])).join(' ')}`:m.k==='tune'?` ${L2(GS.tune.N)}: ${GS.tune.n.map(k=>NOTE_N[k]).join(' ')}`:'';
 say(L2(m.how)+extra,4.2,true);misUI()}
function completeMode(){const m=MODES[GS.mode];startCB();const v=300000*(GS.rank+1);addScore(v,0,10,'#ffd36e',true);GS.done[GS.mode]=true;GS.rank=Math.min(RANKS.length-1,GS.rank+1);
 SND.fanfare([0,2,4,6]);flash(.8);GS.shake=.5;[SPR.igor,SPR.host,SPR.d1,SPR.d2].forEach(s=>jump(s,1));MU.en=1;burst(0,10,1,'#ffd36e',60,7);
 dmsg([L2(m.N).toUpperCase().slice(0,16),tt('COMPLETE!','COMPIUTA!')],2.6,true,4);
 setTimeout(()=>{if(GS.state==='play'||GS.state==='bonus'){dmsg([tt('NEW RANK','NUOVO GRADO'),L2(RANKS[GS.rank]).toUpperCase().slice(0,16)],2.4,true,3);say(tt(`Mission complete! You are now: ${L2(RANKS[GS.rank])}!`,`Missione compiuta! Ora sei: ${L2(RANKS[GS.rank])}!`),3.4,true)}},2700);
 {const nd=GS.done.filter(Boolean).length;if(nd===4||nd===7){GS.balls++;setTimeout(()=>{dmsg([tt('EXTRA','PALLA'),tt('BALL!','EXTRA!')],2,true,3);say(tt(`Mission ${nd}: extra ball! Igor is so happy!`,`Missione ${nd}: palla extra! Igor è felicissimo!`),2.8,true)},5400)}}

 say(tt('All seven missions! GRAN CONCERTO: four balls and everything is worth double!','Tutte e sette le missioni! GRAN CONCERTO: quattro palline e tutto vale doppio!'),4,true);
 for(let k=0;k<3;k++)setTimeout(()=>{if(GS.state!=='play')return;const nb=newBall(SAUCER.x,SAUCER.y,'hole');nb.u=.7;nb.awarded=1},400+k*700)}

function flagHit(){FLAGM.w=Math.min(26,FLAGM.w+14);SND.target(FLAG.x);addScore(2000,FLAG.x,FLAG.y,'#ffd36e');if(GS.state!=='play'||GS.mode>=0||GS.ready||GS.finale>0)return;

 if(GS.flag>=3){GS.ready=true;dmsg([tt('MISSION READY','MISSIONE PRONTA'),tt('TO THE STAGE!','AL PALCO!')],2.2,true,3);say(tt(`${L2(m.N)} is ready: send the ball to the Stage!`,`${L2(m.N)} è pronta: manda la pallina nel Palco!`),3,true)}
 else dmsg([tt('FLAG','BANDERUOLA')+` ${GS.flag}/3`,L2(m.N).toUpperCase().slice(0,16)],1.4,false,2);misUI()}
/* lanes: what a note lane does depends on the mission */
function laneHit(k,x){const m=MODE();
 if(m==='chords')return lightNote(k,x,18.2);
 if(m==='ear'){SND.note(k);if(k===GS.ear){GS.mp++;addScore(60000,x,18.2,NOTE_C[k],true);SND.noteBrass(k);burst(x,17.5,.5,NOTE_C[k],24,4);jump(SPR.igor,1);

  else{addScore(2000,x,18.2,NOTE_C[k]);say(tt(`That’s ${NOTE_N[k]}: mine is ${NOTE_M[GS.ear]>NOTE_M[k]?'higher':'lower'}!`,`Questo è il ${NOTE_N[k]}: il mio è più ${NOTE_M[GS.ear]>NOTE_M[k]?'alto':'basso'}!`),2.4,true);GS.earT=1.4}return}
 if(m==='key'){const a=GS.acc;a[k]=a[k]===0?1:a[k]===1?-1:0;osc({f:mtof(NOTE_M[k]+12+a[k]),v:.15,d:.6,rv:1});pop(x,18.4,NOTE_N[k]+accOf(a[k]),NOTE_C[k],true);addScore(3000);
  if(a.every((v,i)=>v===(GS.key.a[i]||0))){GS.mp=1;const sc=[0,1,2,3,4,5,6,7].map(i=>NOTE_M[i%7]+12*(i>>3?1:0)+(GS.key.a[i%7]||0));sc.forEach((mm,i)=>osc({f:mtof(mm+12),type:'triangle',v:.12,d:.3,t:i*.12,rv:1}));completeMode()}return}
 if(m==='tune'){const T=GS.tune;if(k===T.n[GS.tuneI]){GS.tuneI++;SND.noteBrass(k);SND.note(k,1);addScore(20000,x,18.2,NOTE_C[k],true);burst(x,17.5,.4,NOTE_C[k],14,3);
   if(GS.tuneI>=T.n.length){GS.mp=1;T.n.forEach((kk,i)=>osc({f:mtof(NOTE_M[kk]+12),type:'triangle',v:.14,d:.35,t:.3+i*.3,rv:1}));completeMode()}}
  else{SND.note(k);addScore(1000);say(tt(`Now ${NOTE_N[T.n[GS.tuneI]]}!`,`Ora il ${NOTE_N[T.n[GS.tuneI]]}!`),1.6,false)}return}
 /* no mission: the scale */
 if(!GS.lit[k]){GS.lit[k]=1;SND.note(k,1);addScore(3000,x,18.2,NOTE_C[k]);if(GS.lit.every(v=>v)){GS.bx=Math.min(6,GS.bx+1);addScore(100000,.3,17,'#ffd36e',true);dmsg([tt('SCALE!','SCALA!'),`BONUS ${GS.bx}X`],1.8,true,3);
   [0,1,2,3,4,5,6].forEach(i=>osc({f:mtof(NOTE_M[i]+12),type:'triangle',v:.1,d:.25,t:i*.08,rv:1}));setTimeout(()=>{if(MODE()===null)GS.lit=[0,0,0,0,0,0,0]},1200)}}
